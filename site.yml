---
# ===========================================================================
#  Antares-Web + optional Slurm cluster
#
#  Full deployment:        ansible-playbook site.yml
#  Antares-Web only:       ansible-playbook site.yml -e slurm_enabled=false
#  Cluster only:           ansible-playbook site.yml --limit slurm
#  Re-deploy the web app:  ansible-playbook site.yml --tags antares_web
#
#  Note: slurm.conf is generated from the facts of every compute node, so
#  avoid running with --limit on a subset of `slurm_compute` unless you pin
#  slurm_node_cpus / slurm_node_real_memory in the inventory.
# ===========================================================================

- name: Gather facts from every machine
  hosts: all
  # gather_facts is a no-op whenever the jsonfile cache is still valid,
  # including after the machine behind this name has been rebuilt as a
  # different distribution. The setup module always talks to the host and
  # refreshes the cache; hosts not in this play (--limit) keep theirs, which
  # is what the firewall needs for peer addresses.
  gather_facts: false
  tags: always
  roles:
    - antares_defaults

  tasks:
    - name: Gather facts
      ansible.builtin.setup:

- name: Base configuration
  hosts: all
  become: true
  tags: common
  roles:
    - antares_defaults
    - common

# Firewall, fail2ban, sshd and unattended upgrades. Early on purpose: a machine
# that is going to be reachable on the internet should not spend the length of
# a full deployment with everything open. Only the input hook is filtered, so
# nothing here gets in the way of what follows.
- name: Hardening
  hosts: all
  become: true
  tags: hardening
  roles:
    - antares_defaults
    - role: hardening
      when: hardening_enabled | bool

# The node exporter, on every machine of the inventory. Early on purpose, and
# for the same reason as the hardening play above: what is deployed first is
# what is watching while the rest of the run happens, and the first thing an
# operator asks of a machine that misbehaved during a deployment is what its
# memory and its disks were doing at the time. It depends on nothing else, so
# there is nothing to wait for.
#
# The role runs whatever monitoring_enabled says: turning it back off is what
# takes the exporters down, rather than leaving them behind on every machine
# of a fleet that no longer collects them.
- name: Monitoring - the node exporter of every machine
  # Not `all`: a builder is listed in the same inventory in the example file,
  # it is a machine that exists for the length of a build, and Prometheus does
  # not scrape it. An exporter nobody reads is one more container to explain.
  hosts: all:!builder
  become: true
  tags: monitoring
  roles:
    - antares_defaults
    - role: podman
      when: monitoring_enabled | bool
    - monitoring_node

# ---------------------------------------------------------------------------
#  Slurm cluster
# ---------------------------------------------------------------------------

- name: Shared /home - NFS server on the Slurm front-end
  hosts: slurm_frontend
  become: true
  tags: [slurm, nfs]
  roles:
    - antares_defaults
    - role: nfs_server
      when: slurm_enabled | bool

- name: Shared /home - NFS clients on the compute nodes
  hosts: slurm_compute
  become: true
  tags: [slurm, nfs]
  roles:
    - antares_defaults
    - role: nfs_client
      when: slurm_enabled | bool

- name: Munge - shared authentication key
  hosts: slurm
  become: true
  tags: [slurm, munge]
  roles:
    - antares_defaults
    - role: munge
      when: slurm_enabled | bool

- name: Slurm - packages and configuration common to every node
  hosts: slurm
  become: true
  tags: slurm
  roles:
    - antares_defaults
    - role: slurm_common
      when: slurm_enabled | bool

- name: Slurm front-end - accounting database and controller
  hosts: slurm_frontend
  become: true
  tags: slurm
  roles:
    - antares_defaults
    - role: podman
      when: slurm_enabled | bool and slurmdbd_enabled | bool
    - role: slurm_frontend
      when: slurm_enabled | bool
    # After the controller it reads and the munge it authenticates through,
    # both of which are installed by the roles above. Like every monitoring
    # role it runs whatever the switches say, so that turning either off takes
    # the container down.
    - role: monitoring_slurm
      tags: monitoring
      when: slurm_enabled | bool

- name: Slurm compute nodes
  hosts: slurm_compute
  become: true
  tags: slurm
  roles:
    - antares_defaults
    - role: slurm_compute
      when: slurm_enabled | bool

- name: Shared /home - solvers and Antares launch script
  hosts: slurm_frontend
  become: true
  tags: [slurm, solver]
  roles:
    - antares_defaults
    - role: antares_solver
      when: slurm_enabled | bool
      vars:
        antares_solver_dest: "{{ slurm_solvers_dir }}"
    - role: slurm_launch_script
      when: slurm_enabled | bool

# Antares-Xpansion, off by default. The package goes into the shared /home,
# which only the front-end writes to, while the MPI runtime `benders` is
# linked against has to be on every machine that runs it - hence the whole
# group here, with the role sorting out which half lands where.
- name: Antares-Xpansion - package in the shared /home, MPI runtime everywhere
  hosts: slurm
  become: true
  tags: [slurm, xpansion]
  roles:
    - antares_defaults
    - role: antares_xpansion
      when: slurm_enabled | bool and antares_xpansion_enabled | bool

# ---------------------------------------------------------------------------
#  Antares-Web
#
#  The antares_web role clones the repository, then pulls in the
#  antares_solver role for the local launcher binaries, builds the front-end
#  and the backend image, renders the configuration and starts the stack. It
#  publishes on the loopback; antares_edge is what holds the ports of the
#  machine, and comes last because the ACME challenge that gets its certificate
#  is answered through it, once there is something to serve.
# ---------------------------------------------------------------------------

# Before the stack starts, not after it: the backend polls the load of the
# Slurm launcher over SSH every 30 seconds from the moment it comes up, and a
# key that is only authorised at the end of the run turns that into minutes of
# failed authentications against the front-end - the length of everything that
# happens in between, Keycloak included. An sshd that answers by refusing the
# next connections from that address then makes the deployment look broken
# when it is not. The two plays are the pair they were before, only moved: the
# key has to exist before it can be authorised, hence the first one.
- name: The key Antares-Web submits jobs with
  hosts: antares_web
  become: true
  tags: [antares_web, ssh]
  roles:
    - antares_defaults

  tasks:
    - name: Create the SSH key used to reach the Slurm front-end
      ansible.builtin.include_role:
        name: antares_web
        tasks_from: ssh_key
      when: slurm_enabled | bool

- name: Authorise Antares-Web to submit jobs on the Slurm front-end
  hosts: slurm_frontend
  become: true
  tags: [antares_web, ssh]
  roles:
    - antares_defaults
    - role: antares_ssh_access
      when: slurm_enabled | bool

- name: Antares-Web server
  hosts: antares_web
  become: true
  tags: antares_web
  roles:
    - antares_defaults
    - podman
    - antares_web
    # After antares_web, which is what starts PostgreSQL: Keycloak needs a
    # database of its own created in it before its container is ever started.
    # Not guarded by keycloak_enabled here, the role handles both answers, so
    # that turning it back off takes the container down.
    - role: keycloak
      tags: keycloak
    # After keycloak, which is the one it talks to in the shape this
    # deployment ships. Like that role, it runs whatever the provider is, so
    # that changing it takes the previous connector down.
    - role: antares_auth
      tags: auth
    # Before the front door, which routes monitoring_grafana_path to it, and
    # after everything it watches - although it depends on none of it: both
    # containers are in the host network namespace and would come up on a
    # machine whose stack is down, which is the point of monitoring.
    - role: monitoring_server
      tags: monitoring
    - role: antares_edge
      tags: edge
