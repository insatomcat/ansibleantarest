---
# ===========================================================================
#  Check a deployment from the outside in
#
#      ansible-playbook verify.yml
#      ansible-playbook -i inventory/ci-cluster.yml verify.yml
#
#  site.yml already asserts a great deal while it runs: the NFS export is
#  visible, the mount is really NFS, the images loaded, /api/health answered.
#  What it cannot check is what only exists once every machine is done, and
#  what a machine looks like from somewhere that is not the machine itself:
#
#    - the cluster: slurmctld sees every node, the accounting database knows
#      the cluster, a job submitted the way Antares-Web submits it runs on a
#      compute node, and the shared /home really is shared,
#    - the firewall: three different rulesets on three kinds of machine, each
#      of which has to let the peers through and keep everyone else out,
#    - the journal: the one thing every answer above is read from, which is
#      worth nothing if it is wiped at the next reboot,
#    - the monitoring: every machine of the fleet is really being scraped, the
#      Slurm exporter really reaches the controller, and Grafana really
#      answers through the front door. The first of those is only visible from
#      the one machine that does the scraping, and silent everywhere else.
#
#  The controller is the outside world here, and that is the point of the
#  second half: it is not in the inventory, so it is in no ruleset's trusted
#  set, and a probe from it crosses the input chain exactly like a packet
#  from the internet. Run this from a machine that *is* in the inventory and
#  every "the world cannot reach this" check becomes a tautology.
#
#  Nothing here changes anything, beyond one marker file in the shared /home
#  that the last play removes. It is safe on a production deployment, and it
#  is what the `slurm` job of .github/workflows/ci.yml runs after site.yml.
#
#  Every play switches itself off where it does not apply: the cluster ones
#  when slurm_enabled is false, the firewall ones when
#  hardening_firewall_enabled is false - a deployment filtered by a cloud
#  security group instead has nothing on the machine to check - the journal
#  one when the hardening role was told to leave the journal alone, and the
#  monitoring one when monitoring_enabled is false.
#
#  Note on `hostvars[inventory_hostname]` below, where `ansible_host` would
#  read more naturally: a task with delegate_to takes its connection
#  variables from the machine it is delegated to, so inside a probe running
#  on the controller `ansible_host` is the controller's own. The explicit
#  lookup is the address of the machine being checked, delegated or not.
# ===========================================================================

# Same reason as the first play of site.yml: the cached facts may predate a
# rebuild of the machine behind this name, and the addresses below are read
# from them.
#
# And `all:!builder` for the same reason as there too: site.yml does not
# configure a builder, so there is nothing on it to verify. Checking it would
# fail on a persistent journal and a firewall nobody ever asked for.
# The Prometheus targets check further down already took that difference.
- name: Gather facts from every machine
  hosts: all:!builder
  gather_facts: false
  tags: always
  roles:
    - antares_defaults

  tasks:
    - name: Gather facts
      ansible.builtin.setup:

# ---------------------------------------------------------------------------
#  Antares-Web
# ---------------------------------------------------------------------------

- name: The Antares-Web stack is up and answers
  hosts: antares_web
  gather_facts: false
  tags: [verify, web]
  vars:
    # With TLS on, port 80 answers a redirect and nothing else, so the checks
    # follow the interface to where it actually is. The certificate is not
    # validated: selfsigned and the Let's Encrypt staging CA are both
    # supported configurations, and what is under test here is the stack.
    verify_web_url: >-
      {{ 'https' if antarest_tls_enabled | default(false) | bool else 'http' }}://{{
         hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:{{
         antarest_https_port if antarest_tls_enabled | default(false) | bool else antarest_http_port }}
    # The same front door asked from the machine itself, which is in
    # antares_edge_basic_auth_trusted and so is never asked for a password.
    verify_edge_local_url: >-
      {{ 'https' if antarest_tls_enabled | default(false) | bool else 'http' }}://127.0.0.1:{{
         antarest_https_port if antarest_tls_enabled | default(false) | bool else antarest_http_port }}
    # Whether the front door holds a password list in front of the interface,
    # and another in front of the consoles served next to it. Both are read
    # from the lists the antares_edge role renders its password files from.
    #
    # The controller has no password to give - it is not in
    # antares_edge_basic_auth_trusted, and putting it there is the operator's
    # decision, see docs/operations.md - so where a tier is on, the probe that
    # has to reach what is behind the door is asked from the machine instead,
    # losing the network path and keeping everything else. The door itself is
    # then checked for what it is, from here, by the task that expects a 401.
    verify_web_gated: "{{ (antares_edge_basic_auth_users | default([])) | length > 0 }}"
    verify_admin_gated: "{{ (antares_edge_basic_auth_admin_users | default([])) | length > 0 }}"
    # The account to present at the door, per tier, when the inventory or the
    # command line gave one. A probe that carries it is asked from the
    # controller like every other check in this file; one that has none falls
    # back to the machine's own loopback, which the door never challenges.
    verify_web_auth: >-
      {{ {'Authorization': 'Basic ' ~ ((antares_edge_basic_auth_probe_user ~ ':'
                                        ~ antares_edge_basic_auth_probe_password) | b64encode)}
         if (antares_edge_basic_auth_probe_user | default('') | length > 0 and verify_web_gated | bool)
         else {} }}
    verify_admin_auth: >-
      {{ {'Authorization': 'Basic ' ~ ((antares_edge_basic_auth_admin_probe_user ~ ':'
                                        ~ antares_edge_basic_auth_admin_probe_password) | b64encode)}
         if (antares_edge_basic_auth_admin_probe_user | default('') | length > 0 and verify_admin_gated | bool)
         else {} }}
    verify_web_outside: "{{ not verify_web_gated | bool or verify_web_auth | length > 0 }}"
    verify_admin_outside: "{{ not verify_admin_gated | bool or verify_admin_auth | length > 0 }}"
    verify_web_probe_url: "{{ verify_web_url if verify_web_outside | bool else verify_edge_local_url }}"
    verify_web_probe_from: "{{ 'localhost' if verify_web_outside | bool else inventory_hostname }}"
    verify_admin_probe_url: "{{ verify_web_url if verify_admin_outside | bool else verify_edge_local_url }}"
    verify_admin_probe_from: "{{ 'localhost' if verify_admin_outside | bool else inventory_hostname }}"
    # What a browser sends on every request once the door has let it through:
    # the real account when there is one, a made-up one otherwise, since from
    # the loopback the door does not check it and what is under test is that
    # it is cleared rather than that it opens.
    verify_consumed_auth: >-
      {{ verify_web_auth if verify_web_auth | length > 0
         else {'Authorization': 'Basic ' ~ ('verify.yml:not-a-password' | b64encode)} }}
    verify_consumed_admin_auth: >-
      {{ verify_admin_auth if verify_admin_auth | length > 0
         else {'Authorization': 'Basic ' ~ ('verify.yml:not-a-password' | b64encode)} }}
    # Both live in the role defaults, which a playbook that does not include
    # the role cannot see, hence the fallbacks. Empty means the deployment
    # keeps its state on the boot disk, and the volume checks do not apply.
    verify_data_device: "{{ antarest_data_device | default('') }}"
    verify_data_dir: "{{ antarest_data_dir | default(antarest_base_dir ~ '/data') }}"
  roles:
    - antares_defaults

  tasks:

    # `until` rather than a single shot, and the state itself rather than the
    # exit status: the units of the stack carry Restart=on-failure with
    # RestartSec=10, so a container that crashed once is answered `activating`
    # for ten seconds by a machine that is perfectly healthy ten seconds later.
    # Asking at that instant is what makes this play the only impatient check
    # in a file whose every other probe retries, and it has already failed a
    # cluster that had converged, on an AntaREST backend that lost a race to
    # create its own default admin group and was restarted by systemd.
    #
    # Only the transient states are waited out. `failed` - the unit gave up,
    # its StartLimitBurst exhausted - and `inactive` are answered at once, so
    # nothing here waits a minute to report a stack that is really down, and
    # the assert below still names the units and their state. A unit that
    # never leaves `activating` exhausts the retries and lands there too,
    # since failed_when keeps the sweep itself from failing.
    - name: Ask systemd about the units of the stack
      ansible.builtin.command: "systemctl is-active {{ item }}"
      register: verify_units
      changed_when: false
      failed_when: false
      become: true
      until: verify_units.stdout not in ['activating', 'deactivating', 'reloading']
      retries: 12
      delay: 5
      loop: "{{ verify_web_units }}"
      vars:
        verify_web_units: >-
          {{ ['antares-web.target', 'postgresql.service', 'redis.service',
              'antarest.service', 'antarest-celery-beat.service',
              'antarest-celery-worker.service', 'antares-nginx.service',
              'antares-edge.service']
             + (['antarest-adminer.service'] if antarest_enable_adminer | default(false) | bool else [])
             + (['keycloak.service'] if keycloak_enabled | default(false) | bool else [])
             + ([antares_auth_container ~ '.service']
                if antares_auth_provider | default('none') != 'none' else []) }}

    - name: Fail when a unit of the stack is not running
      ansible.builtin.assert:
        that: verify_units.results | rejectattr('stdout', 'equalto', 'active') | list | length == 0
        fail_msg: >-
          Not running on {{ inventory_hostname }}:
          {{ verify_units.results | rejectattr('stdout', 'equalto', 'active')
             | map(attribute='item') | zip(verify_units.results
                | rejectattr('stdout', 'equalto', 'active') | map(attribute='stdout'))
             | map('join', ' is ') | join(', ') }}.
          `systemctl status` and `journalctl -u <unit>` there say why.
        quiet: true

    # From the controller rather than from the machine, on purpose: what a
    # deployment is for is answering someone else, and asking from here is
    # what makes the answer cross the input chain of the firewall, the
    # published port of the container and the proxy inside it, rather than a
    # loopback that skips most of that. verify_web_probe_url is the one
    # exception and says why: a front door holding a password list has
    # nothing to answer a controller that has no password.
    - name: Ask the backend for its health
      ansible.builtin.uri:
        url: "{{ verify_web_probe_url | trim }}/api/health"
        headers: "{{ verify_web_auth }}"
        return_content: true
        validate_certs: false
      register: verify_health
      retries: 12
      delay: 5
      until: verify_health.status | default(0) == 200
      delegate_to: "{{ verify_web_probe_from }}"
      become: false

    - name: Ask nginx for the web application
      ansible.builtin.uri:
        url: "{{ verify_web_probe_url | trim }}/"
        headers: "{{ verify_web_auth }}"
        return_content: true
        validate_certs: false
      register: verify_index
      delegate_to: "{{ verify_web_probe_from }}"
      become: false

    - name: Check nginx really serves the built front-end
      ansible.builtin.assert:
        that: verify_index.content is search('(?i)<title')
        fail_msg: >-
          {{ verify_web_url }}/ answered {{ verify_index.status }} but the body
          is not an HTML document, so webapp/dist is not what nginx serves.
        quiet: true

    # Deliberately a wrong password: what is under test is that the /api/
    # location reaches the backend and that the backend routes the request.
    # A 502 or a 404 is the failure that matters, and 404 is what a wrong
    # container name in the nginx upstream produces.
    - name: Post a login the backend must reject
      ansible.builtin.uri:
        url: "{{ verify_web_probe_url | trim }}/api/v1/login"
        method: POST
        headers: "{{ verify_web_auth }}"
        body_format: json
        body:
          username: verify.yml
          password: wrong-on-purpose
        status_code: [200, 401, 422]
        validate_certs: false
      delegate_to: "{{ verify_web_probe_from }}"
      become: false

    # The same login, carrying the kind of credential the front door consumes.
    # Once a browser has been let through it sends that header on every
    # request it makes, and nginx forwards whatever it is not told to clear:
    # forwarded, it reaches the backend, which reads it as a malformed bearer
    # token and answers `Bad Authorization header` to a login it never looked
    # at. That is a deployment where nobody can log in behind a front door
    # that answers 200 to every check above, which is exactly what this file
    # failed to notice once.
    #
    # The header carries a credential that is not one of the accounts on
    # purpose: what is under test is that it stops at the door, not that it
    # opens it, and the probe has no password to give anyway.
    - name: Post a login carrying the credential the front door consumes
      ansible.builtin.uri:
        url: "{{ verify_web_probe_url | trim }}/api/v1/login"
        method: POST
        headers: "{{ verify_consumed_auth }}"
        body_format: json
        body:
          username: verify.yml
          password: wrong-on-purpose
        status_code: [200, 401, 422]
        return_content: true
        validate_certs: false
      register: verify_gate_login
      delegate_to: "{{ verify_web_probe_from }}"
      become: false
      when: verify_web_gated | bool

    - name: Check the front door keeps what it consumed to itself
      ansible.builtin.assert:
        that: verify_gate_login.content | default('') is not search('(?i)authorization header')
        fail_msg: >-
          A login carrying a basic credential was answered
          "{{ verify_gate_login.content | default('') | truncate(120) }}", so
          the front door forwards the header it authenticates with. The
          backend reads it as its own and refuses every login, the Keycloak
          console never loads and Grafana challenges for a password of its
          own. The Authorization header has to be cleared on every gated
          location, see roles/antares_edge/templates/nginx.conf.j2.
        quiet: true
      when: verify_web_gated | bool

    # And the door itself, from the controller, which is where an unknown
    # client is. A 401 carrying a Basic challenge is the whole feature: the
    # interface, its login form and every path under it are unreachable to
    # anyone without one of the accounts in antares_edge_basic_auth_users,
    # and there is nothing left of the application for a scanner to find.
    # See docs/edge-and-tls.md.
    - name: Ask the front door for the interface with no password
      ansible.builtin.uri:
        url: "{{ verify_web_url | trim }}/"
        status_code: [401]
        validate_certs: false
      register: verify_web_challenge
      delegate_to: localhost
      become: false
      when: verify_web_gated | bool

    - name: Check the front door challenges rather than answers
      ansible.builtin.assert:
        that: verify_web_challenge.www_authenticate | default('') is match('Basic ')
        fail_msg: >-
          {{ verify_web_url | trim }}/ answered 401 without a Basic challenge
          ({{ verify_web_challenge.www_authenticate | default('no WWW-Authenticate header') }}),
          so what refused the request is not the front door's password list.
        quiet: true
      when: verify_web_gated | bool

    # And the check every probe above is blind to: that somebody can actually
    # log in. A page and a health endpoint are exactly the requests that carry
    # no credentials, so nothing above moves when authentication breaks - which
    # is how a front door forwarding the header it authenticates with went out
    # with every check in this file green.
    #
    # The password is the one the inventory sets. AntaREST writes it when it
    # creates the admin row and never reads it again, so a deployment whose
    # password was changed afterwards answers 401 here. Like the Keycloak
    # login below, that is an answer and not a failure: it is reported, and
    # the call it would have authorised is skipped with it.
    - name: Log into Antares-Web through the front door
      ansible.builtin.uri:
        url: "{{ verify_web_probe_url | trim }}/api/v1/login"
        method: POST
        headers: "{{ verify_web_auth }}"
        body_format: json
        body:
          username: admin
          password: "{{ antarest_admin_password }}"
        status_code: [200, 401]
        validate_certs: false
      register: verify_login
      no_log: true
      delegate_to: "{{ verify_web_probe_from }}"
      become: false

    - name: Check the login was answered by the application
      ansible.builtin.assert:
        that: verify_login.www_authenticate is not defined
        fail_msg: >-
          The login form was answered by the front door
          ({{ verify_login.www_authenticate | default('') }}) rather than by
          Antares-Web, so nothing behind it can be reached with a password.
        quiet: true

    # The other half of a login: the token it hands back has to work. That is
    # what the /api/ exemption of a gated front door exists for, and a token
    # refused here is that exemption not being applied.
    - name: Ask the API for its users with the token the login issued
      ansible.builtin.uri:
        url: "{{ verify_web_probe_url | trim }}/api/v1/users"
        headers:
          Authorization: "Bearer {{ verify_login.json.access_token }}"
        status_code: [200, 401]
        validate_certs: false
      register: verify_api_call
      delegate_to: "{{ verify_web_probe_from }}"
      become: false
      when: verify_login.status | default(0) == 200

    # A token refused here is either the backend's business or the door's, and
    # the challenge header is what tells them apart: nginx answers a 401 with
    # one, the application never does.
    - name: Check the token the login issued is honoured
      ansible.builtin.assert:
        that: verify_api_call.status | default(200) == 200
        fail_msg: >-
          {{ 'The front door refused a request carrying a bearer token
              (' ~ verify_api_call.www_authenticate | default('') ~ '), so the
              token path of the Antares-Web route is not exempted and the
              interface cannot call its own API. See antares_edge_routes in
              roles/antares_edge/vars/main.yml.'
             if verify_api_call.www_authenticate is defined
             else 'Antares-Web refused the token its own login form had just
                   issued, which is the backend and not the route.' }}
        quiet: true
      when: verify_login.status | default(0) == 200

    - name: Report an admin password the inventory no longer holds
      ansible.builtin.debug:
        msg: >-
          Antares-Web refused antarest_admin_password, so the login and the
          token it issues could not be checked. That is what a password
          changed since the database was created looks like, see
          docs/operations.md; the login form was reached and answered, which
          is what the assert above proved.
      when: verify_login.status | default(0) != 200

    # Through the front door, from the controller, like everything above: what
    # is under test is the route, and a realm that answers proves at the same
    # time that Keycloak is up, that its database was created and that the
    # realm the connector authenticates against was imported.
    - name: Ask Keycloak for the realm the connector uses
      ansible.builtin.uri:
        url: >-
          {{ verify_admin_probe_url | trim }}{{ keycloak_relative_path }}/realms/{{ keycloak_realm }}/.well-known/openid-configuration
        headers: "{{ verify_admin_auth }}"
        validate_certs: false
      register: verify_keycloak
      retries: 12
      delay: 5
      until: verify_keycloak.status | default(0) == 200
      delegate_to: "{{ verify_admin_probe_from }}"
      become: false
      when: keycloak_enabled | default(false) | bool

    # And the same two halves for Keycloak: a token from the master realm, then
    # the admin API call it authorises. That call is what the console makes on
    # every page it draws, with a bearer token in the header basic
    # authentication uses, so it is the request a gated front door is most
    # likely to have broken.
    #
    # A refusal is an answer and not a failure, the same way the keycloak role
    # treats it: the master password can have been changed from the console.
    - name: Log into the Keycloak master realm through the front door
      ansible.builtin.uri:
        url: "{{ verify_admin_probe_url | trim }}{{ keycloak_relative_path }}/realms/master/protocol/openid-connect/token"
        method: POST
        headers: "{{ verify_admin_auth }}"
        body_format: form-urlencoded
        body:
          client_id: admin-cli
          grant_type: password
          username: "{{ keycloak_admin_user }}"
          password: "{{ keycloak_admin_password }}"
        status_code: [200, 400, 401]
        validate_certs: false
      register: verify_kc_login
      no_log: true
      delegate_to: "{{ verify_admin_probe_from }}"
      become: false
      when: keycloak_enabled | default(false) | bool

    - name: Ask the Keycloak admin API for the realm, with that token
      ansible.builtin.uri:
        url: "{{ verify_admin_probe_url | trim }}{{ keycloak_relative_path }}/admin/realms/{{ keycloak_realm }}"
        headers:
          Authorization: "Bearer {{ verify_kc_login.json.access_token }}"
        status_code: [200, 401]
        validate_certs: false
      register: verify_kc_call
      delegate_to: "{{ verify_admin_probe_from }}"
      become: false
      when:
        - keycloak_enabled | default(false) | bool
        - verify_kc_login.status | default(0) == 200

    - name: Check the Keycloak console can reach the API it draws from
      ansible.builtin.assert:
        that: verify_kc_call.status | default(200) == 200
        fail_msg: >-
          {{ 'The front door refused a request carrying a bearer token
              (' ~ verify_kc_call.www_authenticate | default('') ~ '), so the
              token path of the Keycloak route is not exempted. The console
              loads and then draws nothing, since every call it makes carries
              one. See antares_edge_routes in
              roles/antares_edge/vars/main.yml.'
             if verify_kc_call.www_authenticate is defined
             else 'Keycloak refused the token its own master realm had just
                   issued, which is Keycloak and not the route.' }}
        quiet: true
      when:
        - keycloak_enabled | default(false) | bool
        - verify_kc_login.status | default(0) == 200

    - name: Report a master password the inventory no longer holds
      ansible.builtin.debug:
        msg: >-
          Keycloak refused keycloak_admin_password, so its admin API could not
          be asked for anything with a token. That is what a master password
          changed from the console looks like, see docs/authentication.md.
      when:
        - keycloak_enabled | default(false) | bool
        - verify_kc_login.status | default(0) != 200

    # The consoles are a list of their own, and the console of an identity
    # provider is the one page on a deployment worth the second password.
    - name: Ask the front door for the Keycloak console with no password
      ansible.builtin.uri:
        url: "{{ verify_web_url | trim }}{{ keycloak_relative_path }}/admin/"
        status_code: [401]
        validate_certs: false
      delegate_to: localhost
      become: false
      when:
        - keycloak_enabled | default(false) | bool
        - verify_admin_gated | bool

    # The connector publishes no port - only the containers of the stack have
    # any business calling it - so this is asked from inside it. What it proves
    # is that the container the backend resolves as
    # antarest_external_auth_url is up and serving.
    - name: Ask the authentication connector for its health
      ansible.builtin.command:
        cmd: >-
          {{ container_cmd | default('/usr/bin/podman') }} exec {{ antares_auth_container }}
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:{{ antares_auth_port }}/health').read()"
      changed_when: false
      become: true
      when: antares_auth_provider | default('none') != 'none'

    # A stack that answers proves nothing about *where* it is answering from.
    # With a volume declared, the failure this catches is the quiet one: the
    # volume did not come back, the units started on the empty mount point of
    # the boot disk, and the interface is up with an empty database. The
    # RequiresMountsFor= the units carry is what should have stopped that, so
    # this is also the check that the units were rendered with it.
    #
    # Skipped when antarest_data_device is empty, where the state is meant to
    # be on the boot disk and the data directory is an ordinary directory.
    - name: The state is on the volume it was given
      when: verify_data_device | length > 0
      block:
        - name: Ask what is mounted on the data directory
          ansible.builtin.command:
            cmd: findmnt --noheadings --output SOURCE --mountpoint {{ verify_data_dir }}
          register: verify_data_mount
          changed_when: false
          failed_when: false

        # antarest_data_device may be a symlink udev maintains, and findmnt
        # answers with the device the kernel knows, so the two are compared
        # once both are resolved.
        - name: Resolve the device the volume is attached as
          ansible.builtin.command:
            cmd: readlink -f {{ verify_data_device }}
          register: verify_data_real_device
          changed_when: false

        - name: Check the data directory is a mount point
          ansible.builtin.assert:
            that: verify_data_mount.rc == 0
            fail_msg: >-
              {{ verify_data_dir }} on {{ inventory_hostname }} is not a mount
              point, while antarest_data_device names {{ verify_data_device }}.
              The studies and the database are being written to the boot disk.
            quiet: true

        - name: Check it is the declared volume that is mounted there
          ansible.builtin.assert:
            that: (verify_data_mount.stdout | trim) == (verify_data_real_device.stdout | trim)
            fail_msg: >-
              {{ verify_data_dir }} on {{ inventory_hostname }} is mounted from
              {{ verify_data_mount.stdout | trim }}, but antarest_data_device
              names {{ verify_data_device }}
              ({{ verify_data_real_device.stdout | trim }}).
            quiet: true

        # The one failure that is invisible until the next reboot: a volume
        # mounted by hand passes both checks above and is gone on the way back
        # up, taking the data directory with it.
        - name: Ask fstab about the data directory
          ansible.builtin.command:
            cmd: findmnt --fstab --noheadings --output SOURCE --mountpoint {{ verify_data_dir }}
          register: verify_data_fstab
          changed_when: false
          failed_when: false

        - name: Check the mount survives a reboot
          ansible.builtin.assert:
            that: verify_data_fstab.rc == 0
            fail_msg: >-
              {{ verify_data_dir }} is mounted on {{ inventory_hostname }} but
              /etc/fstab has no entry for it, so the next reboot brings the
              machine back with its state on the boot disk.
            quiet: true

# ---------------------------------------------------------------------------
#  Monitoring
# ---------------------------------------------------------------------------

- name: Every machine of the deployment is scraped, and Grafana is served
  hosts: antares_web
  gather_facts: false
  tags: [verify, monitoring]
  vars:
    # Same shape as the web play above: through the front door, from the
    # controller, on whichever scheme is configured, and without validating a
    # certificate that may deliberately be self-signed. Grafana is one of the
    # consoles antares_edge_basic_auth_admin_users guards, so the same rule as
    # in the web play applies: with that list filled, the probe that has to
    # reach Grafana is asked from the machine, whose loopback the front door
    # never challenges, and the door is checked from here by the task that
    # expects a 401.
    verify_admin_gated: "{{ (antares_edge_basic_auth_admin_users | default([])) | length > 0 }}"
    verify_admin_auth: >-
      {{ {'Authorization': 'Basic ' ~ ((antares_edge_basic_auth_admin_probe_user ~ ':'
                                        ~ antares_edge_basic_auth_admin_probe_password) | b64encode)}
         if (antares_edge_basic_auth_admin_probe_user | default('') | length > 0 and verify_admin_gated | bool)
         else {} }}
    verify_admin_outside: "{{ not verify_admin_gated | bool or verify_admin_auth | length > 0 }}"
    verify_consumed_admin_auth: >-
      {{ verify_admin_auth if verify_admin_auth | length > 0
         else {'Authorization': 'Basic ' ~ ('verify.yml:not-a-password' | b64encode)} }}
    verify_grafana_url: >-
      {{ 'https' if antarest_tls_enabled | default(false) | bool else 'http' }}://{{
         hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:{{
         antarest_https_port if antarest_tls_enabled | default(false) | bool else antarest_http_port
      }}{{ monitoring_grafana_path }}
    verify_grafana_probe_url: >-
      {{ verify_grafana_url if verify_admin_outside | bool
         else ('https' if antarest_tls_enabled | default(false) | bool else 'http')
              ~ '://127.0.0.1:'
              ~ (antarest_https_port if antarest_tls_enabled | default(false) | bool else antarest_http_port)
              ~ monitoring_grafana_path }}
    verify_grafana_probe_from: "{{ 'localhost' if verify_admin_outside | bool else inventory_hostname }}"
    # The prefix Prometheus answers on, on the machine itself: the root unless
    # it was published, where --web.external-url moves everything under it.
    verify_prometheus_prefix: >-
      {{ monitoring_prometheus_path if monitoring_prometheus_public | default(false) | bool else '' }}
    # The Slurm exporters Prometheus was told about, read back from Prometheus
    # itself rather than worked out from the inventory.
    verify_slurm_scraped: >-
      {{ (verify_targets.json.data.activeTargets | default([]))
         | selectattr('labels.job', 'defined')
         | selectattr('labels.job', 'equalto', 'slurm')
         | map(attribute='labels.instance') | list }}
  roles:
    - antares_defaults

  tasks:

    # From the machine and not from the controller: Prometheus is bound to the
    # loopback, which is the whole point of it. What is under test here is the
    # scraping, and the front door is checked by the Grafana task below.
    #
    # Patient, and on purpose: a target is `unknown` until it has been scraped
    # once, so a verify.yml run right after a deployment asks before the first
    # scrape interval has elapsed. A target that is really down exhausts the
    # retries and fails with its own error message, which is the one worth
    # reading - a connection refused, a timeout, or a 404.
    - name: Ask Prometheus what its targets are doing
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ monitoring_prometheus_port }}{{ verify_prometheus_prefix | trim }}/api/v1/targets?state=active"
        status_code: [200]
      register: verify_targets
      retries: 12
      delay: 10
      failed_when: false
      until: >-
        verify_targets.json is defined
        and verify_targets.json.data.activeTargets
            | rejectattr('health', 'equalto', 'up') | list | length == 0
      when: monitoring_enabled | default(false) | bool

    - name: Check Prometheus answers at all
      ansible.builtin.assert:
        that: verify_targets.json is defined
        fail_msg: >-
          Prometheus does not answer on 127.0.0.1:{{ monitoring_prometheus_port }}
          on {{ inventory_hostname }}
          ({{ verify_targets.msg | default(verify_targets.status | default('no answer')) }}).
        quiet: true
      when: monitoring_enabled | default(false) | bool

    # The list of targets is generated from the inventory, so a machine that
    # is not in it is a machine nobody is watching. That happens for exactly
    # one reason - a host whose facts were not in the play that rendered
    # prometheus.yml - and it is silent everywhere else.
    - name: Check every machine of the inventory is scraped
      ansible.builtin.assert:
        that:
          - >-
            (groups['all'] | difference(groups['builder'] | default([])))
            | difference(verify_targets.json.data.activeTargets
                         | selectattr('labels.job', 'equalto', 'node')
                         | map(attribute='labels.instance') | list)
            | length == 0
        fail_msg: >-
          Prometheus scrapes
          {{ verify_targets.json.data.activeTargets
             | selectattr('labels.job', 'equalto', 'node')
             | map(attribute='labels.instance') | join(', ') }},
          which does not cover every machine of the inventory
          ({{ groups['all'] | difference(groups['builder'] | default([])) | join(', ') }}).
          A machine missing here contributed no address when
          {{ monitoring_server_dir | default('/etc/antares-web/monitoring') }}/prometheus.yml
          was rendered: re-run site.yml without --limit.
        quiet: true
      when: monitoring_enabled | default(false) | bool

    - name: Check every target answers
      ansible.builtin.assert:
        that:
          - verify_targets.json.data.activeTargets
            | rejectattr('health', 'equalto', 'up') | list | length == 0
        fail_msg: >-
          {{ verify_targets.json.data.activeTargets
             | rejectattr('health', 'equalto', 'up')
             | map(attribute='scrapeUrl') | join(', ') }}
          {{ 'is' if (verify_targets.json.data.activeTargets
                      | rejectattr('health', 'equalto', 'up') | list | length) == 1 else 'are' }}
          not answering:
          {{ verify_targets.json.data.activeTargets
             | rejectattr('health', 'equalto', 'up')
             | map(attribute='lastError') | reject('equalto', '') | join(' / ') }}.
          A refused connection is usually the firewall of that machine, which
          only trusts the addresses of the inventory: check its facts were
          gathered. An exporter that is down says so in
          `systemctl status node-exporter.service` on the machine itself.
        quiet: true
      when: monitoring_enabled | default(false) | bool

    # The Slurm exporter answers whatever the cluster does, so `up` above says
    # nothing about whether it reached slurmctld. This does: the metric only
    # exists once sinfo has answered.
    #
    # Asked only where Prometheus was actually given a Slurm target. That is
    # the contract rather than monitoring_slurm_enabled: a front-end whose
    # image carries a Slurm client newer than its own controller deploys no
    # exporter and is declared nowhere, deliberately, and this check has
    # nothing to look for there. See roles/monitoring_slurm and
    # docs/monitoring.md.
    - name: Ask Prometheus whether the cluster is really being read
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ monitoring_prometheus_port }}{{ verify_prometheus_prefix | trim }}/api/v1/query?query=slurm_nodes_total"
        status_code: [200]
      register: verify_slurm_metric
      retries: 12
      delay: 10
      until: verify_slurm_metric.json.data.result | default([]) | length > 0
      failed_when: false
      when:
        - monitoring_enabled | default(false) | bool
        - verify_slurm_scraped | length > 0

    - name: Check the Slurm exporter reports a cluster
      ansible.builtin.assert:
        that: verify_slurm_metric.json.data.result | default([]) | length > 0
        fail_msg: >-
          Prometheus scrapes {{ verify_slurm_scraped | join(', ') }} but has no
          slurm_nodes_total, so the Slurm exporter answers without reaching the
          controller. Munge and the Slurm version of the client inside
          {{ monitoring_slurm_exporter_image }} are the two causes;
          `journalctl -u slurm-exporter.service` on the front-end names which.
          See docs/monitoring.md.
        quiet: true
      when:
        - monitoring_enabled | default(false) | bool
        - verify_slurm_scraped | length > 0

    # The vacuous pass, said out loud. A cluster whose front-end skipped its
    # exporter has nothing for the two tasks above to check, and a check that
    # silently applies to nothing is exactly what a verification file must not
    # have: this is the line that tells a log reader which of the two it is.
    - name: Report a cluster that is not being read
      ansible.builtin.debug:
        msg: >-
          Prometheus scrapes no Slurm exporter, so the queue and the node
          states of this cluster are not collected. The front-end deploys none
          when the Slurm client of {{ monitoring_slurm_exporter_image }} is
          ahead of its own controller, which is deliberate and reported by
          site.yml; monitoring_slurm_enabled turns the whole thing off. See
          docs/monitoring.md.
      when:
        - monitoring_enabled | default(false) | bool
        - slurm_enabled | bool
        - monitoring_slurm_enabled | default(slurm_enabled) | bool
        - verify_slurm_scraped | length == 0

    # And the half that is not on the machine: the front door really routes
    # monitoring_grafana_path, and Grafana really serves itself under it.
    # /api/health answers a JSON document with the database state in it, which
    # is more than a 200 on the login page would say. Asked from the machine
    # when the consoles are behind a password list, for the reason above.
    - name: Ask Grafana for its health, through the front door
      ansible.builtin.uri:
        url: "{{ verify_grafana_probe_url | trim }}/api/health"
        headers: "{{ verify_admin_auth }}"
        validate_certs: false
        status_code: [200]
      register: verify_grafana
      retries: 12
      delay: 5
      until: verify_grafana.status | default(0) == 200
      delegate_to: "{{ verify_grafana_probe_from }}"
      become: false
      when: monitoring_enabled | default(false) | bool

    # Grafana authenticates with a session cookie and has a basic
    # authentication of its own, so a front door that forwards the credential
    # it consumed makes Grafana refuse it and challenge for a password again -
    # in a browser, a prompt that never ends. Health answers 200 through a
    # door that clears the header and 401 through one that does not.
    - name: Ask Grafana for its health carrying the credential the front door consumes
      ansible.builtin.uri:
        url: "{{ verify_grafana_probe_url | trim }}/api/health"
        headers: "{{ verify_consumed_admin_auth }}"
        validate_certs: false
        status_code: [200]
      delegate_to: "{{ verify_grafana_probe_from }}"
      become: false
      when:
        - monitoring_enabled | default(false) | bool
        - verify_admin_gated | bool

    - name: Ask the front door for Grafana with no password
      ansible.builtin.uri:
        url: "{{ verify_grafana_url | trim }}/api/health"
        status_code: [401]
        validate_certs: false
      delegate_to: localhost
      become: false
      when:
        - monitoring_enabled | default(false) | bool
        - verify_admin_gated | bool

    # And that somebody can log into it. Grafana authenticates with a session
    # cookie, and it has a basic authentication of its own: a front door that
    # forwards the credential it consumed makes Grafana refuse it and
    # challenge for another one, which in a browser is a prompt that never
    # ends and here is a WWW-Authenticate header where there should be none.
    - name: Log into Grafana through the front door
      ansible.builtin.uri:
        url: "{{ verify_grafana_probe_url | trim }}/login"
        method: POST
        headers: "{{ verify_admin_auth }}"
        body_format: json
        body:
          user: "{{ monitoring_grafana_admin_user }}"
          password: "{{ monitoring_grafana_admin_password }}"
        status_code: [200, 401]
        validate_certs: false
      register: verify_grafana_login
      no_log: true
      delegate_to: "{{ verify_grafana_probe_from }}"
      become: false
      when: monitoring_enabled | default(false) | bool

    - name: Check nothing challenged the Grafana login for a password
      ansible.builtin.assert:
        that: verify_grafana_login.www_authenticate is not defined
        fail_msg: >-
          The Grafana login was answered with a
          "{{ verify_grafana_login.www_authenticate | default('') }}"
          challenge. Grafana refuses a credential that is not one of its own
          and asks for another, which a browser turns into a prompt that never
          ends: the front door is forwarding the header it authenticates with
          instead of clearing it.
        quiet: true
      when: monitoring_enabled | default(false) | bool

    - name: Ask Grafana who is logged in, with the session it just issued
      ansible.builtin.uri:
        url: "{{ verify_grafana_probe_url | trim }}/api/user"
        headers: "{{ verify_admin_auth | combine({'Cookie': verify_grafana_login.cookies_string}) }}"
        status_code: [200]
        validate_certs: false
      delegate_to: "{{ verify_grafana_probe_from }}"
      become: false
      when:
        - monitoring_enabled | default(false) | bool
        - verify_grafana_login.status | default(0) == 200

    - name: Report a Grafana password the inventory no longer holds
      ansible.builtin.debug:
        msg: >-
          Grafana refused monitoring_grafana_admin_password, so the session it
          issues could not be checked. The variable seeds the administrator at
          the first start like the other two, see docs/monitoring.md.
      when:
        - monitoring_enabled | default(false) | bool
        - verify_grafana_login.status | default(0) != 200

    - name: Check Grafana reports its database is up
      ansible.builtin.assert:
        that: verify_grafana.json.database | default('') == 'ok'
        fail_msg: >-
          {{ verify_grafana_probe_url | trim }}/api/health answered
          {{ verify_grafana.json | default(verify_grafana.status | default('nothing')) }}.
          Grafana is reached through the front door, so a 502 here is the
          container and anything else is the route.
        quiet: true
      when: monitoring_enabled | default(false) | bool

# ---------------------------------------------------------------------------
#  The Slurm cluster
# ---------------------------------------------------------------------------

- name: The controller sees every compute node
  hosts: slurm_frontend
  become: true
  gather_facts: false
  tags: [verify, slurm]
  roles:
    - antares_defaults

  tasks:

    - name: Ask slurmctld whether it is alive
      ansible.builtin.command: scontrol ping
      register: verify_ping
      changed_when: false
      when: slurm_enabled | bool

    - name: Check slurmctld answers as UP
      ansible.builtin.assert:
        that: verify_ping.stdout is search('is UP')
        fail_msg: "scontrol ping on {{ inventory_hostname }}: {{ verify_ping.stdout | default('') }}"
        quiet: true
      when: slurm_enabled | bool

    # --Node so that the answer is one line per node rather than sinfo's
    # usual ranges, and a retry rather than a single shot: a node whose
    # slurmd has just been restarted takes a few seconds to register. A node
    # left in `down`, `drain` or `idle*` - the star meaning slurmctld cannot
    # reach it - exhausts the retries and fails with the table in the message.
    - name: Ask sinfo about the nodes
      ansible.builtin.command: sinfo --Node --noheader --format '%N %T'
      register: verify_sinfo
      changed_when: false
      retries: 12
      delay: 5
      until: >-
        verify_sinfo.stdout_lines | length == (groups['slurm_compute'] | default([])) | length
        and verify_sinfo.stdout_lines | map('regex_replace', '^\S+\s+', '')
            | reject('in', ['idle', 'mixed', 'allocated', 'completing']) | list | length == 0
      when: slurm_enabled | bool

    - name: Check every compute node of the inventory is in the partition
      ansible.builtin.assert:
        that:
          - (groups['slurm_compute'] | default([]) | map('extract', hostvars, 'slurm_node_name') | list)
            | difference(verify_sinfo.stdout_lines | map('regex_replace', '\s.*$', '') | list)
            | length == 0
        fail_msg: >-
          sinfo on {{ inventory_hostname }} does not list every compute node of
          the inventory: {{ verify_sinfo.stdout_lines | join(' / ') }}.
          A node missing here is usually a NodeName that does not match the
          machine's own `hostname -s`, which is what slurmd matches itself
          against in slurm.conf.
        quiet: true
      when: slurm_enabled | bool

    - name: Ask the accounting database about the cluster
      ansible.builtin.command: "sacctmgr --noheader --parsable2 show cluster {{ slurm_cluster_name }}"
      register: verify_sacctmgr
      changed_when: false
      when:
        - slurm_enabled | bool
        - slurmdbd_enabled | bool

    - name: Check the cluster is registered in the accounting database
      ansible.builtin.assert:
        that: verify_sacctmgr.stdout is search('^' ~ slurm_cluster_name ~ '\|')
        fail_msg: >-
          sacctmgr does not know about the cluster {{ slurm_cluster_name }}:
          "{{ verify_sacctmgr.stdout }}". The command reached slurmdbd, so this
          is the registration itself, see
          roles/slurm_frontend/tasks/sacctmgr.yml.
        quiet: true
      when:
        - slurm_enabled | bool
        - slurmdbd_enabled | bool

    # Written here, read from every compute node in the next play. The value
    # is unique to the run so that a marker left behind by an earlier one
    # cannot make a node with a local /home look like a node that mounts the
    # share.
    - name: Draw a marker for the shared home
      ansible.builtin.set_fact:
        verify_marker: "verify.yml {{ 999999999 | random }}"
      when: slurm_enabled | bool

    - name: Write the marker in the shared home
      ansible.builtin.copy:
        content: "{{ verify_marker }}\n"
        dest: "{{ antares_home }}/.verify-nfs"
        owner: "{{ antares_user }}"
        group: "{{ antares_group }}"
        mode: "0644"
      when: slurm_enabled | bool

- name: The compute nodes share the front-end's /home
  hosts: slurm_compute
  become: true
  gather_facts: false
  tags: [verify, slurm]
  vars:
    verify_frontend: "{{ (groups['slurm_frontend'] | default([])) | first | default('') }}"
  roles:
    - antares_defaults

  tasks:

    - name: Read the marker from the shared home
      ansible.builtin.slurp:
        src: "{{ antares_home }}/.verify-nfs"
      register: verify_marker_read
      when: slurm_enabled | bool

    - name: Check the shared home is the front-end's
      ansible.builtin.assert:
        that: verify_marker_read.content | b64decode | trim == hostvars[verify_frontend].verify_marker
        fail_msg: >-
          {{ antares_home }}/.verify-nfs on {{ inventory_hostname }} does not
          hold what the front-end just wrote there: the mount is not the
          export, or it is a stale mount of an earlier one.
        quiet: true
      when: slurm_enabled | bool

    # The solvers are installed once, on the front-end, into the shared /home.
    # A compute node that cannot execute them runs no study, and the failure
    # would only surface hours later in a job's stderr.
    - name: Look for the solvers in the shared home
      ansible.builtin.stat:
        path: "{{ slurm_solvers_dir }}/antares-{{ item.version }}-{{ antares_solver_os | trim }}/bin/{{ item.bin }}"
      register: verify_solvers
      loop: "{{ antares_solvers }}"
      loop_control:
        label: "{{ item.version }}"
      when: slurm_enabled | bool

    # `stat` reports no xusr at all for a path that does not exist, hence the
    # default rather than a plain attribute test: absent and present but not
    # executable are the same verdict here.
    - name: Check every solver is there and executable
      ansible.builtin.assert:
        that: item.stat.xusr | default(false)
        fail_msg: >-
          {{ slurm_solvers_dir }}/antares-{{ item.item.version }}-{{ antares_solver_os | trim }}/bin/{{ item.item.bin }}
          is missing from the shared home of {{ inventory_hostname }}, or is
          not executable there.
        quiet: true
      loop: "{{ verify_solvers.results }}"
      loop_control:
        label: "{{ item.item.version }}"
      when: slurm_enabled | bool

    # Same reasoning for Xpansion when it is deployed, on the launcher and on
    # the two binaries it calls in turn.
    - name: Look for the Xpansion binaries in the shared home
      ansible.builtin.stat:
        path: >-
          {{ slurm_xpansion_dir }}/{{ (item.0.archive
             | default('antaresXpansion-' ~ item.0.version ~ '-' ~ (antares_xpansion_os | trim) ~ '.tar.gz'))
             | regex_replace('\.tar\.gz$', '') }}/{{ item.1 }}
      register: verify_xpansion
      # The launcher and Benders are named the same in every release; the
      # bundled solver follows the generation it belongs to, hence the `bin`
      # key of the entry, `antares-solver` from the 9.x line on.
      loop: >-
        {{ antares_xpansions | product(['antares-xpansion-launcher', 'bin/benders']) | list
           + antares_xpansions | zip(antares_xpansions
                                     | map(attribute='bin', default='antares-solver')
                                     | map('regex_replace', '^', 'bin/') | list) | list }}
      loop_control:
        label: "{{ item.0.version }}/{{ item.1 }}"
      when: slurm_enabled | bool and antares_xpansion_enabled | bool

    - name: Check every Xpansion binary is there and executable
      ansible.builtin.assert:
        that: item.stat.xusr | default(false)
        fail_msg: >-
          The Xpansion binary {{ item.item.0.version }}/{{ item.item.1 }} is missing
          from the shared home of {{ inventory_hostname }}, or is not executable there.
        quiet: true
      loop: "{{ verify_xpansion.results | default([]) }}"
      loop_control:
        label: "{{ item.item.0.version }}/{{ item.item.1 }}"
      when: slurm_enabled | bool and antares_xpansion_enabled | bool

    # The stat above says the file is there, this says it runs. That is the
    # question a package built for another distribution of the family fails,
    # and asking it costs nothing: the launcher prints the version of the
    # solver it bundles and exits. The answer is also what the entry claims,
    # so the same command checks the table the launch script is generated
    # from - a release whose bundled solver moved would otherwise be found
    # out by a study, hours later.
    - name: Ask each Xpansion launcher which solver it bundles
      ansible.builtin.command:
        cmd: >-
          {{ slurm_xpansion_dir }}/{{ (item.archive
             | default('antaresXpansion-' ~ item.version ~ '-' ~ (antares_xpansion_os | trim) ~ '.tar.gz'))
             | regex_replace('\.tar\.gz$', '') }}/antares-xpansion-launcher --antares-version
      register: verify_xpansion_version
      changed_when: false
      loop: "{{ antares_xpansions }}"
      loop_control:
        label: "{{ item.version }}"
      when: slurm_enabled | bool and antares_xpansion_enabled | bool

    - name: Check each of them bundles the solver its entry declares
      ansible.builtin.assert:
        that: item.stdout | trim == item.item.study_version
        fail_msg: >-
          Antares-Xpansion {{ item.item.version }} bundles the solver
          {{ item.stdout | trim }} on {{ inventory_hostname }}, not
          {{ item.item.study_version }} as antares_xpansions says. Studies of
          that version would be sent to a solver that cannot read them.
        quiet: true
      loop: "{{ verify_xpansion_version.results | default([]) }}"
      loop_control:
        label: "{{ item.item.version }}"
      when: slurm_enabled | bool and antares_xpansion_enabled | bool

# ---------------------------------------------------------------------------
#  The submission path, end to end
#
#  The one check that exercises what a study actually goes through: the key
#  generated on the web machine, the account it reaches on the front-end, the
#  munge authentication between the daemons, and a compute node running the
#  step. Everything above tests one link of that chain at a time.
# ---------------------------------------------------------------------------

- name: Antares-Web can run a job on the cluster
  hosts: antares_web
  become: true
  gather_facts: false
  tags: [verify, slurm]
  vars:
    # The role default, which is not in scope in a play that does not run the
    # role. An inventory that overrides it wins, as it should.
    verify_ssh_key: "{{ antarest_ssh_key | default(antarest_base_dir ~ '/deploy/id_rsa') }}"
  roles:
    - antares_defaults

  tasks:

    # As root rather than as the antares user, deliberately: the backend reads
    # this key inside a container, where it is bind-mounted as /id_rsa, so the
    # host-side traversal to the deploy directory is not part of the path
    # under test. The key, the authorized_keys entry the antares_ssh_access
    # role wrote and the cluster behind them are.
    - name: Submit a job the way the backend does, over SSH
      ansible.builtin.command:
        argv:
          - ssh
          - -i
          - "{{ verify_ssh_key }}"
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=no
          - -o
          - UserKnownHostsFile=/dev/null
          # VERBOSE rather than the ERROR the rest of this repository uses: a
          # server that accepts the connection and closes it straight away -
          # sshd past MaxStartups, or refusing a penalised source address - is
          # reported by the client either as "kex_exchange_identification" or
          # as nothing at all, depending on whether the reset lands while it
          # writes its banner or while it reads the other one. A failure with
          # an empty stderr and a hundredth of a second on the clock is not
          # something to debug twice, and the debug1 lines only ever appear in
          # the log when this task fails.
          - -o
          - LogLevel=VERBOSE
          - -o
          - ConnectTimeout=10
          - "{{ antares_user }}@{{ slurm_frontend_ip | trim }}"
          - "srun --ntasks=1 --time=2 hostname && test -x {{ slurm_launch_script }} && echo launch-script-ok"
      register: verify_srun
      changed_when: false
      when: slurm_enabled | bool

    - name: Check the job ran on a compute node
      ansible.builtin.assert:
        that:
          - (verify_srun.stdout_lines | first)
            in (groups['slurm_compute'] | default([]) | map('extract', hostvars, 'slurm_node_name') | list)
          - "'launch-script-ok' in verify_srun.stdout"
        fail_msg: >-
          The job submitted from {{ inventory_hostname }} through the front-end
          answered "{{ verify_srun.stdout | default('') }}", which is not the
          name of a compute node followed by the launch script check.
        quiet: true
      when: slurm_enabled | bool

# ---------------------------------------------------------------------------
#  The journal
#
#  Everything else in this file reads a journal at some point, and so does
#  every diagnosis made the day after. Where journald is actually writing is
#  therefore worth one question, and the answer is not the drop-in the role
#  wrote: a file it ignored, a later drop-in, a /var with nothing free, and
#  the machine is one reboot away from having no history of what it did.
# ---------------------------------------------------------------------------

- name: The journal is on disk and survives a reboot
  hosts: all:!builder
  become: true
  gather_facts: false
  tags: [verify, hardening]
  roles:
    - antares_defaults

  tasks:

    # `--header` lists the files journald would read, with their path, which
    # is the location itself rather than the configuration that asked for it.
    - name: Ask journald which files it is writing to
      ansible.builtin.command: journalctl --header
      register: verify_journal_header
      changed_when: false
      when:
        - hardening_enabled | bool
        - hardening_journal_persistent | bool

    - name: Check the journal lives in /var and not in the /run tmpfs
      ansible.builtin.assert:
        that:
          - verify_journal_persistent | length > 0
          - verify_journal_runtime | length == 0
        fail_msg: >-
          journald on {{ inventory_hostname }} holds
          {{ verify_journal_persistent | length }} file(s) under /var/log/journal
          and {{ verify_journal_runtime | length }} under
          /run/log/journal/{{ verify_machine_id }}
          ({{ verify_journal_runtime | join(', ') | default('none', true) }}), so
          this machine loses {{ 'part of' if verify_journal_persistent | length > 0
          else 'all of' }} its logs at the next reboot. Check
          /etc/systemd/journald.conf.d/10-antares.conf and what
          `journalctl --disk-usage` and `df -h /var` say there.
        quiet: true
      vars:
        verify_journal_files: >-
          {{ verify_journal_header.stdout_lines | default([])
             | select('match', '^File path: ')
             | map('regex_replace', '^File path: ', '') | list }}
        verify_journal_persistent: >-
          {{ verify_journal_files | select('match', '^/var/log/journal/') | list }}
        # Empty rather than absent would match every runtime directory, which
        # is the old reading of this check and the safe way to be wrong.
        verify_machine_id: "{{ ansible_facts['machine_id'] | default('') }}"
        # Written before /var is usable and moved by systemd-journal-flush at
        # boot, so anything left under this machine's own id belongs to a
        # machine that never flushed.
        #
        # Under its own id, and only an EL 9 says why that matters. Its cloud
        # images ship a committed /etc/machine-id, which cloud-init resets on
        # the first boot: journald runs for five seconds under the image's id,
        # is restarted under the new one, and flushes that one alone. What it
        # leaves behind is /run/log/journal/<the image's id>/system.journal,
        # OFFLINE, holding the first five seconds of the first boot. Nothing
        # writes to it, no reboot brings it back, and no flush can move it,
        # since journald only ever flushes its own id. It is not a journal this
        # machine is losing, and counting it failed three EL 9 clusters that
        # were keeping their logs exactly as asked.
        verify_journal_runtime: >-
          {{ verify_journal_files
             | select('match', '^/run/log/journal/' ~ (verify_machine_id | regex_escape)) | list }}
      when:
        - hardening_enabled | bool
        - hardening_journal_persistent | bool

# ---------------------------------------------------------------------------
#  The firewall
#
#  Three rulesets, one per kind of machine, checked from both sides. The
#  ports that matter are looked at twice, which is what makes the answer mean
#  something: a daemon is really listening on them, and the controller - not
#  in the inventory, therefore not trusted by any of the rulesets - still
#  cannot reach them, while the machines that need them can.
#
#  wait_for is the probe: state=started fails when nothing answers within the
#  timeout, state=stopped fails when something does. Against a drop policy a
#  connection hangs rather than being refused; both are "not reachable" here
#  and the difference does not change the verdict, hence the short
#  connect_timeout.
# ---------------------------------------------------------------------------

- name: The daemons the firewall has to cover are really listening
  hosts: all:!builder
  become: true
  gather_facts: false
  tags: [verify, firewall]
  vars:
    # The interface counts here even though it belongs to a container. How it
    # is offered depends on the podman generation, which is why two questions
    # are asked below rather than one: up to podman 5 a published port is also
    # held as a socket on the host and `ss` sees it, from podman 6 with
    # netavark 2 it is netfilter alone and `ss` sees nothing, on a machine
    # where the port answers perfectly well. Measured on the same run of this
    # file: Oracle Linux 10 with podman 5.8.2 lists 0.0.0.0:80, CentOS Stream
    # 10 with podman 6.0.2 does not, while both served the application.
    #
    # What a published port is in neither case is a socket the firewall can
    # filter - see the note on the private ports below.
    #
    # The exporters are in this list on every machine, which is what makes it
    # non-empty on a compute node of a deployment with no cluster: they are
    # the one thing every machine of a monitored fleet offers to another
    # machine, and an exporter that is not listening is a hole in the graphs
    # that nothing else reports.
    #
    # The Slurm one carries one more condition, and its default falls the
    # other way from the one prometheus.yml uses: the front-end deploys no
    # exporter when the Slurm client of the image is ahead of its own
    # controller, and monitoring_slurm_exporter_supported is the fact it
    # records that in - read here from the cache site.yml filled. Unknown
    # therefore means "do not ask", because the wrong answer in this
    # direction is a check that fails on a machine that is behaving exactly
    # as it was told to.
    verify_expected_listeners: >-
      {{ ([antarest_http_port | int]
          + ([antarest_https_port | int] if antarest_tls_enabled | default(false) | bool else [])
          if inventory_hostname in (groups['antares_web'] | default([])) else [])
         + (([2049, 6817] + ([6819] if slurmdbd_enabled | bool else []))
            if slurm_enabled | bool and inventory_hostname in (groups['slurm_frontend'] | default([])) else [])
         + ([6818]
            if slurm_enabled | bool and inventory_hostname in (groups['slurm_compute'] | default([])) else [])
         + ([monitoring_node_exporter_port | int] if monitoring_enabled | default(false) | bool else [])
         + ([monitoring_slurm_exporter_port | int]
            if monitoring_enabled | default(false) | bool and slurm_enabled | bool
               and monitoring_slurm_enabled | default(slurm_enabled) | bool
               and monitoring_slurm_exporter_supported | default(false) | bool
               and inventory_hostname in (groups['slurm_frontend'] | default([])) else []) }}
  roles:
    - antares_defaults

  tasks:

    - name: Read the listening sockets
      ansible.builtin.command: ss --listening --tcp --numeric
      register: verify_listening
      changed_when: false
      when: verify_expected_listeners | length > 0

    # The other half of the question, for the ports a container publishes and
    # `ss` may not see. Only the running containers are asked, which is the
    # point: a published port whose container is down offers nothing, and
    # answering "it is published" there would be exactly the vacuous pass this
    # play exists to prevent. A machine without podman - a compute node - is
    # not an error, it simply publishes nothing.
    - name: Read the ports the running containers publish
      ansible.builtin.command: podman ps --format json
      register: verify_podman_ps
      changed_when: false
      failed_when: false
      when: verify_expected_listeners | length > 0

    - name: Check every service this machine is supposed to offer is listening
      ansible.builtin.assert:
        that: verify_missing_listeners | length == 0
        fail_msg: >-
          Nothing offers {{ verify_missing_listeners | join(', ') }} on
          {{ inventory_hostname }}, so the probes below would pass on a
          machine that offers nothing at all. Listening sockets:
          {{ verify_listening.stdout_lines[1:] | join(' / ') | default('none', true) }}.
          Ports published by a running container:
          {{ verify_published_ports | join(', ') | default('none', true) }}
        quiet: true
      vars:
        # Column 4 of `ss` is the local address, port included. Loopback-only
        # sockets are dropped: they are unreachable by construction and would
        # answer the question the probes are asking.
        verify_listening_ports: >-
          {{ verify_listening.stdout_lines[1:]
             | map('regex_replace', '^\S+\s+\S+\s+\S+\s+(\S+)\s+.*$', '\1')
             | reject('match', '^(127\.|\[::1\])')
             | map('regex_replace', '^.*:', '') | map('int') | unique | list }}
        # `podman ps --format json` carries one Ports entry per mapping, with
        # host_ip empty when the port is published on every address. Dropped
        # for the same reason as the loopback sockets above, and the same rc
        # tolerance as any machine that has no podman at all.
        verify_published_ports: >-
          {{ (verify_podman_ps.stdout | default('[]', true) | from_json
              if verify_podman_ps.rc | default(1) == 0 else [])
             | selectattr('Ports') | map(attribute='Ports') | flatten
             | rejectattr('host_ip', 'match', '^(127\.|::1$)')
             | map(attribute='host_port') | map('int') | unique | list }}
        verify_missing_listeners: >-
          {{ verify_expected_listeners
             | reject('in', verify_listening_ports + verify_published_ports)
             | list }}
      when: verify_expected_listeners | length > 0

- name: The world reaches nothing but SSH, and the interface on the web machine
  hosts: all:!builder
  gather_facts: false
  become: false
  tags: [verify, firewall]
  vars:
    verify_address: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
    verify_public_ports: >-
      {{ [hostvars[inventory_hostname].ansible_port | default(22, true) | int]
         + ([antarest_http_port | int]
            + ([antarest_https_port | int] if antarest_tls_enabled | default(false) | bool else [])
            if inventory_hostname in (groups['antares_web'] | default([])) else []) }}
    # Everything a machine of this kind offers, or could be made to offer by
    # accident, that the world has no business reaching. 5355 is systemd's
    # LLMNR, which every machine here really does listen on, on every
    # interface, and which nothing outside has any business reaching: it is
    # the one entry in this list that is never vacuous. The interface ports
    # are in the list of every machine that is not the web server: nothing
    # serves them there, and a ruleset that opened them anyway is a bug worth
    # catching. On the web server the list holds instead what the front door
    # proxies to, which is published on the loopback and must stay there. So is
    # a database published on 0.0.0.0 - the firewall does not
    # cover that, since a published container port is DNATed and never
    # traverses the input hook, so the PublishPort of the unit is the only
    # thing standing between MariaDB and the network.
    #
    # The two exporter ports are deliberately absent from this list although
    # they listen on every interface: they are what the other machines of the
    # deployment scrape, so they are reachable by the inventory and dropped
    # for everyone else - which is the trusted set the probes below cannot
    # tell apart from the world, the controller being outside it. What is in
    # the list instead is Prometheus and Grafana, which are bound to the
    # loopback and must stay there whatever the front door serves.
    verify_private_ports: >-
      {{ [5355]
         + ([antarest_http_port | int, antarest_https_port | int]
            if inventory_hostname not in (groups['antares_web'] | default([]))
            else [5432, 6379, antarest_nginx_port | int]
                 + ([keycloak_port | int] if keycloak_enabled | default(false) | bool else []))
         + ([111, 2049, 6817, 3306] + ([6819] if slurmdbd_enabled | bool else [])
            if slurm_enabled | bool and inventory_hostname in (groups['slurm_frontend'] | default([])) else [])
         + ([111, 2049, 6818]
            if slurm_enabled | bool and inventory_hostname in (groups['slurm_compute'] | default([])) else [])
         + ([monitoring_prometheus_port | int, monitoring_grafana_port | int]
            if monitoring_enabled | default(false) | bool
               and inventory_hostname in (groups['antares_web'] | default([])) else []) }}
  roles:
    - antares_defaults

  tasks:

    - name: Probe from the controller the ports the world must reach
      ansible.builtin.wait_for:
        host: "{{ verify_address }}"
        port: "{{ item }}"
        state: started
        connect_timeout: 5
        timeout: 15
      loop: "{{ verify_public_ports }}"
      delegate_to: localhost
      when: hardening_firewall_enabled | bool

    - name: Probe from the controller the ports the world must not reach
      ansible.builtin.wait_for:
        host: "{{ verify_address }}"
        port: "{{ item }}"
        state: stopped
        connect_timeout: 5
        timeout: 15
      loop: "{{ verify_private_ports }}"
      delegate_to: localhost
      when: hardening_firewall_enabled | bool

- name: The compute nodes reach the front-end and each other
  hosts: slurm_compute
  gather_facts: false
  become: false
  tags: [verify, firewall]
  vars:
    verify_frontend: "{{ (groups['slurm_frontend'] | default([])) | first | default('') }}"
  roles:
    - antares_defaults

  tasks:

    # From the compute node itself, over the cluster network: these are the
    # flows the peer trust of the ruleset exists for, and the ones the play
    # above has just checked the world cannot use.
    - name: Reach the NFS and controller ports of the front-end
      ansible.builtin.wait_for:
        host: "{{ hostvars[verify_frontend].slurm_node_ip | trim }}"
        port: "{{ item }}"
        state: started
        connect_timeout: 5
        timeout: 15
      loop: [111, 2049, 6817]
      when:
        - slurm_enabled | bool
        - hardening_firewall_enabled | bool

    # A job step spanning several nodes has the nodes talk to each other, not
    # only to the controller.
    - name: Reach slurmd on the other compute nodes
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].slurm_node_ip | trim }}"
        port: 6818
        state: started
        connect_timeout: 5
        timeout: 15
      loop: "{{ (groups['slurm_compute'] | default([])) | difference([inventory_hostname]) }}"
      when:
        - slurm_enabled | bool
        - hardening_firewall_enabled | bool

- name: The front-end reaches its compute nodes
  hosts: slurm_frontend
  gather_facts: false
  become: false
  tags: [verify, firewall]
  roles:
    - antares_defaults

  tasks:

    - name: Reach slurmd on every compute node
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].slurm_node_ip | trim }}"
        port: 6818
        state: started
        connect_timeout: 5
        timeout: 15
      loop: "{{ groups['slurm_compute'] | default([]) }}"
      when:
        - slurm_enabled | bool
        - hardening_firewall_enabled | bool

- name: The web machine reaches the front-end it submits to
  hosts: antares_web
  gather_facts: false
  become: false
  tags: [verify, firewall]
  vars:
    verify_frontend: "{{ (groups['slurm_frontend'] | default([])) | first | default('') }}"
  roles:
    - antares_defaults

  tasks:

    - name: Reach the SSH port of the front-end
      ansible.builtin.wait_for:
        host: "{{ slurm_frontend_ip | trim }}"
        port: "{{ hostvars[verify_frontend].ansible_port | default(22, true) }}"
        state: started
        connect_timeout: 5
        timeout: 15
      when:
        - slurm_enabled | bool
        - hardening_firewall_enabled | bool

# ---------------------------------------------------------------------------
#  Tidy up
# ---------------------------------------------------------------------------

- name: Remove the marker from the shared home
  hosts: slurm_frontend
  become: true
  gather_facts: false
  tags: [verify, slurm]
  roles:
    - antares_defaults

  tasks:

    - name: Delete the marker
      ansible.builtin.file:
        path: "{{ antares_home }}/.verify-nfs"
        state: absent
      when: slurm_enabled | bool
