---
# ===========================================================================
#  Antares-Web + Slurm deployment - main knobs
# ===========================================================================

# ---------------------------------------------------------------------------
#  Unprivileged account, identical on every machine.
#  The UID/GID must match between the Antares-Web containers, the NFS share
#  and the Slurm nodes, otherwise the studies pushed over SSH are unreadable.
#
#  Deliberately not 1000. login.defs hands out human accounts from UID_MIN
#  (1000) upwards, sequentially, so 1000 is already taken on most images:
#  `ubuntu` on the Ubuntu cloud and server images, `debian` or `admin` on the
#  Debian cloud ones, the account created at install time on a manual install.
#  9000 sits well clear of that allocation path and well under UID_MAX (60000),
#  so it needs no useradd flag and stays free without coordination. It is also
#  baked into the derived backend image, so a single value across the fleet
#  means a single image (see antarest_add_container_user below).
#
#  The play reads the passwd and group databases before creating anything and
#  stops with the name of the account in the way, so a wrong guess here is
#  loud rather than subtle. Run with --check to validate the pair across every
#  machine without installing anything.
#
#  Two caveats:
#    - it has to be free on the Slurm nodes and the NFS server too, since the
#      point is UID coherence across the shared /home,
#    - on machines joined to a central directory (LDAP, AD via SSSD), have the
#      value reserved: nsswitch makes an existing collision visible here, but
#      not a future directory account handed the same UID.
#
#  Changing this on a machine that has already been deployed renumbers the
#  antares account and orphans everything it owns; the files under
#  antarest_base_dir and in the shared /home then need a chown -R.
# ---------------------------------------------------------------------------
antares_user: antares
antares_group: antares
antares_uid: 9000
antares_gid: 9000
antares_home: "/home/{{ antares_user }}"

# ---------------------------------------------------------------------------
#  Distributions
#
#  Two families are supported: Debian (Debian and Ubuntu, apt) and RedHat
#  (Oracle Linux and the other RHEL rebuilds, dnf). Package names, service
#  names and a handful of habits differ between the two; everything that does
#  is resolved from `ansible_facts['os_family']`, either here or in the defaults of the
#  role concerned, so a role never carries the same task twice.
#
#  What a RHEL-compatible target additionally needs, and what the playbook
#  therefore does for it:
#    - EPEL and CRB, for htop, fail2ban, certbot and the Slurm build below,
#    - SELinux, which is enforcing out of the box: the bind mounts of the
#      containers are labelled and the NFS booleans are set,
#    - firewalld, which is enabled out of the box and would drop the traffic
#      this deployment expects: see the hardening section at the bottom,
#    - Slurm, which no EL repository ships: it comes from OpenHPC, see
#      slurm_repo below.
#
#  EL 9 and EL 10 both carry a Slurm node, from two different OpenHPC series:
#  OpenHPC 3 for EL 9, OpenHPC 4 for EL 10, see slurm_openhpc_release below.
#  A major OpenHPC does not publish for at all is stopped by the check in
#  roles/slurm_common/tasks/repo.yml rather than left to fail on a missing
#  slurm-ohpc package.
#
#  One caveat, on both families: the Slurm version differs between releases
#  (23.11 on Ubuntu 24.04, 24.11 on Debian 13, 25.11 from OpenHPC 3 on EL 9
#  and 25.05 from OpenHPC 4 on EL 10) and the daemons only interoperate across
#  a couple of majors, so a single cluster must run a single distribution.
# ---------------------------------------------------------------------------
supported_distros:
  - "Debian 12"
  - "Debian 13"
  - "Ubuntu 22"
  - "Ubuntu 24"
  - "OracleLinux 9"
  - "OracleLinux 10"
  - "RedHat 9"
  - "RedHat 10"
  - "Rocky 9"
  - "Rocky 10"
  - "AlmaLinux 9"
  - "AlmaLinux 10"
  - "CentOS 9"
  - "CentOS 10"
distro_check_enabled: true

# The Ubuntu images run apt-daily and unattended-upgrades on boot, which holds
# the dpkg lock for a few minutes. Rather than passing this to every single
# install task, the common role writes it into apt.conf.d, where it also covers
# the apt commands this playbook does not run itself. Debian family only; dnf
# takes its own lock and waits by itself.
apt_lock_timeout: 300

# ---------------------------------------------------------------------------
#  Slurm on / off
#
#  false -> only the `antares_web` play runs and Antares-Web is configured
#           with the local launcher alone (the solver runs on the web server).
#  true  -> the Slurm cluster is deployed too and both launchers are exposed.
# ---------------------------------------------------------------------------
slurm_enabled: true

# ---------------------------------------------------------------------------
#  Antares Simulator (the solver)
#
#  Installed both on the Antares-Web machine (local launcher) and in the
#  shared /home of the cluster (Slurm launcher).
#
#  `study_version` is the key Antares-Web uses to pick a binary: it is the
#  "major.minor" of the study. `bin` is the executable name inside the
#  archive: `antares-<major>.<minor>-solver` up to 8.x, `antares-solver` from
#  9.x on.
#  Releases: https://github.com/AntaresSimulatorTeam/Antares_Simulator/releases
#
#  `antares_solver_os` picks which build of a release is downloaded, and that
#  is not cosmetic: the Ubuntu 22.04 build is linked against glibc 2.35 and
#  does not start on EL 9, which ships 2.34. The project also publishes an
#  Oracle Linux 8 build, whose glibc 2.28 runs on every EL 9 rebuild, so the
#  default follows the family of the target.
#
#  On a Slurm deployment the solvers are installed twice: on the Antares-Web
#  machine for the local launcher, and in the shared /home for the cluster.
#  Each side resolves this against its own facts, so a Debian web server
#  driving an Oracle Linux cluster gets the right binary on both.
# ---------------------------------------------------------------------------
antares_solver_os: >-
  {{ 'OracleServer-8.10' if ansible_facts['os_family'] == 'RedHat' else 'Ubuntu-22.04' }}
antares_solver_base_url: "https://github.com/AntaresSimulatorTeam/Antares_Simulator/releases/download"
antares_solvers:
  - version: "8.8.17"
    study_version: "8.8"
    bin: "antares-8.8-solver"
  - version: "9.2.0"
    study_version: "9.2"
    bin: "antares-solver"

# ---------------------------------------------------------------------------
#  Antares-Web (AntaREST)
# ---------------------------------------------------------------------------
antarest_repo: "https://github.com/AntaresSimulatorTeam/AntaREST.git"
antarest_version: "v2.34.0"            # git tag, branch or commit
antarest_base_dir: /var/antares-web
antarest_dir: "{{ antarest_base_dir }}/AntaREST"
antarest_update: true                  # let the play move the checkout to antarest_version
antarest_force_rebuild: false          # force front-end + image rebuild even if up to date

# Shallow clone by default: nothing here needs the history, and the checkout is
# reset on every run anyway. Set to 0 for a full clone.
antarest_clone_depth: 1

# ---------------------------------------------------------------------------
#  Where the image and the web application come from
#
#  `build`   : the target clones, builds the front-end with node and builds the
#              image. Self-contained, needs Internet and a few GB of RAM on the
#              machine that will also run the studies.
#  `archive` : the target loads a prebuilt image and unpacks a prebuilt
#              web application from antares_artifacts_dir. Build them once with
#              `ansible-playbook build.yml`.
#
#  `archive` is what makes a destroy-and-replay test loop bearable, and what
#  guarantees that several servers run the exact same bits: the build uses
#  `npm install` rather than `npm ci`, so two machines built on different days
#  do not necessarily produce the same front-end.
# ---------------------------------------------------------------------------
antarest_image_source: build

# Controller-side directory holding what build.yml produced. Gitignored.
antares_artifacts_dir: "{{ playbook_dir }}/artifacts"

# Controller-side cache of the solver tarballs. When a tarball is present here
# it is pushed to the target instead of being downloaded from GitHub again,
# which on a fresh machine is one of the longest steps of the whole run.
# Populated by build.yml.
antares_solver_cache_dir: "{{ antares_artifacts_dir }}"

# Builder-side paths, used by build.yml only. The build gets a podman store of
# its own on a chosen volume: a build machine is frequently short of space on /,
# and this leaves the builder's own podman configuration untouched, the store
# being passed as a flag rather than written into storage.conf. Set
# antares_build_root to an empty string to use the machine's normal store.
antares_build_root: /data/antares-build/store
antares_build_artifacts: /data/antares-build/artifacts

# Node version used to build the web app. `auto` reads webapp/.nvmrc from the
# checkout, which is the version the project actually tests against.
antarest_node_version: auto

# Add an antares_uid/antares_gid account inside the backend image. The
# containers run as that pair so that the files they create in the bind mounts
# belong to the antares user; without a matching passwd entry some code paths
# that need a home directory fail.
#
# Note that this bakes antares_uid into the image, so a prebuilt image is only
# reusable across machines that agree on the value. Setting HOME in the compose
# environment instead would decouple the two, at the cost of losing the passwd
# entry.
antarest_add_container_user: true

# Secrets - CHANGE THESE.
antarest_jwt_key: "secretkeytochange"
antarest_admin_password: "admin"
antarest_db_password: "somepass"       # postgres password used by the containers

# `local`, `slurm`, or leave it to follow slurm_enabled.
antarest_default_launcher: "{{ 'slurm' if slurm_enabled | bool else 'local' }}"

# Expose adminer (DB web UI) next to Antares-Web, bound on 127.0.0.1:8080.
antarest_enable_adminer: false

# Ports the interface is published on. Here rather than in the role defaults
# because the hardening role opens them in the firewall, and a role default is
# only in scope for the play that runs that role.
antarest_http_port: 80
antarest_https_port: 443

# ---------------------------------------------------------------------------
#  TLS
#
#  There is already an nginx in the stack, and it is the one that terminates
#  TLS: no second reverse proxy to install, no port to move. Switching this on
#  makes the antares-nginx container listen on antarest_https_port as well and,
#  by default, redirect http to it.
#
#  antarest_tls_provider:
#    letsencrypt : certbot obtains the certificate over http-01. The challenge
#                  is answered by the stack's own nginx (webroot method), so
#                  renewal needs no downtime and the certbot.timer shipped by
#                  the package handles it. Requires antares_tls_domain to
#                  resolve to this machine and port 80 to be reachable from the
#                  internet - that is what the ACME server connects to.
#    selfsigned  : a certificate generated on the machine. Encrypts the traffic,
#                  and every browser says so loudly. For an internal network,
#                  or to test the plumbing without burning ACME rate limits.
#    manual      : a certificate you copied on the machine yourself, for
#                  instance one issued by a company CA. Set
#                  antarest_tls_certificate / antarest_tls_certificate_key
#                  (see roles/antares_web/defaults/main.yml) to the full chain
#                  and the private key.
#
#  First run with letsencrypt: the stack comes up on plain http, certbot gets
#  the certificate through it, and the playbook then reloads nginx with TLS on.
#  Nothing to do twice.
# ---------------------------------------------------------------------------
antarest_tls_enabled: false
antarest_tls_domain: ""                # e.g. antares.example.org
antarest_tls_provider: letsencrypt
antarest_tls_email: ""                 # where Let's Encrypt sends expiry notices
# Issue against the Let's Encrypt staging CA: untrusted certificates, but rate
# limits that a debugging session cannot exhaust. Switching back to production
# needs a `certbot renew --force-renewal` (or removing the certificate), since
# the playbook only obtains one when there is none.
antarest_tls_staging: false

# ---------------------------------------------------------------------------
#  Containers
#
#  The stack runs on podman, driven by quadlet: each container is a systemd
#  unit generated from a .container file in /etc/containers/systemd, and
#  systemd owns the ordering, the restarts and the logs. There is no compose
#  file and no daemon.
#
#  Podman runs rootful, so `User=` inside a container maps straight to the host
#  UID exactly as it did with Docker. Rootless would remap it through
#  /etc/subuid and break the UID coherence the shared /home relies on.
# ---------------------------------------------------------------------------
container_cmd: /usr/bin/podman

# Images are always written fully qualified: Debian and Ubuntu ship no
# unqualified-search-registries, so a short name cannot be resolved and podman
# refuses rather than guessing a registry. The RHEL rebuilds do ship one, and
# it lists Red Hat's registries before Docker Hub, so a short name there would
# resolve somewhere else entirely. Fully qualified is the only spelling that
# means the same thing on both.
container_registry: docker.io/library

# Mount options appended to every bind mount of every container.
#
# On a machine with SELinux enforcing - which is every RHEL rebuild out of the
# box - a bind mount carries the label of the host directory, and a container
# is not allowed to read it: the process is container_t and the directory is
# var_t or home_root_t. `z` relabels the host directory container_file_t, the
# shared flavour of the two, which is the one that matters here because
# several containers mount the same directories (the backend and the celery
# worker share the workspaces, the matrix store and the logs). The private
# flavour `Z` stamps a per-container category on them instead, so the second
# container to start would lose access to what the first one relabelled.
#
# Empty on a machine without SELinux, where the flag would be a no-op that
# only makes the units harder to read.
container_volume_opts: >-
  {{ ',z' if (ansible_facts.selinux.status | default('disabled')) == 'enabled' else '' }}

# Podman prefixes images built locally with `localhost/`. Both forms resolve
# for a local lookup, but the explicit one keeps podman from ever reaching out
# to a registry for our own image.
container_local_prefix: localhost

# ---------------------------------------------------------------------------
#  Slurm cluster
# ---------------------------------------------------------------------------
slurm_cluster_name: antares
slurm_partition: antares

# Where the Slurm packages come from.
#
#   distro  : the distribution ships them. True on Debian and Ubuntu
#             (slurm-wlm), false on every EL rebuild: neither the base
#             repositories nor EPEL carry Slurm any more.
#   openhpc : the OpenHPC repositories, which package Slurm for EL and are
#             what the HPC world actually uses there. The package names then
#             carry an -ohpc suffix, and /etc/slurm, the systemd units and the
#             slurm account are the same as everywhere else, so nothing beyond
#             the names changes.
#
# The default follows the family. Set slurm_repo to `distro` on a RedHat
# machine whose Slurm you install yourself.
slurm_repo: "{{ 'openhpc' if ansible_facts['os_family'] == 'RedHat' else 'distro' }}"

# The release rpm that declares those repositories, per EL major, because
# OpenHPC does not keep one series per major: OpenHPC 3 publishes EL_9 and no
# more, OpenHPC 4 publishes EL_10 and openEuler and has no EL_9 tree. So the
# major of the machine picks the series, and a machine whose major is not
# listed here gets an empty string, which roles/slurm_common/tasks/repo.yml
# turns into a named failure rather than a missing package much later.
#
# Consequence worth knowing before mixing majors: the two series do not carry
# the same Slurm. OpenHPC 3 is on 25.11 today, OpenHPC 4 on 25.05, so EL 10
# gets the *older* one. That does not matter for one cluster, which the
# "one distribution per cluster" rule above already keeps homogeneous, and it
# is the reason that rule is there.
#
# Override with a full URL to pin another version or a local mirror. The
# check in repo.yml only compares the EL_<major> in the path with the machine.
slurm_openhpc_release: >-
  {{ _slurm_openhpc_release_by_major[ansible_facts['distribution_major_version']]
     | default('') }}
_slurm_openhpc_release_by_major:
  "9": "http://repos.openhpc.community/OpenHPC/3/EL_9/x86_64/ohpc-release-3-1.el9.x86_64.rpm"
  "10": "http://repos.openhpc.community/OpenHPC/4/EL_10/x86_64/ohpc-release-4-1.el10.x86_64.rpm"

# Paths and system account used by the Slurm daemons. Defined here rather
# than in the roles because several plays need them.
slurm_conf_dir: /etc/slurm
slurm_log_dir: /var/log/slurm
slurm_spool_dir: /var/spool/slurm
slurm_user: slurm

# `select/cons_tres` lets several studies share a node, which is what makes
# the --cpus-per-task sent by antares-launcher meaningful. Switch to
# `select/linear` for exclusive whole-node allocation.
slurm_select_type: "select/cons_tres"
slurm_select_type_parameters: "CR_Core"

# Root of the solver installs inside the shared /home.
slurm_solvers_dir: "{{ antares_home }}/solvers"
# Scratch space used by the launch script. Must live in the shared /home so
# that the front-end can pick the results up.
slurm_scratch_dir: "{{ antares_home }}/scratch"
slurm_launch_script: "{{ antares_home }}/launchAntares.sh"

# Accounting database (MariaDB in a container on the front-end).
slurmdbd_enabled: true
slurmdbd_db_password: "changeme-slurm-acct"
slurmdbd_dir: /var/slurmdb
# Pinned to a major, like the Antares-Web images: the slurmdb-data volume holds
# a MariaDB cluster of one specific major, and moving to the next one is a
# deliberate dump and restore, not something a re-run should trigger.
slurmdbd_mariadb_image: "{{ container_registry }}/mariadb:11"
slurmdbd_adminer_image: "{{ container_registry }}/adminer:5"
# The reference procedure uses 12G, which does not fit a small front-end VM.
slurmdbd_innodb_buffer_pool_size: "1G"
slurmdbd_enable_adminer: false

# NFS
nfs_export_path: /home
nfs_export_options: "rw,sync,no_root_squash,no_subtree_check"
nfs_export_clients: "*"
nfs_mount_options: "defaults,_netdev"

# Write the cluster nodes into /etc/hosts so every node can resolve the others.
manage_etc_hosts: true
# Set /etc/hostname to the inventory short name (needs a reboot to fully apply).
manage_hostname: false

# ---------------------------------------------------------------------------
#  Hardening
#
#  Written for the case this playbook makes easy: a blank VM, a few minutes,
#  and an Antares-Web reachable on the internet with 22 and 80 open. Four
#  blocks, each independent:
#
#    firewall   : an nftables input chain with a drop policy. Open to the
#                 world: the SSH ports sshd actually listens on (read from
#                 `sshd -T`, not assumed to be 22) and, on an antares_web
#                 machine, the interface. Open to the other machines of the
#                 inventory: everything, which is what keeps NFS, Slurm and
#                 the job submission path working without exposing 2049 or
#                 6817. This filters the *host*: what the containers publish
#                 is decided by their units, where adminer and the accounting
#                 MariaDB are bound to 127.0.0.1.
#    fail2ban   : the sshd jail, plus a jail on the Antares-Web login form,
#                 which the API answers 401 on and nginx logs. Bans are
#                 dropped in the prerouting hook, so they also apply to the
#                 containers, which an ordinary input-hook ban does not.
#    ssh        : no password authentication (the role checks your key is in
#                 place first and stops rather than lock you out), no root
#                 password login, a shorter grace time.
#    updates    : security updates that install themselves, without the
#                 automatic reboot. unattended-upgrades on the Debian family,
#                 dnf-automatic on the RedHat one.
#
#  Turning the firewall on is the one that can cut you off, so read what it
#  opens above. It never closes the port you are connected on, and the play
#  refuses to run if it cannot work out which one that is.
#
#  On a RHEL rebuild there is already a firewall running: firewalld, enabled by
#  the installer, dropping everything but SSH. Debian and Ubuntu ship none.
#  `hardening_firewall_enabled: false` means no host firewall, so firewalld is
#  stopped, disabled and masked either way; the nftables table is what the
#  knob actually turns on. Two filters that have to agree is exactly the
#  situation the comment above warns about. Set hardening_manage_firewalld
#  to false to be left alone with firewalld.
# ---------------------------------------------------------------------------
hardening_enabled: true

# Off by default: a cloud VM already sits behind a security group, and two
# filters that have to agree is one more place for a rule to go missing. Turn
# it on for a machine that has nothing in front of it (bare metal, a hypervisor
# without a filtering layer, a VM on a flat network), and read what it opens
# above before doing so. It is also the answer for a Slurm front-end, whose NFS
# export with no_root_squash is the one thing here that must never be reachable
# from anywhere else.
hardening_firewall_enabled: false

hardening_fail2ban_enabled: true
hardening_ssh_enabled: true
hardening_unattended_upgrades: true

# Report the secrets above still holding the value this repository ships.
hardening_check_secrets: true
# Make that report a failure. Off by default so that a throwaway test machine
# stays a one-liner; worth turning on for anything that outlives the day.
hardening_fail_on_default_secrets: false

# ---------------------------------------------------------------------------
#  Derived values - normally no need to touch these
# ---------------------------------------------------------------------------
_slurm_frontend_host: "{{ (groups['slurm_frontend'] | default([])) | first | default('') }}"

slurm_frontend_name: >-
  {{ (hostvars[_slurm_frontend_host].slurm_node_name
      | default(_slurm_frontend_host.split('.')[0])) if _slurm_frontend_host else '' }}

slurm_frontend_ip: >-
  {{ (hostvars[_slurm_frontend_host].slurm_node_ip
      | default(hostvars[_slurm_frontend_host].ansible_facts.default_ipv4.address
      | default(hostvars[_slurm_frontend_host].ansible_host | default('')))) if _slurm_frontend_host else '' }}

# Number of cores offered in the Antares-Web launch dialog for Slurm jobs.
# The maximum is capped to the smallest compute node, otherwise jobs asking
# for more cores than any node owns stay pending forever.
#
# A compute node whose facts are not around contributes nothing rather than
# taking the play down: a --limit run on the web machine with an expired cache
# leaves hostvars[node].ansible_facts empty. The default of `map(attribute=)`
# is only substituted when it is truthy, hence 0 and the reject rather than
# None: with None the undefined reaches `min` and the render fails.
_slurm_compute_vcpus: >-
  {{ (groups['slurm_compute'] | default([]))
     | map('extract', hostvars)
     | map(attribute='ansible_facts.processor_vcpus', default=0)
     | select('integer') | reject('eq', 0) | list }}
slurm_launcher_nb_cores_min: 1
slurm_launcher_nb_cores_max: "{{ (_slurm_compute_vcpus | min) if (_slurm_compute_vcpus | length) > 0 else 2 }}"
slurm_launcher_nb_cores_default: "{{ [2, slurm_launcher_nb_cores_max | int] | min }}"

# Slurm launcher timings (seconds), as in the reference procedure.
slurm_launcher_default_wait_time: 900
slurm_launcher_default_time_limit: 172800
