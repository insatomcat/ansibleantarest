---
# ===========================================================================
#  Build the Antares-Web artefacts once, on a builder machine
#
#      ansible-playbook build.yml
#
#  Produces, in ./artifacts on the controller:
#    - antarest-image.tar.gz     the backend image, UID baked in
#    - thirdparty-*.tar.gz       postgres, redis, nginx, adminer if enabled
#    - webapp-dist.tar.gz        the built web application
#    - antares-*.tar.gz          the solver tarballs
#    - manifest.yml              what is actually in there
#
#  Then deploy without rebuilding anything:
#
#      ansible-playbook site.yml -e antarest_image_source=archive
#
#  Why bother: a from-scratch run on a target spends most of its time on
#  `npm install` (which wants ~4 GB of heap), on building the backend image, and
#  on downloading the solvers. Doing that once instead of once per machine is
#  the difference between a usable destroy-and-replay loop and a coffee break.
#
#  The builder needs nothing installed beforehand: this play installs podman on
#  it through the same role the deployment uses. It must however share the
#  architecture of the targets. Building for amd64 from an arm64 machine means
#  QEMU emulation, which is slow enough to defeat the purpose.
#
#  This reuses the very task files the normal deployment uses, so the artefacts
#  cannot be built by a different recipe than the one they replace.
# ===========================================================================

- name: Build the Antares-Web artefacts
  hosts: builder
  gather_facts: true
  become: true
  vars:
    # Suppresses the "restart the stack" notify of build_image.yml: there is no
    # stack on a builder.
    antarest_builder_mode: true

    # The whole point of overriding this here: the reused build tasks call
    # container_cmd, so this is what sends their layers to the build store
    # instead of the builder's default one on /.
    container_cmd: >-
      /usr/bin/podman{{ ' --root ' ~ antares_build_root if antares_build_root | length > 0 else '' }}

    # No antares account is created on a builder, so the checkout belongs to
    # root. Note that this is NOT antares_user: that name is baked into the image
    # as the account to create, and overriding it here would emit a
    # `groupadd root` inside the image.
    antarest_checkout_owner: root
    antarest_checkout_group: root

    # And so the front-end build container runs as root too, since it has to
    # write node_modules and dist into a root-owned checkout. antares_uid is
    # left alone, so the image still carries the fleet's UID.
    antarest_frontend_build_uid: 0
    antarest_frontend_build_gid: 0
  # Before the role below, because it runs `podman info` against the build
  # store, which has to exist by then.
  pre_tasks:

    - name: Create the build directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ antares_build_root }}"
        - "{{ antares_build_artifacts }}"
        - "{{ antarest_base_dir }}"
      when: item | length > 0

  # The same role the deployment uses, so a blank VM can be a builder without
  # any manual preparation. It installs podman and checks it is recent enough,
  # which is all a builder needs: nothing here starts a container from a unit.
  roles:
    - podman

  tasks:

    - name: Fetch the AntaREST sources
      ansible.builtin.include_role:
        name: antares_web
        tasks_from: checkout
        public: true

    - name: Patch the web application sources
      ansible.builtin.include_role:
        name: antares_web
        tasks_from: patch_frontend
        public: true
      when: antarest_patch_login_label | bool

    - name: Build the web application
      ansible.builtin.include_role:
        name: antares_web
        tasks_from: build_frontend
        public: true

    - name: Build the Antares-Web image
      ansible.builtin.include_role:
        name: antares_web
        tasks_from: build_image
        public: true

    - name: Save everything as archives and bring them back
      ansible.builtin.include_role:
        name: antares_build
        public: true
