---
# ===========================================================================
#  Inventory used by .github/workflows/ci.yml.
#
#  One machine plays three roles: the GitHub runner is the controller, the
#  `builder` of build.yml and the `antares_web` host of site.yml. That is what
#  makes the whole loop testable in a single job: build.yml produces the
#  artefacts, site.yml deploys them with antarest_image_source=archive.
#
#  It is reached over SSH on 127.0.0.1 rather than with
#  `ansible_connection: local`, on purpose:
#    - the local connection runs every task as whoever started ansible and
#      never actually elevates, so a task missing `become: true` would pass in
#      CI and fail on a real machine;
#    - ansible.posix.synchronize, which ships the artefacts to the target,
#      only gets its `sudo rsync` on the remote side of an SSH connection.
#      Locally it would write to a root-owned directory as the runner user.
#  Over SSH, CI walks the same code path a deployment does.
#
#  The runner is destroyed with the job, so the play may harden its sshd,
#  install fail2ban and enable unattended upgrades exactly as it would on a
#  real VM. Nothing here weakens the deployment to make it fit CI.
#
#  Note on precedence, the same one the example inventories carry: settings
#  written under a *host* override group_vars/all.yml, a `vars:` block on a
#  group does not. Everything below therefore sits on the host.
# ===========================================================================

all:
  hosts:

    ci-runner:

      # ---------------------------------------------------------------
      #  Connection. The key is generated by the workflow and added to
      #  the runner's own authorized_keys; host_key_checking is already
      #  off in ansible.cfg.
      #
      #  `ci-target` is an /etc/hosts alias for 127.0.0.1, written by the
      #  workflow, and it is deliberately not the literal address.
      #  ansible.posix.synchronize decides whether rsync needs SSH by
      #  testing the destination against ansible's LOCALHOST set
      #  (127.0.0.1, localhost, ::1). Written as the address, it concluded
      #  that both ends were the same machine, ran a plain local rsync and
      #  dropped the --rsync-path='sudo -u root rsync' that elevates on
      #  the far side, so shipping the archives died on "mkstemp
      #  /var/antares-web/artifacts/... Permission denied". Under a name,
      #  the same transfer goes over SSH and rsync runs as root where it
      #  has to.
      # ---------------------------------------------------------------
      ansible_host: ci-target
      ansible_user: runner
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ci

      # ---------------------------------------------------------------
      #  The runner image is Ubuntu 26.04, which the shipped
      #  supported_distros does not list: 26.04 is a GitHub beta image and
      #  claiming it repository-wide would be claiming more than has been
      #  tested. Listing it here is what the preflight failure message
      #  tells you to do, and it keeps the claim scoped to CI.
      #  Drop the last entry when running this inventory on ubuntu-24.04.
      # ---------------------------------------------------------------
      supported_distros:
        - "Debian 12"
        - "Debian 13"
        - "Ubuntu 22"
        - "Ubuntu 24"
        - "OracleLinux 9"
        - "RedHat 9"
        - "Rocky 9"
        - "AlmaLinux 9"
        - "CentOS 9"
        - "Ubuntu 26"

      # ---------------------------------------------------------------
      #  One machine, no cluster: the studies would run with the local
      #  launcher. The slurm groups are absent from this inventory, which
      #  is the other half of the switch.
      # ---------------------------------------------------------------
      slurm_enabled: false

      # ---------------------------------------------------------------
      #  Disk. A GitHub runner has around 20 GB free on / once the
      #  preinstalled toolchains are removed, and the build store alone
      #  (node modules, the AntaREST image and its layers) needs more than
      #  that. /mnt is the runner's temp disk, roughly 60 GB free, which
      #  is exactly what antares_build_root exists for.
      # ---------------------------------------------------------------
      antares_build_root: /mnt/antares-build/store
      antares_build_artifacts: /mnt/antares-build/artifacts

      # antares_artifacts_dir is left at its default, ./artifacts in the
      # checkout: the round trip through a directory of its own is what a
      # deployment does, and it now costs seconds. It was pointed at the
      # builder's own directory while "Fetch the artefacts back to the
      # controller" still used ansible.builtin.fetch, in the belief that
      # the seventeen minutes it took were the transfer. They were not,
      # they were fetch slurping the archives through a module result
      # whatever the destination, so that override bought nothing and hid
      # the real cause.

      # ---------------------------------------------------------------
      #  Not the shipped defaults, so the secrets check of the hardening
      #  role has nothing to report and that path is exercised too. These
      #  are public by construction: the machine is destroyed with the
      #  job and nothing is ever reachable from outside it.
      # ---------------------------------------------------------------
      antarest_jwt_key: "ci-jwt-not-a-secret"
      antarest_admin_password: "ci-admin-not-a-secret"
      antarest_db_password: "ci-db-not-a-secret"

      # ---------------------------------------------------------------
      #  Left at the shipped default, which is what most deployments run,
      #  so CI tests the configuration people actually get. Set it to true
      #  to cover the nftables table as well: it filters the input hook
      #  only, trusts lo and the podman bridges, and opens the SSH ports
      #  it reads from `sshd -T`, so the runner keeps working. That also
      #  makes the run depend on the ruleset being right, which is the
      #  point of turning it on.
      # ---------------------------------------------------------------
      hardening_firewall_enabled: false

  children:

    builder:
      hosts:
        ci-runner:

    antares_web:
      hosts:
        ci-runner:
