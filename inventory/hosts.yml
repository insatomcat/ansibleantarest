---
# Example inventory.
#
# Three kinds of machines:
#   - antares_web    : builds and runs Antares-Web (needs Docker and internet access)
#   - slurm_frontend : Slurm controller + accounting DB + NFS server for /home
#   - slurm_compute  : Slurm compute nodes, they mount /home over NFS
#
# To deploy WITHOUT Slurm (local solver only), drop the `slurm` group entirely
# and set `slurm_enabled: false` here (or -e slurm_enabled=false).
#
# A machine may be in several groups. The front-end can be a compute node as
# well - list it under `slurm_compute` too - which is what a small cluster
# looks like: the controller runs jobs and the shared /home is local for it,
# the roles skip what makes no sense there (the NFS mount, the "no controller
# on a compute node" guard) and nothing else changes. The number of compute
# nodes is whatever this file says; slurm.conf is generated from the group.
#
# Taken to its end, that is one machine listed in the three groups: Antares-Web
# and the cluster it submits to on the same host. It is a supported shape and
# the CI deploys it on every distribution, because it is the only way to run
# Antares-Xpansion without a second machine - the local launcher ignores the
# Xpansion mode. See "The cluster on the web machine itself" in docs/slurm.md
# for what to pin before the web stack and a Benders run start competing for
# the same memory.
#
# `ansible_host` should be the address Ansible connects to. The address written
# into /etc/hosts and slurm.conf is taken from the `ansible_facts['default_ipv4']` fact,
# and can be forced per host with `slurm_node_ip`.
#
# The *name* of a Slurm machine here has to be the name the machine itself
# answers to, because every Slurm daemon compares the two and refuses to run
# on a mismatch. The playbook checks it before installing anything and names
# both; `slurm_node_name` keeps an inventory name that differs from the
# machine's own. See "The name a machine answers to" in docs/slurm.md.

all:
  children:

    # Machine that builds the image and the web application once, for
    # `ansible-playbook build.yml`. Not part of site.yml, and it must share the
    # architecture of the targets: building amd64 artefacts on an arm64 machine
    # means QEMU emulation, slow enough to defeat the purpose.
    builder:
      hosts:
        builder1:

    antares_web:
      hosts:
        web1:
          ansible_host: 203.0.113.20
          ansible_port: 2222
          ansible_user: admin

    slurm:
      children:

        slurm_frontend:
          hosts:
            slurm70:
              ansible_host: 10.1.0.70

        slurm_compute:
          hosts:
            slurm71:
              ansible_host: 10.1.0.71
            slurm72:
              ansible_host: 10.1.0.72
            slurm73:
              ansible_host: 10.1.0.73
