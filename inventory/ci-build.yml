---
# ===========================================================================
#  Builder half of the CI, used by the `build` job of
#  .github/workflows/ci.yml.
#
#  The GitHub runner is the controller and the `builder` of build.yml at
#  once. It produces the artefacts in ./artifacts on the controller, which
#  the job then uploads; the deploy jobs download them and hand them to a
#  virtual machine of their own (see inventory/ci-vm.yml).
#
#  Ansible reaches the runner over SSH on 127.0.0.1 rather than with the
#  local connection, on purpose:
#    - the local connection runs every task as whoever started ansible and
#      never actually elevates, so a task missing `become: true` would pass
#      in CI and fail on a real machine;
#    - ansible.posix.synchronize, which pulls the artefacts back to the
#      controller at the end of build.yml, only gets its `sudo rsync` on the
#      remote side of an SSH connection. Locally it would read a root-owned
#      directory as the runner user.
#
#  `ci-target` is an /etc/hosts alias for 127.0.0.1, written by the workflow,
#  and it is deliberately not the literal address: synchronize decides
#  whether rsync needs SSH by testing the host against ansible's LOCALHOST
#  set (127.0.0.1, localhost, ::1), and under the address it runs a plain
#  local rsync without the elevation the far side needs.
#
#  Note on precedence, the same one the example inventories carry: every
#  default lives in a role, which is the lowest precedence Ansible has, so
#  anything written here wins - on a host or on a group alike.
# ===========================================================================

all:
  hosts:

    ci-runner:

      # ---------------------------------------------------------------
      #  Connection. The key is generated by the workflow and added to the
      #  runner's own authorized_keys; host_key_checking is already off in
      #  ansible.cfg.
      # ---------------------------------------------------------------
      ansible_host: ci-target
      ansible_user: runner
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519_ci


      # ---------------------------------------------------------------
      #  One build feeds every target of the matrix, and they are not all
      #  of the same family: the Ubuntu 22.04 solver build is linked
      #  against glibc 2.35 and does not start on EL 9, so the EL targets
      #  need the Oracle Linux 8 build, whose glibc 2.28 runs everywhere.
      #  The default here would only cache the builder's own family, which
      #  would leave the EL jobs downloading their solvers from GitHub one
      #  by one - slower, and no longer a test of the artefact path.
      # ---------------------------------------------------------------
      antares_build_solver_os:
        - "Ubuntu-22.04"
        - "OracleServer-8.10"

      # ---------------------------------------------------------------
      #  Antares-Xpansion. On the builder because antares_build_fetch_xpansions
      #  follows this flag, and the `slurm` and `standalone-slurm` suites
      #  deploy Xpansion from these very artefacts.
      #
      #  Not only a matter of speed, unlike the solver list above: a release
      #  tarball is not a container image, it lands in the same directory as
      #  the ones that are, and the archive path has to be exercised with both
      #  kinds next to each other. Without this the artefact set never held a
      #  single antaresXpansion-*.tar.gz and
      #  roles/antares_web/tasks/load_artifacts.yml was free to hand one to
      #  `podman load`, which is exactly what it did.
      #
      #  Both families, like the solvers: the EL targets of the matrix run
      #  Xpansion too. 1.3.0 is cached under the builder's own name whatever
      #  is listed here, since roles/antares_defaults spells its asset out per
      #  family and that expression is resolved on the builder; the EL jobs
      #  fetch that one from GitHub, which costs time and not a failure.
      # ---------------------------------------------------------------
      antares_xpansion_enabled: true
      antares_build_xpansion_os:
        - "ubuntu-22.04"
        - "OracleServer-8.10"

      # ---------------------------------------------------------------
      #  Keycloak and the connector that puts it to use. They belong on the
      #  builder because this is where they decide what ends up in the
      #  artefacts: keycloak_enabled is what adds keycloak_image to
      #  antarest_thirdparty_images, and antares_auth_provider is what
      #  build.yml builds a connector image at all for. The deploy jobs run
      #  with antarest_image_source=archive, where nothing pulls, so a
      #  target turning either of them on without this would fail on an
      #  image that was never shipped.
      # ---------------------------------------------------------------
      keycloak_enabled: true
      antares_auth_provider: keycloak

      # ---------------------------------------------------------------
      #  Monitoring, here for exactly the same reason: monitoring_enabled
      #  is what fills monitoring_images, and that list is what build.yml
      #  pulls and archives under the monitoring-thirdparty-* prefix. The
      #  three deploy suites turn it on and run with
      #  antarest_image_source=archive, where nothing pulls, so a target
      #  would otherwise fail on images that were never shipped.
      #
      #  slurm_enabled is left at the default of antares_defaults, which
      #  is true, so the Slurm exporter is archived too and the cluster
      #  suites find it.
      # ---------------------------------------------------------------
      monitoring_enabled: true

      # Left at the default of antares_defaults, which is true. The builder
      # is not a cluster node, but this is also what decides whether the
      # accounting database's images are archived, and the `slurm` and
      # `standalone-slurm` jobs deploy from these very artefacts: turning it
      # off here would leave them with no MariaDB to load.

      # ---------------------------------------------------------------
      #  Disk. A GitHub runner has around 20 GB free on / once the
      #  preinstalled toolchains are removed, and the build store alone
      #  (node modules, the AntaREST image and its layers) needs more than
      #  that. /mnt is the runner's temp disk, roughly 60 GB free, which
      #  is exactly what antares_build_root exists for.
      # ---------------------------------------------------------------
      antares_build_root: /mnt/antares-build/store
      antares_build_artifacts: /mnt/antares-build/artifacts

      # antares_artifacts_dir is left at its default, ./artifacts in the
      # checkout, which is the directory the job uploads.

  children:

    builder:
      hosts:
        ci-runner:
