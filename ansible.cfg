[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = False
# The `yaml` stdout callback lived in community.general and was removed in its
# 12.0.0; the replacement is the built-in `default` callback in yaml mode.
stdout_callback      = default
callback_result_format = yaml
callbacks_enabled    = profile_tasks
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = .facts
fact_caching_timeout = 7200
# Every supported distribution ships /usr/bin/python3. Pinning it avoids
# interpreter discovery writing a versioned path (python3.12 on Ubuntu 24.04)
# into the fact cache, which then fails after the same inventory name is
# rebuilt as another distribution (python3.9 on Oracle Linux 9).
interpreter_python   = /usr/bin/python3
retry_files_enabled  = False
force_valid_group_names = ignore

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
