---
# ===========================================================================
#  Build the artefacts once, then deploy them on one virtual machine per
#  distribution, in parallel.
#
#      syntax     -> the playbooks parse
#      build      -> build.yml on the runner itself, artefacts uploaded
#      standalone -> one job per target: boot a VM, site.yml, curl, idempotence
#      slurm      -> one job per target: boot five VMs on a bridge, site.yml,
#                    verify.yml, idempotence
#
#  The runner stays Ubuntu 26.04 and is only the controller and the builder.
#  Every deployment happens inside a QEMU/KVM machine booted from the cloud
#  image of the distribution under test, which is what makes the EL side
#  testable here at all: nested virtualisation is available on the
#  GitHub-hosted Linux x64 runners, so /dev/kvm is real and the guest runs at
#  native speed.
#
#  What that covers and deploying on the runner did not: SELinux enforcing,
#  firewalld, the distribution's own kernel and podman, systemd as PID 1 of
#  the target, and the artefacts actually travelling over the network to a
#  machine that is not the controller.
#
#  The `standalone` job is Antares-Web on its own, with the studies running
#  on the machine itself. The `slurm` job is the other shape the playbook
#  supports and the one the reference procedure describes: five machines on
#  a network of their own, the web server, the Slurm front-end and three
#  compute nodes. That is what makes NFS, munge, the job submission over SSH
#  and - the reason this job exists at all - three different firewall
#  rulesets testable, since a ruleset is only meaningful when there is
#  someone else on the wire. See inventory/ci-cluster.yml and verify.yml.
#
#  Adding a distribution is one entry in the `targets` job below plus one
#  option in the `only` input, provided its cloud image reads a NoCloud seed
#  and boots on legacy BIOS - every image listed there does. Adding it to the
#  Slurm suite as well is the `slurm` flag on the same entry: `always` for a
#  target every pull request pays for, `dispatch` for one a manual run picks
#  up. See the note above that table for what the memory columns are for.
#
#  The images are downloaded on every run and not cached. Measured on the
#  first green run: between 5 and 8 seconds each, 110 to 165 MB/s from all
#  the mirrors. An actions/cache round trip does not beat that, and the base
#  images together would take more than the 10 GB a repository gets. The archives
#  the deploy jobs consume are a different matter and do travel through the
#  artefact store, once for all of them.
#
#  ubuntu-26.04 is a beta runner image. If it starts misbehaving, run the
#  workflow by hand and pick ubuntu-24.04 in the dropdown; nothing else has
#  to change except dropping "Ubuntu 26" from supported_distros in
#  inventory/ci-build.yml, which is harmless to leave in place.
# ===========================================================================

name: build and deploy

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image to build on
        type: choice
        default: ubuntu-26.04
        options:
          - ubuntu-26.04
          - ubuntu-24.04
      only:
        description: Deploy on a single target rather than all of them
        type: choice
        default: all
        options:
          - all
          - debian13
          - ubuntu24
          - ubuntu26
          - ol9
          - ol10
          - rocky9
          - rocky10
          - centos9
          - centos10
      suite:
        description: Which deployments to run
        type: choice
        default: all
        options:
          - all
          - standalone
          - slurm

# A full run takes tens of minutes; a new push makes the one in flight
# pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANSIBLE_FORCE_COLOR: "1"

jobs:

  # A malformed playbook should be known in thirty seconds rather than after
  # the runner has spent ten minutes on npm install.
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v5

      - name: Install Ansible
        run: |
          set -euxo pipefail
          # The runner images already carry ansible-core in a pipx venv under
          # /opt/pipx, which belongs to root: pipx cannot rebuild it as the
          # runner user and fails outright. Ours goes in the home directory
          # instead, which also pins the version to a current ansible-core
          # rather than to whatever the image happens to ship.
          export PIPX_HOME="$HOME/.local/pipx"
          export PIPX_BIN_DIR="$HOME/.local/bin"
          pipx install --force ansible-core
          # GITHUB_PATH only takes effect in the *next* step, hence both lines.
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$PIPX_BIN_DIR:$PATH"
          ansible --version
          ansible-galaxy collection install -r requirements.yml

      - name: Check the playbooks parse
        run: |
          ansible-playbook --syntax-check -i inventory/ci-build.yml build.yml
          ansible-playbook --syntax-check -i inventory/ci-vm.yml site.yml
          ansible-playbook --syntax-check -i inventory/ci-cluster.yml site.yml
          ansible-playbook --syntax-check -i inventory/ci-cluster.yml verify.yml

  # ---------------------------------------------------------------------
  #  The list of machines to deploy on, as data rather than as a matrix
  #  literal, so that the `only` input can narrow it down to one. A job
  #  level `if:` cannot do that job: the matrix context is not available
  #  there, so every target would still appear, skipped.
  #
  #  `image` is the cloud image the VM boots from. Oracle and Rocky publish
  #  theirs with the build number in the name, which is what pins them; Debian
  #  and Ubuntu publish a `latest` that moves, which is what keeps them
  #  current. Both are deliberate: the EL side is where this playbook does the
  #  most distribution-specific work and a moving target there would be noise.
  #
  #  `slurm` picks the targets the five-machine job runs on, and how often:
  #  `always` on every pull request, `dispatch` only when the workflow is
  #  started by hand from the Actions tab, where the `only` and `suite` inputs
  #  can narrow a run down to one cluster. Moving a target between the two is
  #  one word here.
  #
  #  Every target that can carry a cluster is on `always`. `dispatch` is not a
  #  parking space for something that works and is merely expensive: on a
  #  public repository the runners are free, the jobs are parallel, and a
  #  cluster nobody thinks of starting by hand is a cluster that is not
  #  tested. It is a waiting room for a target being qualified, which is what
  #  each of these went through before landing here, one dispatched run each:
  #
  #    Ubuntu 24.04, the only podman 4 in the table - 4.9 against 5 and 6
  #    everywhere else. The standalone job already covers the web stack there,
  #    but slurmdbd and its MariaDB are deployed in the cluster shape alone,
  #    so this is the only place where those quadlet units meet podman 4.
  #
  #    Rocky Linux 9 and 10, the rebuilds that are not Oracle Linux. What they
  #    change is the *names* of the CRB and EPEL repositories, and one path:
  #    Rocky's epel-release provides the capability the OpenHPC release rpm
  #    asks for, so it installs through dnf rather than through the rpm
  #    --nodeps path Oracle Linux 10 needs.
  #
  #    CentOS Stream 10, which is not in the position of the 9 stream: it
  #    provides redhat-release 10.0 and OpenHPC 4 installs there. It is also
  #    the only podman 6 in the table, which is where verify.yml learned that
  #    a published container port is no longer a socket `ss` can see.
  #
  #  What that costs is not the same everywhere. Measured on the same run:
  #  eighteen minutes for Debian 13, thirty-six for Oracle Linux 9, where
  #  the first dnf transaction of each machine spends five minutes alone
  #  indexing the repository metadata, and where a package task that has
  #  nothing to do still answers in twenty seconds rather than in four. The
  #  jobs run in parallel, so what a pull request waits for is the slowest of
  #  them, not their sum. If that ever stops being acceptable, the answer is a
  #  nightly schedule for the targets that can afford to lag, not `dispatch`.
  #
  #  One target is in neither column and never will be: CentOS Stream 9
  #  provides redhat-release 9.0 and always will, being what the next RHEL
  #  minor is built from rather than a rebuild of one, while the OpenHPC
  #  release package requires 9.1 or later. It is stopped with an explanation
  #  by roles/slurm_common/tasks/repo.yml and keeps the standalone job, which
  #  is the only shape the playbook supports for it.
  #
  #  `web_mb`, `front_mb` and `node_mb` are the floor each machine of the
  #  cluster gets, for a target where the defaults in the boot step do not
  #  fit. The EL images need more per machine and give the web server less:
  #  measured on a five-machine cluster, an EL 9 compute node settles at
  #  271 MB of its own and a Debian one at less, while the EL web server never
  #  went past 1.4 GB. They are a minimum and not the allocation: what a
  #  machine actually gets is computed from the memory of the runner the job
  #  landed on, and only ever upwards from these.
  # ---------------------------------------------------------------------
  targets:
    name: targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      slurm_matrix: ${{ steps.pick.outputs.slurm_matrix }}
      suite: ${{ steps.pick.outputs.suite }}
    env:
      ONLY: ${{ inputs.only }}
      SUITE: ${{ inputs.suite }}
      EVENT: ${{ github.event_name }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          cat > /tmp/targets.json <<'JSON'
          [
            {
              "name":  "debian13",
              "label": "Debian 13",
              "image": "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2",
              "slurm": "always"
            },
            {
              "name":  "ubuntu24",
              "label": "Ubuntu 24.04",
              "image": "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img",
              "slurm": "always"
            },
            {
              "name":  "ubuntu26",
              "label": "Ubuntu 26.04",
              "image": "https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img",
              "slurm": "always"
            },
            {
              "name":  "ol9",
              "label": "Oracle Linux 9",
              "image": "https://yum.oracle.com/templates/OracleLinux/OL9/u8/x86_64/OL9U8_x86_64-kvm-b293.qcow2",
              "slurm": "always",
              "web_mb": 2560,
              "node_mb": 768
            },
            {
              "name":  "ol10",
              "label": "Oracle Linux 10",
              "image": "https://yum.oracle.com/templates/OracleLinux/OL10/u1/x86_64/OL10U1_x86_64-kvm-b291.qcow2",
              "slurm": "always",
              "web_mb": 2560,
              "node_mb": 768
            },
            {
              "name":  "rocky9",
              "label": "Rocky Linux 9",
              "image": "https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base-9.8-20260525.0.x86_64.qcow2",
              "slurm": "always",
              "web_mb": 2560,
              "node_mb": 768
            },
            {
              "name":  "rocky10",
              "label": "Rocky Linux 10",
              "image": "https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base-10.2-20260525.0.x86_64.qcow2",
              "slurm": "always",
              "web_mb": 2560,
              "node_mb": 768
            },
            {
              "name":  "centos9",
              "label": "CentOS Stream 9",
              "image": "https://cloud.centos.org/centos/9-stream/x86_64/images/CentOS-Stream-GenericCloud-9-latest.x86_64.qcow2"
            },
            {
              "name":  "centos10",
              "label": "CentOS Stream 10",
              "image": "https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-10-latest.x86_64.qcow2",
              "slurm": "always",
              "web_mb": 2560,
              "node_mb": 768
            }
          ]
          JSON
          only="${ONLY:-all}"
          if [ "$only" = all ]; then
            matrix=$(jq -c . /tmp/targets.json)
          else
            matrix=$(jq -c --arg n "$only" '[.[] | select(.name == $n)]' /tmp/targets.json)
            [ "$matrix" != '[]' ] || { echo "::error::no target named $only"; exit 1; }
          fi
          # On a pull request only the `always` targets; a manual run takes
          # every target of the suite, narrowed by `only` like the other one.
          slurm_matrix=$(jq -c --arg ev "$EVENT" \
            '[.[] | select(.slurm) | select($ev != "pull_request" or .slurm == "always")]' \
            <<<"$matrix")

          # A pull request runs both shapes. A manual run can narrow it down
          # to one through the `suite` input, which is worth doing while
          # working on either: a cluster job is one runner and eighteen
          # minutes at best, and there is one of each per target.
          suite="${SUITE:-all}"

          {
            echo "matrix=$matrix"
            echo "slurm_matrix=$slurm_matrix"
            echo "suite=$suite"
          } >> "$GITHUB_OUTPUT"
          echo "suite: $suite"
          echo "standalone targets:"; jq -r '.[].label' <<<"$matrix"
          echo "slurm targets:";      jq -r '.[].label' <<<"$slurm_matrix"

  # ---------------------------------------------------------------------
  #  One build for every target. The image and the web application are
  #  distribution-independent - they are container layers - and the solver
  #  tarballs are cached for both families at once, see
  #  antares_build_solver_os in inventory/ci-build.yml.
  # ---------------------------------------------------------------------
  build:
    name: build
    needs: syntax
    # inputs.runner is empty on push and pull_request, where the expression
    # falls back to the beta image.
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 120
    steps:

      - uses: actions/checkout@v5

      # Printed before anything else so that it is in the log even when the
      # job dies in its first minutes. See .github/actions/runner-specs.
      - name: Runner specifications
        uses: ./.github/actions/runner-specs

      # The image build, the podman store and the artefacts together need more
      # than / has free. /mnt is the runner's temp disk, which is where
      # antares_build_root points in the CI inventory.
      - name: Make room on the disks
        run: |
          set -euxo pipefail
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          docker image prune --all --force || true
          df -h / /mnt

      - name: Install Ansible
        run: |
          set -euxo pipefail
          # See the syntax job: /opt/pipx belongs to root and pipx cannot
          # rebuild the venv the image ships there.
          export PIPX_HOME="$HOME/.local/pipx"
          export PIPX_BIN_DIR="$HOME/.local/bin"
          pipx install --force ansible-core
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$PIPX_BIN_DIR:$PATH"
          ansible --version
          ansible-galaxy collection install -r requirements.yml

      # rsync is what ansible.posix.synchronize drives on the controller side,
      # here to pull the artefacts back out of the build directory; the common
      # role installs it on a target, but the builder is this same machine
      # before any role has run.
      - name: Let Ansible reach the runner over SSH
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server rsync
          sudo systemctl start ssh.socket || sudo systemctl start ssh
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519_ci
          cat ~/.ssh/id_ed25519_ci.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          # The name ansible connects to, and not 127.0.0.1 written out:
          # ansible.posix.synchronize takes that literal address as "same
          # machine, no SSH needed" and then rsyncs without the sudo that
          # reading under /mnt/antares-build needs. See inventory/ci-build.yml.
          echo '127.0.0.1 ci-target' | sudo tee -a /etc/hosts
          # Fails the step rather than the playbook if either half is missing.
          ssh -i ~/.ssh/id_ed25519_ci -o StrictHostKeyChecking=no \
              runner@ci-target 'id; sudo -n id'

      - name: Build the artefacts
        run: ansible-playbook -i inventory/ci-build.yml build.yml

      - name: Report what the build produced
        run: |
          ls -lh artifacts/
          cat artifacts/manifest.yml

      # Around 900 MB of already-compressed archives, so no point paying for
      # the zip: compression-level 0 stores them as they are.
      - name: Upload the artefacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: artifacts/
          compression-level: 0
          retention-days: 1

  # ---------------------------------------------------------------------
  #  One standalone deployment per distribution, each in its own virtual
  #  machine on its own runner. fail-fast is off: a distribution breaking is a result,
  #  not a reason to lose the others.
  # ---------------------------------------------------------------------
  standalone:
    name: standalone on ${{ matrix.target.label }}
    needs: [targets, build]
    if: ${{ needs.targets.outputs.suite != 'slurm' }}
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:

      - uses: actions/checkout@v5

      # Printed before anything else so that it is in the log even when the
      # job dies in its first minutes. See .github/actions/runner-specs.
      - name: Runner specifications
        uses: ./.github/actions/runner-specs

      # antares_artifacts_dir defaults to ./artifacts in the checkout, which
      # is where load_artifacts.yml reads them from before shipping them to
      # the machine.
      - name: Download the artefacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: artifacts/

      - name: Install Ansible
        run: |
          set -euxo pipefail
          export PIPX_HOME="$HOME/.local/pipx"
          export PIPX_BIN_DIR="$HOME/.local/bin"
          pipx install --force ansible-core
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$PIPX_BIN_DIR:$PATH"
          ansible --version
          ansible-galaxy collection install -r requirements.yml

      - name: Install QEMU and check the runner can nest a machine
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
               qemu-system-x86 qemu-utils cloud-image-utils rsync
          # The runner images do carry /dev/kvm, root:kvm 0660, and the runner
          # user is not in the kvm group. Neither of the two usual ways round
          # that is right here: usermod only applies to a new login session,
          # and every `run:` block is a child of the one that exists already,
          # while the udev rule everyone copies has to be applied by an
          # asynchronous `udevadm trigger` and is therefore a race. That race
          # was lost by all four jobs of the first run of this workflow and
          # won by the same rule in a probe minutes later, which is the worst
          # kind of flake. chmod happens when it is called.
          if [ ! -e /dev/kvm ]; then
            echo "::error::no /dev/kvm on this runner, the whole workflow depends on nested virtualisation"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -w /dev/kvm

      # -------------------------------------------------------------
      #  Boot the machine.
      #
      #  The disk is a copy-on-write overlay on the downloaded image, sized
      #  well past it: cloud-init grows the root filesystem to whatever it
      #  finds, and the deployment needs room for the images and the study
      #  workspace. cache=unsafe because the machine is destroyed with the
      #  job, and it is worth a good deal of I/O.
      #
      #  Networking is QEMU's user-mode stack with two forwarded ports: 22
      #  for Ansible and 80 for the HTTP checks. Nothing is bridged, so the
      #  machine is reachable from this runner and from nowhere else.
      # -------------------------------------------------------------
      - name: Boot the ${{ matrix.target.label }} machine
        env:
          IMAGE: ${{ matrix.target.image }}
        run: |
          set -euxo pipefail

          sudo mkdir -p /mnt/vm
          sudo chown "$(id -u):$(id -g)" /mnt/vm

          curl -fSL --retry 3 --retry-delay 5 -o /mnt/vm/base.img "$IMAGE"
          # Ubuntu ships qcow2 under a .img name, so ask rather than assume.
          fmt=$(qemu-img info --output=json /mnt/vm/base.img | jq -r .format)
          qemu-img create -f qcow2 -F "$fmt" -b /mnt/vm/base.img \
                          /mnt/vm/disk.qcow2 40G

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519_ci

          # A NoCloud seed: the only account the machine gets is the one
          # Ansible connects with. No package_update, the deployment
          # installs what it needs and a distribution upgrade on first boot
          # would only add minutes and a lock to fight.
          cat > /mnt/vm/user-data <<EOF
          #cloud-config
          ssh_pwauth: false
          package_update: false
          package_upgrade: false
          users:
            - name: ansible
              shell: /bin/bash
              sudo: "ALL=(ALL) NOPASSWD:ALL"
              ssh_authorized_keys:
                - $(cat ~/.ssh/id_ed25519_ci.pub)
          EOF
          cat > /mnt/vm/meta-data <<'EOF'
          instance-id: ci-vm
          local-hostname: ci-vm
          EOF
          cloud-localds /mnt/vm/seed.img /mnt/vm/user-data /mnt/vm/meta-data

          qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -smp 4 -m 8192 \
            -drive file=/mnt/vm/disk.qcow2,if=virtio,format=qcow2,cache=unsafe,discard=unmap \
            -drive file=/mnt/vm/seed.img,if=virtio,format=raw,readonly=on \
            -netdev user,id=net0,hostfwd=tcp::2222-:22,hostfwd=tcp::8080-:80 \
            -device virtio-net-pci,netdev=net0 \
            -device virtio-rng-pci \
            -display none -daemonize \
            -pidfile /mnt/vm/qemu.pid \
            -serial file:/mnt/vm/console.log

          # `ci-vm` rather than 127.0.0.1 for the same reason the builder has
          # `ci-target`: under the literal address ansible.posix.synchronize
          # concludes both ends are the same machine and drops the elevation
          # the far side needs. See inventory/ci-vm.yml.
          echo '127.0.0.1 ci-vm' | sudo tee -a /etc/hosts

          # Every later step shells into the machine, so the connection is
          # written down once. ~/.local/bin is already on the path, the
          # Ansible step above put it there.
          mkdir -p ~/.local/bin
          cat > ~/.local/bin/vm <<EOF
          #!/bin/sh
          exec ssh -i $HOME/.ssh/id_ed25519_ci -p 2222 \
                   -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o LogLevel=ERROR -o ConnectTimeout=10 ansible@ci-vm "\$@"
          EOF
          chmod +x ~/.local/bin/vm

          set +x
          for _ in $(seq 1 120); do
            if ~/.local/bin/vm 'sudo -n id' >/dev/null 2>&1; then
              booted=1
              break
            fi
            sleep 5
          done
          set -x
          if [ "${booted:-0}" != 1 ]; then
            echo "::error::${{ matrix.target.label }} never answered on SSH, console follows"
            tail -n 200 /mnt/vm/console.log
            exit 1
          fi

          ~/.local/bin/vm 'cat /etc/os-release; uname -r; getenforce || true; df -h /; free -m'

      - name: Deploy from the artefacts
        run: |
          ansible-playbook -i inventory/ci-vm.yml site.yml \
            -e antarest_image_source=archive

      # site.yml already waits for /api/health before it finishes. What is
      # checked here is what a deployment is actually for: every unit up, the
      # web application served, and nginx reaching the backend. The HTTP half
      # is driven from the runner through the forwarded port, so it also says
      # the machine serves something to the outside rather than to itself.
      - name: Check the stack answers
        run: |
          set -euo pipefail

          vm 'systemctl is-active --quiet antares-web.target'

          for unit in postgresql redis antarest antarest-celery-beat \
                      antarest-celery-worker antares-nginx; do
            if ! vm "systemctl is-active --quiet $unit.service"; then
              echo "::error::$unit.service is not running on ${{ matrix.target.label }}"
              vm "systemctl status --no-pager --full $unit.service" || true
              exit 1
            fi
          done

          vm 'sudo podman ps --format "table {{.Names}}\t{{.Status}}"'

          curl -fsS -o /dev/null -w 'GET /api/health -> %{http_code}\n' \
               http://127.0.0.1:8080/api/health

          curl -fsS http://127.0.0.1:8080/ -o /tmp/index.html
          grep -qi '<title' /tmp/index.html

          # Deliberately a wrong password: what is being tested is that the
          # /api/ proxy reaches the backend and that the backend routes the
          # request, not the credentials. A 502 or a 404 here is the failure
          # that matters, and it is the one the container name `antarest`
          # produces when it is wrong.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                   -X POST http://127.0.0.1:8080/api/v1/login \
                   -H 'Content-Type: application/json' \
                   -d '{"username":"admin","password":"wrong-on-purpose"}')
          echo "POST /api/v1/login -> $code"
          case "$code" in
            200 | 401 | 422) ;;
            *)
              echo "::error::the login endpoint answered $code, nginx is not reaching the backend"
              exit 1
              ;;
          esac

      # Last on purpose: a failure here says the deployment converged but does
      # not settle, which is worth knowing and worth fixing, but only after the
      # steps above have said whether it works at all.
      - name: Check the deploy is idempotent
        run: |
          set -euo pipefail
          ansible-playbook -i inventory/ci-vm.yml site.yml \
            -e antarest_image_source=archive --diff | tee /tmp/second-run.log
          # ANSIBLE_FORCE_COLOR paints the recap, so the host name in the log
          # starts with an escape sequence rather than with `ci-vm`. Strip
          # them for the grep and keep the coloured copy for whoever reads it.
          sed -r 's/\x1b\[[0-9;]*m//g' /tmp/second-run.log > /tmp/second-run.txt
          if ! grep -qE '^ci-vm[[:space:]]+:.*[[:space:]]changed=0[[:space:]]' \
                 /tmp/second-run.txt; then
            echo "::error::the second run of site.yml reported changes on ${{ matrix.target.label }}, see the recap above"
            exit 1
          fi

      # Nobody can SSH into a runner after the fact, let alone into a machine
      # that dies with it, so everything needed to understand a failure has to
      # be in the log. The console comes first: it is the only thing there is
      # when the failure is the boot itself.
      - name: Collect diagnostics
        if: failure()
        run: |
          set +e
          df -h / /mnt
          # Both guards are for a failure that happened before the machine
          # existed, which is the one case where these would be noise rather
          # than diagnostics.
          if [ -f /mnt/vm/console.log ]; then
            echo "===== serial console"
            tail -n 200 /mnt/vm/console.log
          fi
          command -v vm > /dev/null || exit 0
          vm 'systemctl --failed --no-pager'
          vm 'sudo podman ps -a'
          vm 'sudo podman images'
          for unit in postgresql redis antarest antarest-celery-beat \
                      antarest-celery-worker antares-nginx; do
            echo "===== $unit.service"
            vm "sudo journalctl -u $unit.service --no-pager -n 100"
          done
          exit 0

  # ---------------------------------------------------------------------
  #  The other shape: five machines instead of one.
  #
  #      antares-web   192.168.77.11   the web application
  #      slurm-front   192.168.77.12   slurmctld, slurmdbd, NFS server
  #      slurm-node-1  192.168.77.13   slurmd
  #      slurm-node-2  192.168.77.14   slurmd
  #      slurm-node-3  192.168.77.15   slurmd
  #
  #  They sit on a bridge built on the runner, which gives them what the
  #  single-machine job deliberately does not have: each other. NFS, munge,
  #  the Slurm daemons and the SSH submission path all cross a real network
  #  here, and so does every firewall rule, since the runner itself is on
  #  that network at 192.168.77.1 without being in the inventory - it is
  #  the internet as far as the rulesets are concerned.
  #
  #  Sizing. Five machines have to fit in what one of them gets in the deploy
  #  job, on a runner whose size is not a constant: a public repository is
  #  given 4 cores and 15.6 GB today, a private one 2 cores and 7.9 GB, which
  #  is what the numbers below were measured on. So the allocation is computed
  #  at boot time from what the runner actually has - see the sizing block in
  #  the "Build the cluster network" step - and the table values are its
  #  floor. Nothing here is assumed: the first step of the job prints the
  #  runner, that step prints what it decided to hand out, and the first
  #  attempt at this job asked for 11.5 GB of guests on the small runner, left
  #  it with 333 MB available and 600 MB swapped out, and starved MariaDB out
  #  of finishing its initialisation.
  #
  #  The floors, on the Debian family: 3 GB for the web machine, which runs
  #  the whole podman stack, 1.25 GB for the front-end, which runs MariaDB
  #  next to the daemons, and 576 MB per compute node, which runs slurmd and
  #  nothing else. 6 GB of guests, plus half a gigabyte of swap inside each
  #  machine and a swap file out here for the spikes. The EL images ask for
  #  more per machine and are given less on the web server, see the target
  #  table. Drop a compute node from that table if this ever stops fitting:
  #  three is what makes a multi-node step meaningful, not a number the
  #  playbook depends on.
  #
  #  Every guest ends up resident for its whole allocation, because a guest
  #  fills what it is given with page cache, so the sum of the column is what
  #  the runner pays - which is why the allocation is capped rather than
  #  simply given the whole budget. Measured inside the machines of an EL 9
  #  cluster: 1.4 GB really used on the web server, 499 MB on the front-end,
  #  271 MB on a compute node.
  # ---------------------------------------------------------------------
  slurm:
    name: slurm on ${{ matrix.target.label }}
    needs: [targets, build]
    if: ${{ needs.targets.outputs.suite != 'standalone' && needs.targets.outputs.slurm_matrix != '[]' }}
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.slurm_matrix) }}
    env:
      # The cluster network. /24 on a bridge that exists only inside the
      # runner, with the runner itself on .1 as the gateway.
      NET: 192.168.77
      BRIDGE: br-antares
    steps:

      - uses: actions/checkout@v5

      # Printed before anything else so that it is in the log even when the
      # job dies in its first minutes, and first of all here: five machines in
      # 7.9 GB is the whole difficulty of this job, so the numbers it is sized
      # against belong in the log of every run rather than in a comment that
      # can go stale. See .github/actions/runner-specs.
      - name: Runner specifications
        uses: ./.github/actions/runner-specs

      - name: Download the artefacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: artifacts/

      - name: Install Ansible
        run: |
          set -euxo pipefail
          export PIPX_HOME="$HOME/.local/pipx"
          export PIPX_BIN_DIR="$HOME/.local/bin"
          pipx install --force ansible-core
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$PIPX_BIN_DIR:$PATH"
          ansible --version
          ansible-galaxy collection install -r requirements.yml

      # Five overlays, a gigabyte of artefacts and a swap file do not fit in
      # the 20 GB a runner has free. The toolchains removed here are the same
      # ones the build job removes, for the same reason.
      - name: Make room on the disk
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          docker image prune --all --force || true
          df -h /

      - name: Install QEMU and check the runner can nest a machine
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
               qemu-system-x86 qemu-utils cloud-image-utils dnsmasq-base \
               iproute2 rsync
          # What this runner has to offer was printed by the first step of the
          # job. Worth remembering when reading it: /mnt is a directory on /
          # here, not the separate temp disk it is on other runner sizes, so
          # everything this job creates fits in the same 72 GB.
          #
          # See the deploy job: usermod would need a new login session and the
          # udev rule everyone copies is a race. chmod happens when it is
          # called.
          if [ ! -e /dev/kvm ]; then
            echo "::error::no /dev/kvm on this runner, the whole workflow depends on nested virtualisation"
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -w /dev/kvm

      # -------------------------------------------------------------
      #  The network the five machines live on.
      #
      #  A bridge with the runner on .1, one tap per machine, masquerading
      #  so that apt and dnf reach their mirrors, and dnsmasq for the
      #  leases and for DNS. Deliberately not QEMU's user-mode stack, which
      #  the single-machine job uses: it gives every machine the same
      #  10.0.2.15 and no way to reach a neighbour, and this job is about
      #  the neighbours.
      #
      #  The addresses are handed out by MAC rather than written into the
      #  images: every cloud image DHCPs on its first interface out of the
      #  box, whereas a static NoCloud network-config has to go through
      #  whichever renderer that particular distribution ships.
      # -------------------------------------------------------------
      - name: Build the cluster network
        env:
          # The floor each machine gets, never the allocation: see the sizing
          # block below. The defaults are the Debian family's, measured; a
          # target that needs other numbers carries them in the table of the
          # targets job.
          WEB_MB: ${{ matrix.target.web_mb || 3072 }}
          FRONT_MB: ${{ matrix.target.front_mb || 1280 }}
          NODE_MB: ${{ matrix.target.node_mb || 576 }}
          # Where more memory stops buying anything, about four times what
          # each machine was measured to really use.
          WEB_CAP: 5120
          FRONT_CAP: 2048
          NODE_CAP: 1024
        run: |
          set -euxo pipefail

          sudo mkdir -p /mnt/vm
          sudo chown "$(id -u):$(id -g)" /mnt/vm

          # -------------------------------------------------------------
          #  How much memory the five machines get on this particular runner.
          #
          #  The numbers in the target table are what each distribution was
          #  measured to need, on the 2-core 7.9 GB runner they were measured
          #  on. Here they are the floor, not the allocation: a public
          #  repository is now given 4 cores and 15.6 GB, and there is no
          #  reason to keep squeezing five machines into what a smaller
          #  machine had. Should this repository go private and land on the
          #  small runner again, the budget comes out below the floors, the
          #  scale is clamped to 1 and every machine gets exactly the table
          #  value it gets today - which is the point of a floor rather than
          #  a share.
          #
          #  The caps are where more memory stops buying anything. Measured
          #  inside an EL 9 cluster, the web machine really uses 1.4 GB, the
          #  front-end 499 MB and a compute node 271 MB, so roughly four
          #  times the measurement is as far as this is worth taking. What is
          #  not handed to a guest stays with the runner, which needs it for
          #  ansible, five qemu processes and a gigabyte of artefacts.
          #
          #  Worth knowing when reading the numbers: a guest ends up resident
          #  for its whole allocation, since it fills what it is given with
          #  page cache, so the sum of the column is what the runner pays.
          # -------------------------------------------------------------
          set +x
          total_mb=$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)
          # A fifth for the runner itself, and never less than the 1.75 GB
          # the small runner was left with once its five machines were out.
          reserve_mb=$(( total_mb / 5 ))
          [ "$reserve_mb" -ge 1792 ] || reserve_mb=1792
          budget_mb=$(( total_mb - reserve_mb ))

          floor_mb=$(( WEB_MB + FRONT_MB + 3 * NODE_MB ))
          # Per mille rather than a fraction: this is shell arithmetic.
          scale=$(( budget_mb * 1000 / floor_mb ))
          if [ "$scale" -lt 1000 ]; then
            echo "::warning::this runner has ${total_mb} MB, which is less than the ${floor_mb} MB the five machines were measured to need plus the ${reserve_mb} MB the runner keeps. Allocating the measured minimums and counting on swap, exactly as before."
            scale=1000
          fi

          # floor, cap -> allocation, rounded down to a multiple of 128 MB
          # and never below the floor it started from.
          size() {
            mb=$(( $1 * scale / 1000 ))
            [ "$mb" -le "$2" ] || mb=$2
            mb=$(( mb / 128 * 128 ))
            [ "$mb" -ge "$1" ] || mb=$1
            echo "$mb"
          }
          web_mb=$(size "$WEB_MB" "$WEB_CAP")
          front_mb=$(size "$FRONT_MB" "$FRONT_CAP")
          node_mb=$(size "$NODE_MB" "$NODE_CAP")
          guests_mb=$(( web_mb + front_mb + 3 * node_mb ))

          echo "runner    : ${total_mb} MB, ${reserve_mb} MB kept back, ${budget_mb} MB to hand out"
          echo "floors    : web ${WEB_MB}, front ${FRONT_MB}, node ${NODE_MB} - ${floor_mb} MB together"
          echo "caps      : web ${WEB_CAP}, front ${FRONT_CAP}, node ${NODE_CAP}"
          echo "scale     : ${scale}/1000"
          echo "allocated : web ${web_mb}, front ${front_mb}, node ${node_mb} - ${guests_mb} MB together"
          set -x

          # name          last octet  MB           vcpus  disk (a minimum)
          cat > /mnt/vm/machines <<EOF
          antares-web   11          $web_mb      2      40G
          slurm-front   12          $front_mb    2      20G
          slurm-node-1  13          $node_mb     1      10G
          slurm-node-2  14          $node_mb     1      10G
          slurm-node-3  15          $node_mb     1      10G
          EOF
          cat /mnt/vm/machines

          # The last resort under a spike, on the host side. What actually
          # keeps a machine this small out of trouble is the half gigabyte
          # of swap cloud-init makes inside each of them.
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          sudo ip link add "$BRIDGE" type bridge
          sudo ip addr add "$NET.1/24" dev "$BRIDGE"
          sudo ip link set "$BRIDGE" up

          # Docker is installed on the runner and sets the FORWARD policy to
          # DROP. These two rules go in front of everything it wrote, and
          # they also cover the bridged traffic between two machines, which
          # traverses FORWARD as well once br_netfilter is loaded - which
          # docker does.
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -I FORWARD -i "$BRIDGE" -j ACCEPT
          sudo iptables -I FORWARD -o "$BRIDGE" -j ACCEPT
          sudo iptables -t nat -A POSTROUTING -s "$NET.0/24" ! -o "$BRIDGE" -j MASQUERADE

          # One fixed lease per machine, and the same names in the runner's
          # own /etc/hosts so that the log, the inventory and the ssh helper
          # all speak of `slurm-node-2` rather than of an address.
          leases=""
          while read -r name octet _ _ _; do
            [ -n "$name" ] || continue
            leases="$leases --dhcp-host=52:54:00:77:00:$(printf '%02x' "$octet"),$NET.$octet,$name"
            echo "$NET.$octet $name" | sudo tee -a /etc/hosts
          done < /mnt/vm/machines

          # No --no-resolv: the upstream is whatever resolves for the runner,
          # which is the one resolver known to work here. The two public ones
          # are a fallback, not a preference.
          # shellcheck disable=SC2086
          sudo dnsmasq \
            --interface="$BRIDGE" --bind-interfaces --except-interface=lo \
            --dhcp-range="$NET.200,$NET.220,1h" --dhcp-authoritative \
            --dhcp-option=option:router,"$NET.1" \
            --dhcp-option=option:dns-server,"$NET.1" \
            --server=1.1.1.1 --server=8.8.8.8 \
            --log-facility=/mnt/vm/dnsmasq.log --log-dhcp \
            --pid-file=/mnt/vm/dnsmasq.pid \
            $leases

          ip addr show "$BRIDGE"
          sudo iptables -S FORWARD | head -n 5

      # -------------------------------------------------------------
      #  Boot the five machines.
      #
      #  One download of the cloud image, five copy-on-write overlays on
      #  top of it. cache=unsafe because everything here dies with the job.
      # -------------------------------------------------------------
      - name: Boot the ${{ matrix.target.label }} cluster
        env:
          IMAGE: ${{ matrix.target.image }}
        run: |
          set -euxo pipefail

          curl -fSL --retry 3 --retry-delay 5 -o /mnt/vm/base.img "$IMAGE"
          # Ubuntu ships qcow2 under a .img name, so ask rather than assume.
          fmt=$(qemu-img info --output=json /mnt/vm/base.img | jq -r .format)

          # An overlay smaller than the image under it silently truncates that
          # image, and the guest then hangs in dracut waiting for a root LV
          # that lies past the end of its own disk. An Oracle Linux template
          # is 37 GiB of virtual size where a Debian genericcloud is 3 GiB, so
          # the size in the table is a minimum and this is the floor. Nothing
          # is paid for the difference: an overlay only holds what is written
          # to it.
          base_gib=$(( ( $(qemu-img info --output=json /mnt/vm/base.img \
                           | jq -r '."virtual-size"') + 1073741823 ) / 1073741824 ))

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519_ci
          pubkey=$(cat ~/.ssh/id_ed25519_ci.pub)

          # Every later step shells into the machines, so the connection is
          # written down once: `vm slurm-node-2 sinfo`.
          mkdir -p ~/.local/bin
          cat > ~/.local/bin/vm <<EOF
          #!/bin/sh
          host=\$1
          shift
          exec ssh -i $HOME/.ssh/id_ed25519_ci \
                   -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o LogLevel=ERROR -o ConnectTimeout=10 "ansible@\$host" "\$@"
          EOF
          chmod +x ~/.local/bin/vm

          idx=0
          while read -r name octet mem cpus disk; do
            [ -n "$name" ] || continue

            want=${disk%G}
            [ "$want" -ge "$base_gib" ] || want=$base_gib
            qemu-img create -f qcow2 -F "$fmt" -b /mnt/vm/base.img \
                            "/mnt/vm/$name.qcow2" "${want}G"

            # The tap is created here rather than by QEMU so that QEMU does
            # not have to run as root to open /dev/net/tun. Names are tapN:
            # an interface name is 15 characters at most, which `tap-` plus
            # a machine name is not.
            sudo ip tuntap add dev "tap$idx" mode tap user "$(id -un)"
            sudo ip link set "tap$idx" master "$BRIDGE" up

            # The only account these machines get is the one Ansible
            # connects with. No package_update: the deployment installs what
            # it needs, and a distribution upgrade on first boot would only
            # add minutes and a dpkg lock to fight.
            cat > "/mnt/vm/$name-user-data" <<EOF
          #cloud-config
          ssh_pwauth: false
          package_update: false
          package_upgrade: false
          users:
            - name: ansible
              shell: /bin/bash
              sudo: "ALL=(ALL) NOPASSWD:ALL"
              ssh_authorized_keys:
                - $pubkey
          swap:
            filename: /swap.img
            size: 512M
          EOF
            # local-hostname is not cosmetic: slurmd matches the machine's
            # own `hostname -s` against the NodeName lines of slurm.conf,
            # which are generated from the inventory names.
            cat > "/mnt/vm/$name-meta-data" <<EOF
          instance-id: $name
          local-hostname: $name
          EOF
            cloud-localds "/mnt/vm/$name-seed.img" \
                          "/mnt/vm/$name-user-data" "/mnt/vm/$name-meta-data"

            qemu-system-x86_64 \
              -machine q35,accel=kvm -cpu host -smp "$cpus" -m "$mem" \
              -drive "file=/mnt/vm/$name.qcow2,if=virtio,format=qcow2,cache=unsafe,discard=unmap" \
              -drive "file=/mnt/vm/$name-seed.img,if=virtio,format=raw,readonly=on" \
              -netdev "tap,id=net0,ifname=tap$idx,script=no,downscript=no" \
              -device "virtio-net-pci,netdev=net0,mac=52:54:00:77:00:$(printf '%02x' "$octet")" \
              -device virtio-rng-pci \
              -display none -daemonize \
              -pidfile "/mnt/vm/$name.pid" \
              -serial "file:/mnt/vm/$name-console.log"

            idx=$((idx + 1))
          done < /mnt/vm/machines

          # Ten minutes for all five, which is generous: they boot in
          # parallel and the first one usually answers in about forty
          # seconds.
          set +x
          for name in $(awk '{print $1}' /mnt/vm/machines); do
            booted=0
            for _ in $(seq 1 120); do
              if ~/.local/bin/vm "$name" 'sudo -n id' >/dev/null 2>&1; then
                booted=1
                break
              fi
              sleep 5
            done
            if [ "$booted" != 1 ]; then
              echo "::error::$name never answered on SSH, console follows"
              tail -n 200 "/mnt/vm/$name-console.log"
              exit 1
            fi
            echo "$name is up"
          done
          set -x

          # DNS through dnsmasq and a route out of the bridge are what every
          # package install of the deployment depends on. Failing here says
          # so plainly, rather than through apt three minutes later.
          for name in $(awk '{print $1}' /mnt/vm/machines); do
            if ! ~/.local/bin/vm "$name" 'getent hosts deb.debian.org > /dev/null'; then
              echo "::error::$name cannot resolve a mirror, see the dnsmasq log"
              tail -n 50 /mnt/vm/dnsmasq.log
              exit 1
            fi
          done

          ~/.local/bin/vm antares-web 'cat /etc/os-release; uname -r; ip -brief addr; free -m'
          # What the five of them leave the runner once they are all up. The
          # deployment is what fills them, so this is the floor, not the
          # worst case, and it is the number to look at when something below
          # dies for no visible reason.
          free -m; df -h /

      - name: Deploy the cluster from the artefacts
        run: |
          ansible-playbook -i inventory/ci-cluster.yml site.yml \
            -e antarest_image_source=archive

      # What site.yml cannot check on its own: the cluster as a whole, and
      # what each of the three rulesets looks like from the outside. The
      # runner is that outside - it is on the network and not in the
      # inventory. See the header of verify.yml.
      - name: Verify the cluster and the firewall
        run: ansible-playbook -i inventory/ci-cluster.yml verify.yml

      # Last on purpose: a failure here says the deployment converged but
      # does not settle, which is worth knowing and worth fixing, but only
      # after the steps above have said whether it works at all.
      - name: Check the deploy is idempotent
        run: |
          set -euo pipefail
          ansible-playbook -i inventory/ci-cluster.yml site.yml \
            -e antarest_image_source=archive --diff | tee /tmp/second-run.log
          # ANSIBLE_FORCE_COLOR paints the recap, so a host name in the log
          # starts with an escape sequence rather than with the name itself.
          sed -r 's/\x1b\[[0-9;]*m//g' /tmp/second-run.log > /tmp/second-run.txt
          rc=0
          for name in $(awk '{print $1}' /mnt/vm/machines); do
            if ! grep -qE "^$name[[:space:]]+:.*[[:space:]]changed=0[[:space:]]" \
                   /tmp/second-run.txt; then
              echo "::error::the second run of site.yml reported changes on $name (${{ matrix.target.label }}), see the recap above"
              rc=1
            fi
          done
          exit $rc

      # Nobody can SSH into a runner after the fact, let alone into five
      # machines that die with it, so everything needed to understand a
      # failure has to be in the log. The consoles come first: they are the
      # only thing there is when the failure is the boot itself.
      - name: Collect diagnostics
        if: failure()
        run: |
          set +e
          df -h / /mnt
          free -m
          for name in $(awk '{print $1}' /mnt/vm/machines 2>/dev/null); do
            echo "===== $name serial console"
            tail -n 100 "/mnt/vm/$name-console.log"
          done
          command -v vm > /dev/null || exit 0
          # free and the OOM killer first: on a runner this size, a machine
          # that ran out of memory is the likeliest explanation for anything
          # else printed below.
          for name in $(awk '{print $1}' /mnt/vm/machines 2>/dev/null); do
            echo "===== $name"
            vm "$name" 'hostname; free -m; sudo dmesg | grep -i "out of memory" | tail -n 5;
                        systemctl --failed --no-pager; ss -lntp;
                        sudo nft list table inet antares_fw'
          done
          echo "===== the cluster as slurmctld sees it"
          vm slurm-front 'sinfo -N -l; scontrol ping; sudo tail -n 50 /var/log/slurm/slurmctld.log'
          vm slurm-front 'sudo podman ps -a; sudo systemctl status --no-pager --full slurmctld slurmdbd'
          echo "===== the accounting database"
          vm slurm-front 'sudo podman logs --tail 80 slurmdb-mariadb'
          vm slurm-node-1 'sudo systemctl status --no-pager --full slurmd; mount | grep home'
          echo "===== the web machine"
          vm antares-web 'sudo podman ps -a'
          for unit in postgresql redis antarest antarest-celery-beat \
                      antarest-celery-worker antares-nginx; do
            echo "===== $unit.service"
            vm antares-web "sudo journalctl -u $unit.service --no-pager -n 100"
          done
          exit 0
