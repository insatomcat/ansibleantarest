---
# The fastest way into an internet-facing Antares-Web is not a brute force, it
# is the admin/admin the repository ships with. A firewall does not help there,
# so the deployment says it out loud.
#
# A warning rather than a failure by default, because these values are exactly
# what a throwaway test machine wants; set hardening_fail_on_default_secrets to
# make an untouched secret stop the deployment.

- name: Look for secrets still holding their shipped value
  ansible.builtin.set_fact:
    hardening_untouched_secrets: >-
      {{ ((hardening_untouched_secrets | default([]))
          + ([item.key] if lookup('vars', item.key, default='') == item.value else []))
         | unique }}
  loop: "{{ hardening_default_secrets | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Report the secrets still holding their shipped value
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} is deployed with the default
      {{ hardening_untouched_secrets | join(', ') }}. Anyone who has read this
      repository can log in. Set them in your inventory, ideally in an
      ansible-vault encrypted file, see "Before production" in the README.
  when: hardening_untouched_secrets | length > 0

- name: Stop on a deployment running on the shipped secrets
  ansible.builtin.fail:
    msg: >-
      {{ hardening_untouched_secrets | join(', ') }} still hold the value this
      repository ships, and hardening_fail_on_default_secrets is on.
  when:
    - hardening_fail_on_default_secrets | bool
    - hardening_untouched_secrets | length > 0
