---
# Security updates that install themselves. The two families have different
# machinery for it - unattended-upgrades and dnf-automatic - but the same
# policy: the security pocket only, and no automatic reboot.

- name: Install the unattended update mechanism
  ansible.builtin.package:
    name: "{{ hardening_unattended_packages }}"
    state: present

- name: Configure unattended-upgrades
  ansible.builtin.include_tasks: updates_debian.yml
  when: ansible_os_family == 'Debian'

- name: Configure dnf-automatic
  ansible.builtin.include_tasks: updates_redhat.yml
  when: ansible_os_family == 'RedHat'
