---
# A fresh VM with 22 and 80 open on the internet is the case this role is
# written for: a firewall so that only what is meant to be public is, fail2ban
# so that the two doors left open are not brute-forced at leisure, an sshd that
# does not take passwords, security updates that install themselves, and a
# journal that survives the reboot they eventually call for.
#
# Every block can be switched off on its own, see group_vars/all.yml.

- name: Collect what the firewall and the jails have to let through
  ansible.builtin.include_tasks: facts.yml

# First, because it restarts journald: after this block the jails read the
# journal and the deployment writes to it, and neither wants it restarted
# underneath. It is also what makes the rest of this run readable tomorrow.
- name: Keep the journal across reboots
  ansible.builtin.include_tasks: journal.yml
  when: hardening_journal_persistent | bool

- name: Configure the firewall
  ansible.builtin.include_tasks: firewall.yml

# After our own ruleset rather than before, on purpose: when this is the task
# that takes firewalld down, the nftables table is already loaded, so the
# machine goes from one filtering policy to the other instead of spending the
# length of the previous task with none. Also runs when the nftables table
# is off: the default is "no host firewall", and on a rebuild that means
# firewalld has to go too.
- name: Settle what to do with firewalld
  ansible.builtin.include_tasks: firewalld.yml
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - hardening_manage_firewalld | bool

- name: Configure fail2ban
  ansible.builtin.include_tasks: fail2ban.yml

- name: Harden the SSH server
  ansible.builtin.include_tasks: ssh.yml
  when: hardening_ssh_enabled | bool

- name: Enable unattended security upgrades
  ansible.builtin.include_tasks: updates.yml
  when: hardening_unattended_upgrades | bool

- name: Check the deployment does not run on the shipped secrets
  ansible.builtin.include_tasks: secrets.yml
  when: hardening_check_secrets | bool
