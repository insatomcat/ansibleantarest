---
# The distribution ships /etc/apt/apt.conf.d/50unattended-upgrades with an
# origins list that only covers the security pocket, and it is left untouched:
# this turns the mechanism on and decides about the reboot, nothing else.

- name: Enable the periodic security upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Decide about the automatic reboot
  ansible.builtin.template:
    src: 52-antares-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52-antares-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

# apt.conf syntax errors take *every* apt command down with them, including the
# next `apt install` of this very playbook, so the parser gets asked first.
- name: Check apt still parses its configuration
  ansible.builtin.command: apt-config dump
  changed_when: false
