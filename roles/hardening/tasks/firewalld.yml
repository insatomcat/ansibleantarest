---
# RedHat family only. See hardening_manage_firewalld in defaults/main.yml.
#
# Debian and Ubuntu ship no host filter. Oracle Linux and the other rebuilds
# boot with firewalld enabled, SSH only. `hardening_firewall_enabled: false`
# therefore cannot mean "leave the machine as it is": on a rebuild that is
# already a filter, the one the cloud security group was supposed to be
# enough without. Masking firewalld makes the default mean the same thing
# on both families: no host firewall, the security group (or the nftables
# table, when the knob is on) is the whole policy.
#
# Masked, not merely disabled: firewalld is a dependency of a handful of
# packages that would happily start it again. `systemctl unmask firewalld`
# puts it back. Set hardening_manage_firewalld: false to not touch it at all.

- name: Look for firewalld
  ansible.builtin.stat:
    path: /usr/sbin/firewalld
  register: hardening_firewalld_binary

- name: Take firewalld out of the way
  ansible.builtin.systemd:
    name: firewalld.service
    state: stopped
    enabled: false
    masked: true
  when: hardening_firewalld_binary.stat.exists
