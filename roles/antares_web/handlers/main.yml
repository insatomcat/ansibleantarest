---
# Restarting the target propagates down to the containers because each one
# declares PartOf= on it. A plain Wants= would start them but never carry a
# restart, which is the whole reason the target exists.
- name: Restart Antares-Web
  ansible.builtin.systemd:
    name: "{{ antarest_service_name }}.target"
    state: restarted
    daemon_reload: true
