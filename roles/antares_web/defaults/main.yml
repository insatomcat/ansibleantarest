---
# Generated configuration (never touched by git), kept out of the checkout so
# that the checkout stays disposable.
antarest_deploy_dir: "{{ antarest_base_dir }}/deploy"

# Persistent state: studies, matrices, postgres data, logs. Also kept out of
# the checkout, so that upgrading Antares-Web never puts the data at risk.
antarest_data_dir: "{{ antarest_base_dir }}/data"

# A block device to hold that state instead of the boot disk. Empty keeps
# everything on the boot disk, which is what every deployment did before this
# existed. A device name is a property of one machine, so this belongs on the
# host in the inventory rather than on a group:
#
#   antares_web_1:
#     antarest_data_device: /dev/oracleoci/oraclevdb
#
# The volume is mounted on antarest_data_dir itself, rather than elsewhere with
# antarest_data_dir pointed at it. A workspace path is what its studies are
# recorded with in the database, so it has to read the same whether the state
# sits on a volume or on the boot disk, and adding or removing the volume then
# stays a decision about hardware alone.
antarest_data_device: ""

# The device is formatted whole, with no partition table: nothing else will
# ever share it, and growing it afterwards is then the filesystem alone
# (`xfs_growfs {{ antarest_data_dir }}`), with no partition to extend first.
antarest_data_fstype: xfs

# nofail so that a volume which failed to attach still leaves a machine that
# boots and can be logged into. What keeps that from being silent is the
# RequiresMountsFor= the container units carry when this is set: the stack
# fails to start rather than starting on the empty mount point. Add _netdev for
# an iSCSI attachment, whose device is not there until the network is.
antarest_data_mount_opts: "defaults,nofail"

antarest_solvers_dir: "{{ antarest_deploy_dir }}/solvers"
antarest_ssh_key: "{{ antarest_deploy_dir }}/id_rsa"

# Our own images, so they carry the localhost/ prefix podman gives to anything
# built on the machine.
antarest_image: "{{ container_local_prefix }}/antarest:latest"
antarest_base_image: "{{ container_local_prefix }}/antarest:base"

# Third-party images, fully qualified because podman will not guess a registry,
# and pinned to a major rather than `latest`.
#
# Pinning postgres is not housekeeping, it is the difference between a working
# stack and a broken one: the data directory under antarest_data_dir/db carries
# the cluster of one specific major, and PostgreSQL refuses to start on a
# directory written by another one without a pg_upgrade. With `latest`, the day
# the tag moves to the next major, an ordinary re-run of this playbook pulls it
# and the stack stops, with nothing having changed on our side. Moving to a new
# major is a deliberate operation with a dump and a restore, see
# docs/operations.md.
#
# The others hold no state we own, so pinning them is about reproducibility: a
# rebuild should not silently change the software being deployed. nginx is
# pinned on its minor, since its major is always `1`, and on a *stable* branch:
# the official images stop rebuilding a mainline branch as soon as the next one
# opens, so pinning the current mainline would quietly stop receiving security
# fixes while every re-run kept reporting no change.
antarest_postgres_image: "{{ container_registry }}/postgres:18"
antarest_redis_image: "{{ container_registry }}/redis:8"
antarest_nginx_image: "{{ container_registry }}/nginx:1.30"
antarest_adminer_image: "{{ container_registry }}/adminer:5"

# The images that have to be present for the stack to start, beyond our own.
# Shared with build.yml so the archives and the units cannot drift apart. The
# front door and Keycloak are in there although they belong to other roles:
# they are two more images an offline target has to find loaded, and `unique`
# keeps the front door from being archived twice when it is pinned to the same
# nginx as this stack serves with.
antarest_thirdparty_images: >-
  {{ ([antarest_postgres_image, antarest_redis_image, antarest_nginx_image,
       antares_edge_image]
      + ([antarest_adminer_image] if antarest_enable_adminer | bool else [])
      + ([keycloak_image] if keycloak_enabled | bool else []))
     | unique }}

# Build context of the derived image. Deliberately a directory of its own,
# holding nothing but the generated Dockerfile.
antarest_image_context: "{{ antarest_base_dir }}/image"

# Name of the systemd target that groups the stack, so that the whole thing can
# still be started, stopped and queried in one command.
antarest_service_name: antares-web

# Number of gunicorn workers in the backend container. The project's
# resources/deploy/gunicorn.py falls back to (2 * cpu_count) + 1 when
# GUNICORN_WORKERS is unset, which on a 24-core machine means 49 processes each
# loading the whole application: measured at 8.4 GB peak and over 8 minutes of
# CPU just to come up. Pinned to something a web front-end actually needs; the
# heavy lifting happens in the solver, not here.
antarest_gunicorn_workers: 4

# ---------------------------------------------------------------------------
#  Application configuration
#
#  The parts of config.prod.yaml a deployment is expected to differ on. What
#  stays written in the template is what is coupled to something else on this
#  machine: the container paths are the other half of the mounts in
#  vars/main.yml, and `root_path: api` is the other half of the `location
#  /api/` of the nginx configuration.
# ---------------------------------------------------------------------------

# The study directories the application exposes, one entry per workspace.
#
# `default` is required and is not a workspace like the others: it is where the
# managed studies live, the ones the interface creates itself, and it is the
# one directory the watcher never scans (`name != DEFAULT_WORKSPACE_NAME` in
# antarest/study/storage/rawstudy/watcher.py), since nothing ever arrives in it
# from outside. Its studies are named after their id, which is why the folder
# tree of the interface shows nothing there and answers "no folder found".
#
# Every other entry is a workspace of studies "on disk": a directory the
# watcher walks, whose sub-directories show up in the interface under the name
# of the workspace. `tmp` is the one the upstream reference configuration
# declares, kept here under the same name and the same directory so that an
# existing deployment reads as unchanged.
#
# Keys of an entry, all optional:
#   dir        leaf directory under antarest_data_dir/workspaces, defaults to
#              the name of the workspace. This is also the path studies are
#              recorded with in the database, so changing the directory of a
#              workspace that already holds studies leaves those rows pointing
#              at a path that no longer exists.
#   filter_in  regular expressions matched against the name of each
#   filter_out sub-directory, to take it in or leave it out of the scan.
#              Upstream defaults are everything in, nothing out.
#   groups     restricts the studies found there to these groups. Empty, the
#              upstream default, applies no restriction.
#
# To expose a tree that already exists elsewhere, an NFS study directory for
# instance, mount it on antarest_data_dir/workspaces/<dir> on the host and
# declare the workspace here. The mount has to be in place before the
# containers start: /workspaces is bind-mounted into them, and a filesystem
# mounted underneath it afterwards stays invisible inside a running container.
antarest_workspaces:
  default:
    dir: internal_studies
  tmp:
    dir: studies

# Authentication delegated to an external service, the LDAP gateway upstream
# calls the auth service. Left empty, the application only knows its local
# accounts, the admin included - which is what antares_auth_provider `none`
# gives. Otherwise it points at the connector of the antares_auth role, on the
# podman network; override it to reach a service this deployment does not run.
antarest_external_auth_url: >-
  {{ ('http://' ~ antares_auth_container ~ ':' ~ antares_auth_port)
     if antares_auth_provider != 'none' else '' }}
# Role the users arriving that way are given in their groups, as the RoleType
# enum of antarest/core/roles.py: 10 reader, 20 runner, 30 writer, 40 admin.
# 10 is the upstream default and the lowest of the four.
antarest_external_auth_default_group_role: 10
# Which of the groups that service returns are honoured, and under which id.
# `add_ext_groups` on takes them all; off, the mapping is a whitelist and only
# the groups it names get through, which is how two or three of them are
# exposed and the rest ignored. The mapping is read either way: it turns the
# id the connector sends into the id of the local group, and a group that is
# honoured is created when it does not exist yet.
antarest_external_auth_add_ext_groups: false
antarest_external_auth_group_mapping: {}

# Log level shared by every antarest process: the backend, the celery beat and
# the celery worker all read this file.
antarest_log_level: INFO

# Size of the thread pool fastapi runs blocking endpoints in. 12 is the value
# of the upstream reference configuration, the default in core/config.py being
# 5.
antarest_worker_threadpool_size: 12

# The local launcher runs the solver on the web machine itself, and by default
# sizes the choice offered in the launch dialog from the cores it finds there
# (`apply_cpu_detection` overwrites whatever nb_cores says as long as detection
# is on). The values below are therefore only read once detection is off, and
# they are worth setting then: the upstream fallback is a 22-core default on a
# 24-core maximum, whatever the machine actually has.
antarest_local_launcher_nb_cores_detection: true
antarest_local_launcher_nb_cores:
  min: 1
  default: 2
  max: "{{ ansible_facts['processor_vcpus'] | default(4) }}"

# ---------------------------------------------------------------------------
#  Background maintenance tasks
#
#  Scheduled by the antarest-celery-beat container and executed by
#  antarest-celery-worker. Nine periodic jobs: the watcher scan, the matrix,
#  blob, variable-view and task collectors, the auto archiver, the two disk
#  usage reports and, since AntaREST 2.34, the launcher load cache. This
#  replaces the `watcher` and `matrix_gc` singleton containers of the upstream
#  compose file, which covered two of the nine.
#
#  Intervals are not exposed here: the upstream defaults (a scan every 15
#  minutes, the matrix GC hourly, the blob GC daily) are sensible, and every
#  `*_sleeping_time` of docs/configuration.md can still be added to
#  config.prod.yaml.j2 if a deployment needs its own.
# ---------------------------------------------------------------------------

# `solo` runs one task at a time in the worker process itself. See the unit for
# why `prefork` is not simply a matter of raising the concurrency: the worker
# builds its database engine before celery would fork.
antarest_celery_pool: solo
antarest_celery_concurrency: 1

# Working directory of the beat container, holding its `celerybeat-schedule`
# state file. A path inside the container, bind-mounted from
# antarest_data_dir/celerybeat.
antarest_celerybeat_dir: /celerybeat

# What the collectors are allowed to delete. There are two upstream positions
# here and they disagree: `core/config.py` defaults every one of these switches
# to false, i.e. destructive from the first run, while the reference
# `resources/deploy/config.prod.yaml` shields exactly one of them with
# `matrix_gc_dry_run: true` and leaves the rest at the code default. This
# deployment applies to all of them the choice upstream made for the matrix
# collector: they log what they would delete and delete nothing. Read a few
# cycles in `journalctl -u antarest-celery-worker` before turning one off.
#
# Nothing has ever been reclaimed on a deployment that ran the upstream compose
# file, so the first real run of the matrix and blob collectors on an old
# instance has a lot of catching up to do.
antarest_matrix_gc_dry_run: true
antarest_blob_gc_dry_run: true
antarest_variable_view_gc_dry_run: true

# The fourth collector deletes rows of the task table older than
# `tasks_gc_retention_days` (30 upstream). What it reclaims is history rather
# than space, since nothing but the task list of the interface reads those
# rows, but it is destructive by the same upstream default as the others.
#
# It only became settable from the configuration file in 2.34.0, which rewrote
# the config loader with pydantic: the hand-written StorageConfig.from_dict of
# 2.33 and earlier read every neighbouring key but not this one, so the field
# kept its `False` default whatever the file said. Pinning antarest_version
# back to a 2.33 is the one case where this variable is written and ignored.
antarest_tasks_gc_dry_run: true

# The auto archiver is not a collector: it moves studies untouched for
# `auto_archive_threshold_days` (60 upstream) into the archive directory, which
# is visible to users. Left in dry run so that turning the maintenance stack on
# does not silently archive half the studies of an existing instance.
antarest_auto_archive_dry_run: true

# The watcher scan is the one `*_dry_run` of the set that is not a safety
# switch, so it is the one left at the upstream value. Dry run there still
# walks the workspaces and reports what it found, but `sync_studies_on_disk` is
# never called, so a study dropped in a workspace never appears in the
# interface: that is the feature being off rather than a deletion being held
# back. It is written out all the same, because a scan that reports what it
# sees without touching the database is what you want when a study fails to
# show up and the question is whether the scan finds it at all.
antarest_watcher_scan_dry_run: false

# What "old enough to be deleted" means for the tasks above that delete
# something. Four of the five have such a threshold, the blob collector being
# the exception: upstream gives it a sleeping time and a dry run and nothing
# else. Every value here is the upstream one.
#
# They are written out because a dry_run switch exposed without its threshold
# is half a setting: antarest_auto_archive_dry_run decides *that* studies are
# archived, this decides *which*, and 60 days is a threshold an instance where
# a study is opened once a quarter will not want.
#
# matrix_gc_retention_time is the odd one, seconds rather than days: it is how
# long a matrix is kept after nothing references it any more.
antarest_matrix_gc_retention_time: 3600
antarest_variable_view_gc_retention_days: 30
antarest_tasks_gc_retention_days: 30
antarest_auto_archive_threshold_days: 60

# The ports the machine answers on (antarest_http_port, antarest_https_port)
# live in roles/antares_defaults/: they belong to the front door of the
# antares_edge role now, and the hardening role has to open them in the
# firewall without running either role.

# ---------------------------------------------------------------------------
#  nginx
#
#  This one serves the built web application and proxies /api/ to the backend,
#  and that is all it does. TLS, the ACME challenge and the routing of
#  everything else the machine serves belong to the antares_edge role. It is
#  published on the loopback alone (antarest_nginx_bind, antarest_nginx_port in
#  roles/antares_defaults/), the front door being what the outside reaches.
# ---------------------------------------------------------------------------

# Checksum of the resources/deploy/nginx.conf the rendered configuration was
# derived from (unchanged from AntaREST v2.33.0 to v2.34.0). That file is not
# mounted any more, so a change upstream would go unnoticed: the deployment
# compares and warns.
antarest_nginx_upstream_sha1: 48204a956d1dc69ef5c5b8b4585a0cb517e8f9d8

# Whose X-Forwarded-* headers gunicorn believes. Its default is 127.0.0.1, and
# nginx reaches the backend from the podman network, so without this the
# X-Forwarded-Proto carried from the front door is dropped and the backend
# thinks it is serving plain http whatever the user typed.
antarest_forwarded_allow_ips: "*"

# Name of the nginx container. Nothing resolves it by name on the podman
# network; the front door reaches it on the loopback port it publishes.
antarest_nginx_container: antares-nginx

# Node image used to build the web application, fully qualified for podman.
antarest_node_image_suffix: "-bookworm"
antarest_node_image_repo: "{{ container_registry }}/node"

# UID the front-end build container runs as. It only has to be able to write in
# the checkout, so on a target it is the antares account that owns it. This is
# deliberately NOT the same knob as antares_uid, which is the UID baked into the
# backend image: a builder overrides this one to build as root while still
# producing an image carrying the fleet's antares_uid.
antarest_frontend_build_uid: "{{ antares_uid }}"
antarest_frontend_build_gid: "{{ antares_gid }}"

# Who owns the checkout on this machine. Again deliberately distinct from
# antares_user: that name is baked into the image as the account to create, so
# overriding it to build as root would produce a `groupadd root` inside the
# image. A builder overrides these two instead.
antarest_checkout_owner: "{{ antares_user }}"
antarest_checkout_group: "{{ antares_group }}"

# Records what the web application was last built from, so that a re-run does
# not rebuild the front-end for nothing. Kept out of the checkout because the
# checkout is reset on every run.
antarest_frontend_stamp_file: "{{ antarest_deploy_dir }}/.frontend-build-stamp"

# The login form labels its first field "NNI", RTE's internal employee number,
# which means nothing outside RTE. Replace it with the project's own
# translation key so the field stays localised (Username / Nom).
# Set a quoted literal for a fixed label instead, e.g. '"Identifiant"'.
antarest_patch_login_label: true
antarest_login_username_label: '{t("global.username")}'

antares_web_packages:
  - git

# Shallow clone by default: nothing here needs the history, and the checkout is
# reset on every run anyway. Set to 0 for a full clone.
antarest_clone_depth: 1

# Node version used to build the web app. `auto` reads webapp/.nvmrc from the
# checkout, which is the version the project actually tests against.
antarest_node_version: auto

# Add an antares_uid/antares_gid account inside the backend image. The
# containers run as that pair so that the files they create in the bind mounts
# belong to the antares user; without a matching passwd entry some code paths
# that need a home directory fail.
#
# Note that this bakes antares_uid into the image, so a prebuilt image is only
# reusable across machines that agree on the value. Setting HOME in the compose
# environment instead would decouple the two, at the cost of losing the passwd
# entry.
antarest_add_container_user: true

# `local`, `slurm`, or leave it to follow slurm_enabled.
antarest_default_launcher: "{{ 'slurm' if slurm_enabled | bool else 'local' }}"

# Number of cores offered in the Antares-Web launch dialog for Slurm jobs.
# The maximum is capped to the smallest compute node, otherwise jobs asking
# for more cores than any node owns stay pending forever.
#
# A compute node whose facts are not around contributes nothing rather than
# taking the play down: a --limit run on the web machine with an expired cache
# leaves hostvars[node].ansible_facts empty. The default of `map(attribute=)`
# is only substituted when it is truthy, hence 0 and the reject rather than
# None: with None the undefined reaches `min` and the render fails.
_slurm_compute_vcpus: >-
  {{ (groups['slurm_compute'] | default([]))
     | map('extract', hostvars)
     | map(attribute='ansible_facts.processor_vcpus', default=0)
     | select('integer') | reject('eq', 0) | list }}
slurm_launcher_nb_cores_min: 1
slurm_launcher_nb_cores_max: "{{ (_slurm_compute_vcpus | min) if (_slurm_compute_vcpus | length) > 0 else 2 }}"
slurm_launcher_nb_cores_default: "{{ [2, slurm_launcher_nb_cores_max | int] | min }}"

# Slurm launcher timings (seconds), as in the reference procedure.
slurm_launcher_default_wait_time: 900
slurm_launcher_default_time_limit: 172800

# Port sshd answers on at the front-end, which is how the Slurm launcher of
# Antares-Web submits its jobs. Next to the other launcher settings rather than
# in the role, because the day that port moves it will move in the hardening
# role, and a role default is only in scope for the play that runs the role.
slurm_launcher_ssh_port: 22

# Where the sources come from, and what the play may do with the checkout it
# finds. The version they are moved to is antarest_version, in
# roles/antares_defaults/, because build.yml pins its artefacts to it.
antarest_repo: "https://github.com/AntaresSimulatorTeam/AntaREST.git"
antarest_update: true                  # let the play move the checkout to antarest_version
antarest_force_rebuild: false          # force front-end + image rebuild even if up to date

# The address the nginx of the stack is published on. 127.0.0.1 on purpose:
# everything but the front door is reachable from the machine alone, so a port
# opened by mistake in a security group exposes nothing. Anything else the
# front door serves later follows the same rule, with a loopback port of its
# own. The port is antarest_nginx_port, in roles/antares_defaults/.
antarest_nginx_bind: 127.0.0.1
