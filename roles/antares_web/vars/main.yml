---
# ===========================================================================
#  Container layout of the stack
#
#  Derived from the project docker-compose.yml, which quadlet replaces. Kept
#  here rather than duplicated across the unit templates so that "which
#  container mounts what" can be audited in one place.
#
#  Container names are load-bearing, they are the DNS names on the podman
#  network:
#    - `antarest` is what resources/deploy/nginx.conf proxies to
#      (proxy_pass http://antarest:5000/),
#    - `postgresql` is what config.prod.yaml points the database at; upstream
#      names that container `postgres`, kept as a network alias,
#    - `redis` is what config.prod.yaml points the cache at.
#  Renaming any of the three breaks the stack silently.
# ===========================================================================

# Every bind mount below is written with its access mode spelled out, `:rw` or
# `:ro`, and gets container_volume_opts appended to it. That variable is the
# SELinux relabelling flag (`,z`) on a machine where SELinux is enforcing and
# an empty string everywhere else, see group_vars/all.yml. Spelling the access
# mode out is what makes the two composable: podman takes the options as one
# comma-separated list after the second colon, so there has to be something for
# the flag to be appended to.
#
# Two mounts are not listed here: the cluster directory of postgresql and the
# schedule file of celery beat, which belong to one container each and are
# written in their own unit. They follow the same spelling, and have to: a bind
# mount that misses the flag is unreadable to the container on any EL 9 host.
_antarest_volume_opts: "{{ container_volume_opts | trim }}"

# Mounts every antarest process needs (backend, celery worker). The celery
# beat is the exception: it only reads the configuration, see its unit.
antarest_shared_volumes: >-
  {{ _antarest_shared_volumes | map('regex_replace', '$', _antarest_volume_opts) | list }}

_antarest_shared_volumes:
  - "{{ antarest_data_dir }}/workspaces:/workspaces:rw"
  - "{{ antarest_data_dir }}/tmp:/antarest_tmp_dir:rw"
  - "{{ antarest_data_dir }}/matrices:/matrixstore:rw"
  - "{{ antarest_data_dir }}/archives:/studies/archives:rw"
  - "{{ antarest_data_dir }}/logs:/logs:rw"
  - "{{ antarest_data_dir }}/blobstore:/blobstore:rw"
  - "{{ antarest_deploy_dir }}/config.prod.yaml:/resources/application.yaml:ro"

# Mounts only the API backend needs: the local launcher workspace, the gunicorn
# configuration, the solver binaries, and the key used to reach the Slurm
# front-end.
antarest_backend_volumes: >-
  {{ antarest_shared_volumes
     + ([antarest_data_dir ~ '/local_workspace:/local_workspace:rw',
         antarest_dir ~ '/resources/deploy/gunicorn.py:/conf/gunicorn.py:ro',
         antarest_solvers_dir ~ ':/antares_simulator:ro']
        + ([antarest_ssh_key ~ ':/id_rsa:ro'] if slurm_enabled | bool else []))
       | map('regex_replace', '$', _antarest_volume_opts) | list }}

# Certificate actually served, resolved from the provider. `manual` is the only
# one where the operator chooses the paths; the other two are managed here.
antarest_tls_cert: >-
  {{ ('/etc/letsencrypt/live/' ~ antarest_tls_domain ~ '/fullchain.pem')
     if antarest_tls_provider == 'letsencrypt' else antarest_tls_certificate }}
antarest_tls_key: >-
  {{ ('/etc/letsencrypt/live/' ~ antarest_tls_domain ~ '/privkey.pem')
     if antarest_tls_provider == 'letsencrypt' else antarest_tls_certificate_key }}

# What nginx needs mounted to serve TLS. /etc/letsencrypt whole, because
# live/<domain>/*.pem are symlinks into archive/<domain>/ and a mount of live/
# alone would leave them dangling inside the container. The webroot is where
# certbot drops the challenge files, so it is only useful to that provider.
# Mounted read-only: nothing in the container writes there.
antarest_tls_volumes: >-
  {{ ((['/etc/letsencrypt:/etc/letsencrypt:ro',
        antarest_tls_webroot ~ ':' ~ antarest_tls_webroot_container ~ ':ro']
       if antarest_tls_provider == 'letsencrypt'
       else ([antarest_tls_cert | dirname, antarest_tls_key | dirname]
             | unique | map('regex_replace', '^(.*)$', '\1:\1:ro') | list))
      | map('regex_replace', '$', _antarest_volume_opts) | list)
     if antarest_tls_enabled | bool else [] }}

# With TLS off the project file is mounted unchanged, exactly as before; with
# TLS on it is the rendered one, which is that file plus the port 443 server.
antarest_nginx_conf_source: >-
  {{ (antarest_deploy_dir ~ '/nginx.conf') if antarest_tls_enabled | bool
     else (antarest_dir ~ '/resources/deploy/nginx.conf') }}

antarest_nginx_volumes: >-
  {{ ([antarest_nginx_conf_source ~ ':/etc/nginx/conf.d/default.conf:ro',
       antarest_dir ~ '/webapp/dist:/www:ro',
       antarest_dir ~ '/resources/deploy/web.config.json:/www/config.json:ro']
      | map('regex_replace', '$', _antarest_volume_opts) | list)
     + antarest_tls_volumes }}

# The quadlet units, rendered into /etc/containers/systemd. Order is irrelevant,
# systemd resolves the dependencies declared inside each unit.
antarest_quadlet_units: >-
  {{ ['antares-web.network',
      'postgresql.container',
      'redis.container',
      'antarest.container',
      'antarest-celery-beat.container',
      'antarest-celery-worker.container',
      'antares-nginx.container']
     + (['antarest-adminer.container'] if antarest_enable_adminer | bool else []) }}

# Every unit this role has ever written. Whatever is in here but not in
# antarest_quadlet_units is stopped and removed, so turning an option back off
# takes the container down instead of leaving an orphan unit running.
#
# antarest-watcher and antarest-matrix-gc are listed although no template
# produces them any more: that is what takes them down on a machine deployed
# before the maintenance tasks moved to celery. Removing the two names here
# would leave those containers running next to the celery worker, scanning the
# workspaces a second time.
antarest_quadlet_all_units:
  - antares-web.network
  - postgresql.container
  - redis.container
  - antarest.container
  - antarest-celery-beat.container
  - antarest-celery-worker.container
  - antarest-watcher.container
  - antarest-matrix-gc.container
  - antares-nginx.container
  - antarest-adminer.container

# Units this run must take down: everything the role knows about minus what it
# is about to write.
antarest_quadlet_stale_units: >-
  {{ antarest_quadlet_all_units | difference(antarest_quadlet_units) }}

# Systemd services generated by quadlet from the units above. `<name>.container`
# becomes `<name>.service`, and `<name>.network` becomes `<name>-network.service`.
antarest_quadlet_services: >-
  {{ ['postgresql.service',
      'redis.service',
      'antarest.service',
      'antarest-celery-beat.service',
      'antarest-celery-worker.service',
      'antares-nginx.service',
      'antares-web-network.service']
     + (['antarest-adminer.service'] if antarest_enable_adminer | bool else []) }}
