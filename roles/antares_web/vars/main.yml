---
# ===========================================================================
#  Container layout of the stack
#
#  Derived from the project docker-compose.yml, which quadlet replaces. Kept
#  here rather than duplicated across the unit templates so that "which
#  container mounts what" can be audited in one place.
#
#  Container names are load-bearing, they are the DNS names on the podman
#  network:
#    - `antarest` is what resources/deploy/nginx.conf proxies to
#      (proxy_pass http://antarest:5000/),
#    - `postgresql` is what config.prod.yaml points the database at; upstream
#      names that container `postgres`, kept as a network alias,
#    - `redis` is what config.prod.yaml points the cache at.
#  Renaming any of the three breaks the stack silently.
# ===========================================================================

# Mounts every antarest process needs (backend, watcher, matrix-gc).
antarest_shared_volumes:
  - "{{ antarest_data_dir }}/workspaces:/workspaces"
  - "{{ antarest_data_dir }}/tmp:/antarest_tmp_dir"
  - "{{ antarest_data_dir }}/matrices:/matrixstore"
  - "{{ antarest_data_dir }}/archives:/studies/archives"
  - "{{ antarest_data_dir }}/logs:/logs"
  - "{{ antarest_data_dir }}/blobstore:/blobstore"
  - "{{ antarest_deploy_dir }}/config.prod.yaml:/resources/application.yaml:ro"

# Mounts only the API backend needs: the local launcher workspace, the gunicorn
# configuration, the solver binaries, and the key used to reach the Slurm
# front-end.
antarest_backend_volumes: >-
  {{ antarest_shared_volumes
     + [antarest_data_dir ~ '/local_workspace:/local_workspace',
        antarest_dir ~ '/resources/deploy/gunicorn.py:/conf/gunicorn.py:ro',
        antarest_solvers_dir ~ ':/antares_simulator:ro']
     + ([antarest_ssh_key ~ ':/id_rsa:ro'] if slurm_enabled | bool else []) }}

antarest_nginx_volumes:
  - "{{ antarest_dir }}/resources/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
  - "{{ antarest_dir }}/webapp/dist:/www"
  - "{{ antarest_dir }}/resources/deploy/web.config.json:/www/config.json:ro"

# The quadlet units, rendered into /etc/containers/systemd. Order is irrelevant,
# systemd resolves the dependencies declared inside each unit.
antarest_quadlet_units: >-
  {{ ['antares-web.network',
      'postgresql.container',
      'redis.container',
      'antarest.container',
      'antarest-watcher.container',
      'antarest-matrix-gc.container',
      'antares-nginx.container']
     + (['antarest-adminer.container'] if antarest_enable_adminer | bool else []) }}

# Every unit this role knows how to write. Whatever is in here but not in
# antarest_quadlet_units is actively removed, so turning an option back off
# takes the container down instead of leaving an orphan unit running.
antarest_quadlet_all_units:
  - antares-web.network
  - postgresql.container
  - redis.container
  - antarest.container
  - antarest-watcher.container
  - antarest-matrix-gc.container
  - antares-nginx.container
  - antarest-adminer.container

# Systemd services generated by quadlet from the units above. `<name>.container`
# becomes `<name>.service`, and `<name>.network` becomes `<name>-network.service`.
antarest_quadlet_services: >-
  {{ ['postgresql.service',
      'redis.service',
      'antarest.service',
      'antarest-watcher.service',
      'antarest-matrix-gc.service',
      'antares-nginx.service',
      'antares-web-network.service']
     + (['antarest-adminer.service'] if antarest_enable_adminer | bool else []) }}
