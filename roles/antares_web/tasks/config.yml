---
- name: Create the Antares-Web data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ antares_user }}"
    group: "{{ antares_group }}"
    mode: "0755"
  loop:
    - "{{ antarest_data_dir }}/workspaces"
    - "{{ antarest_data_dir }}/workspaces/internal_studies"
    - "{{ antarest_data_dir }}/workspaces/studies"
    - "{{ antarest_data_dir }}/tmp"
    - "{{ antarest_data_dir }}/matrices"
    - "{{ antarest_data_dir }}/archives"
    - "{{ antarest_data_dir }}/logs"
    - "{{ antarest_data_dir }}/db"
    - "{{ antarest_data_dir }}/local_workspace"
    - "{{ antarest_data_dir }}/local_workspace/local"
    - "{{ antarest_data_dir }}/local_workspace/slurm"

- name: Deploy the Antares-Web configuration
  ansible.builtin.template:
    src: config.prod.yaml.j2
    dest: "{{ antarest_deploy_dir }}/config.prod.yaml"
    owner: "{{ antares_user }}"
    group: "{{ antares_group }}"
    mode: "0640"
  notify: Restart Antares-Web

# One .container (or .network) file per container, which systemd turns into
# services through the podman quadlet generator at every daemon-reload. This is
# what replaces the project docker-compose.yml and the override that used to be
# layered on top of it: nothing is inherited any more, every mount and every
# dependency is written out explicitly.
- name: Deploy the quadlet units
  ansible.builtin.template:
    src: "quadlet/{{ item }}.j2"
    dest: "/etc/containers/systemd/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ antarest_quadlet_units }}"
  register: antarest_quadlet
  notify: Restart Antares-Web

# Turning an option such as antarest_enable_adminer back off has to take the
# container down, not leave a live unit behind.
- name: Remove the quadlet units of disabled components
  ansible.builtin.file:
    path: "/etc/containers/systemd/{{ item }}"
    state: absent
  loop: "{{ antarest_quadlet_all_units | difference(antarest_quadlet_units) }}"
  register: antarest_quadlet_removed
  notify: Restart Antares-Web

# An ordinary systemd unit, not a quadlet one: it only aggregates the generated
# services so the stack keeps a single start/stop handle.
- name: Deploy the systemd target grouping the stack
  ansible.builtin.template:
    src: antares-web.target.j2
    dest: "/etc/systemd/system/{{ antarest_service_name }}.target"
    owner: root
    group: root
    mode: "0644"
  register: antarest_target
  notify: Restart Antares-Web

# The generator only runs on daemon-reload, so until this happens the units
# above simply do not exist as services.
- name: Reload systemd so the quadlet generator picks the units up
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    antarest_quadlet.changed
    or antarest_quadlet_removed.changed
    or antarest_target.changed
