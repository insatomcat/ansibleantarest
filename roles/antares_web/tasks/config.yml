---
# `default` is where the managed studies are written and there is no fallback
# for it: `get_workspace_path` looks the name up in the file and raises
# `ValueError: Workspace 'default' not found in config`, at the moment a study
# is created rather than at startup. That is a 500 in the interface, a long way
# from the inventory entry that caused it, hence the check here.
- name: Check the default workspace is declared
  ansible.builtin.assert:
    that: "'default' in antarest_workspaces"
    fail_msg: >-
      antarest_workspaces must declare a `default` workspace: that is where
      Antares-Web writes the studies it creates itself.
    quiet: true

# Antares-Web refuses a configuration where one workspace path contains
# another: `validate_workspaces` raises `ValueError: Overlapping workspace
# paths found`, and since that happens while the configuration is read, the
# backend never boots. It crash-loops until it exhausts StartLimitBurst, and
# antares-nginx, which requires it, is taken down with it and does not come
# back on its own once the configuration is fixed. Two entries with the same
# `dir` are all it takes, and a leaf name is checked for so that a `dir` of
# `studies/sub` cannot nest under another workspace either.
- name: Check the workspaces do not overlap
  ansible.builtin.assert:
    that:
      - _antarest_workspace_dirs | length == _antarest_workspace_dirs | unique | length
      - _antarest_workspace_dirs | select('search', '/') | list | length == 0
    fail_msg: >-
      Every workspace of antarest_workspaces needs a directory of its own, and
      `dir` must be a single directory name, not a path. Declared:
      {{ _antarest_workspace_dirs | join(', ') }}
    quiet: true
  vars:
    _antarest_workspace_dirs: >-
      {{ (antarest_workspaces | dict2items
          | map(attribute='value.dir', default='') | reject('eq', '') | list)
         + (antarest_workspaces | dict2items
            | rejectattr('value.dir', 'defined') | map(attribute='key') | list) }}

- name: Create the Antares-Web data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ antares_user }}"
    group: "{{ antares_group }}"
    mode: "0755"
  loop:
    - "{{ antarest_data_dir }}/workspaces"
    - "{{ antarest_data_dir }}/tmp"
    - "{{ antarest_data_dir }}/matrices"
    - "{{ antarest_data_dir }}/archives"
    - "{{ antarest_data_dir }}/logs"
    - "{{ antarest_data_dir }}/blobstore"
    # Empty unless the out-of-study output storage is turned on, and mounted
    # everywhere all the same: reading the configuration creates it, see
    # config.prod.yaml.j2.
    - "{{ antarest_data_dir }}/outputs"
    # Working directory of the celery beat container, which writes its
    # `celerybeat-schedule` state file there. See the unit for why it cannot
    # simply stay in the container.
    - "{{ antarest_data_dir }}/celerybeat"
    - "{{ antarest_data_dir }}/db"
    - "{{ antarest_data_dir }}/local_workspace"
    - "{{ antarest_data_dir }}/local_workspace/local"
    - "{{ antarest_data_dir }}/local_workspace/slurm"

# One directory per declared workspace, under the single /workspaces mount.
# Created here rather than left to podman, which would make them owned by root:
# the containers run as the antares user and the watcher has to be able to read
# them, the backend to write in the default one.
#
# Nothing removes the directory of a workspace taken out of the variable. That
# is deliberate: it holds studies.
- name: Create the workspace directories
  ansible.builtin.file:
    path: "{{ antarest_data_dir }}/workspaces/{{ item.value.dir | default(item.key) }}"
    state: directory
    owner: "{{ antares_user }}"
    group: "{{ antares_group }}"
    mode: "0755"
  loop: "{{ antarest_workspaces | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Since 2.34 the configuration is loaded through pydantic, and a `hostname:`
# left empty in the slurm launcher is a validation error rather than something
# the application shrugs off: the backend then refuses to start and the unit
# crash-loops. slurm_frontend_ip is empty when the front-end has no cached
# facts, which is what a `--limit antares_web` run on a cold controller gives.
# Better caught here, with the reason, than in a container journal.
- name: Check the Slurm front-end address is known
  ansible.builtin.assert:
    that: slurm_frontend_ip | trim | length > 0
    fail_msg: >-
      The Slurm launcher is enabled but the front-end address is unknown.
      Run the play against the whole inventory, or set slurm_node_ip (or
      ansible_host) on the host of the slurm_frontend group.
    quiet: true
  when: slurm_enabled | bool

- name: Deploy the Antares-Web configuration
  ansible.builtin.template:
    src: config.prod.yaml.j2
    dest: "{{ antarest_deploy_dir }}/config.prod.yaml"
    owner: "{{ antares_user }}"
    group: "{{ antares_group }}"
    mode: "0640"
  notify: Restart Antares-Web

# One .container (or .network) file per container, which systemd turns into
# services through the podman quadlet generator at every daemon-reload. This is
# what replaces the project docker-compose.yml and the override that used to be
# layered on top of it: nothing is inherited any more, every mount and every
# dependency is written out explicitly.
- name: Deploy the quadlet units
  ansible.builtin.template:
    src: "quadlet/{{ item }}.j2"
    dest: "/etc/containers/systemd/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ antarest_quadlet_units }}"
  register: antarest_quadlet
  notify: Restart Antares-Web

# nginx has a file of its own because the run that obtains a certificate
# renders it twice, see tasks/nginx.yml. Here it only adds the rendered
# configuration; the unit above is written again identically.
- name: Deploy the nginx configuration and its unit
  ansible.builtin.include_tasks: nginx.yml

# Turning an option such as antarest_enable_adminer back off, or replacing the
# watcher and matrix-gc containers with the celery pair, has to take the old
# container down. Deleting the unit file is not enough: the next daemon-reload
# makes the service unknown to systemd, but the container it started keeps
# running, and `PartOf=` no longer carries the restart to something systemd has
# forgotten. So stop first, while the service still exists, then remove.
- name: Look for the quadlet units this run must take down
  ansible.builtin.stat:
    path: "/etc/containers/systemd/{{ item }}"
  loop: "{{ antarest_quadlet_stale_units }}"
  register: antarest_quadlet_stale

- name: Stop the containers of disabled components
  ansible.builtin.systemd:
    name: >-
      {{ item | regex_replace('\.container$', '.service')
              | regex_replace('\.network$', '-network.service') }}
    state: stopped
  loop: >-
    {{ antarest_quadlet_stale.results
       | selectattr('stat.exists') | map(attribute='item') | list }}

- name: Remove the quadlet units of disabled components
  ansible.builtin.file:
    path: "/etc/containers/systemd/{{ item }}"
    state: absent
  loop: "{{ antarest_quadlet_stale_units }}"
  register: antarest_quadlet_removed
  notify: Restart Antares-Web

# An ordinary systemd unit, not a quadlet one: it only aggregates the generated
# services so the stack keeps a single start/stop handle.
- name: Deploy the systemd target grouping the stack
  ansible.builtin.template:
    src: antares-web.target.j2
    dest: "/etc/systemd/system/{{ antarest_service_name }}.target"
    owner: root
    group: root
    mode: "0644"
  register: antarest_target
  notify: Restart Antares-Web

# The generator only runs on daemon-reload, so until this happens the units
# above simply do not exist as services.
- name: Reload systemd so the quadlet generator picks the units up
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    antarest_quadlet.changed
    or antarest_quadlet_removed.changed
    or antarest_target.changed
