---
# The celery beat unit hands its state file to start.sh through
# CELERYBEAT_SCHEDULE, which 2.34 and earlier ignore: the beat would then try
# to write in / and crash-loop. Only a release tag can be compared; a branch or
# a commit is taken on trust.
- name: Refuse an AntaREST release older than the units expect
  ansible.builtin.assert:
    that: antarest_version | regex_replace('^v', '') is version('2.35.0', '>=')
    fail_msg: >-
      antarest_version is {{ antarest_version }}, and this role needs 2.35.0 or
      later (the celery beat unit relies on CELERYBEAT_SCHEDULE). Set
      antarest_version to v2.35.0 or a later tag.
    quiet: true
  when: antarest_version is match('^v?[0-9]+[.][0-9]+[.][0-9]+$')

# Before the checkout, which is what creates antarest_data_dir: a directory
# made on the boot disk and then mounted over is a directory nothing can read
# again.
- name: Put the persistent state on its own volume
  ansible.builtin.include_tasks: data_volume.yml
  when: antarest_data_device | length > 0

- name: Fetch the AntaREST sources
  ansible.builtin.include_tasks: checkout.yml

- name: Install the Antares solvers for the local launcher
  ansible.builtin.include_role:
    name: antares_solver
  vars:
    antares_solver_dest: "{{ antarest_solvers_dir }}"

# Either the image and the web application are built here, or they are loaded
# from what build.yml produced. See antarest_image_source in antares_defaults.
- name: Load the prebuilt image and web application
  ansible.builtin.include_tasks: load_artifacts.yml
  when: antarest_image_source == 'archive'

- name: Patch the web application sources
  ansible.builtin.include_tasks: patch_frontend.yml
  when:
    - antarest_image_source == 'build'
    - antarest_patch_login_label | bool

- name: Build the web application
  ansible.builtin.include_tasks: build_frontend.yml
  when: antarest_image_source == 'build'

- name: Build the Antares-Web image
  ansible.builtin.include_tasks: build_image.yml
  when: antarest_image_source == 'build'

- name: Create the SSH key used to reach the Slurm front-end
  ansible.builtin.include_tasks: ssh_key.yml
  when: slurm_enabled | bool

- name: Render the Antares-Web configuration
  ansible.builtin.include_tasks: config.yml

- name: Start Antares-Web
  ansible.builtin.include_tasks: service.yml
