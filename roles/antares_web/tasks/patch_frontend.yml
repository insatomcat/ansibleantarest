---
# The login form labels its username field "NNI" (RTE's internal employee
# number). It is hardcoded in the source, so the only way to change it is to
# patch before building the web application.
#
# The file moved between releases (webapp/src/components/wrappers/
# LoginWrapper.tsx up to 2.19, webapp/src/routes/login/index.tsx in 2.33), so
# it is looked up by content rather than by path. An empty result simply means
# upstream got rid of the label, and the patch turns into a no-op.
- name: Locate the login form carrying the "NNI" label
  ansible.builtin.command:
    cmd: "grep -rlF --include=*.tsx 'label=\"NNI\"' webapp/src"
    chdir: "{{ antarest_dir }}"
  register: antarest_nni_files
  changed_when: false
  failed_when: antarest_nni_files.rc not in [0, 1]

- name: Report that upstream no longer ships the "NNI" label
  ansible.builtin.debug:
    msg: >-
      No "NNI" label found in {{ antarest_version }}; nothing to patch.
      antarest_patch_login_label can be turned off.
  when: antarest_nni_files.stdout_lines | length == 0

- name: Replace the "NNI" label on the login form
  ansible.builtin.replace:
    path: "{{ antarest_dir }}/{{ item }}"
    regexp: 'label="NNI"'
    replace: "label={{ antarest_login_username_label }}"
    owner: "{{ antares_user }}"
    group: "{{ antares_group }}"
  loop: "{{ antarest_nni_files.stdout_lines }}"

- name: Check no "NNI" label survived the patch
  ansible.builtin.command:
    cmd: "grep -rlF --include=*.tsx 'label=\"NNI\"' webapp/src"
    chdir: "{{ antarest_dir }}"
  register: antarest_nni_left
  changed_when: false
  failed_when: antarest_nni_left.rc not in [0, 1]

- name: Fail when the login form is still labelled "NNI"
  ansible.builtin.assert:
    that: antarest_nni_left.stdout_lines | length == 0
    fail_msg: >-
      The "NNI" label is still present in
      {{ antarest_nni_left.stdout_lines | join(', ') }}. The markup probably
      changed upstream; patch it by hand or set
      antarest_patch_login_label: false.
    quiet: true
