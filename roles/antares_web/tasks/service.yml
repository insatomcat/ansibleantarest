---
# The generator is what systemd itself runs on reload, so this catches a
# malformed unit before the stack is asked to start. It exits non-zero and names
# the offending file and key. Note that it validates the whole of
# /etc/containers/systemd, so an unrelated broken unit on the machine trips it
# too, which is fair: systemd would skip that one as well.
- name: Validate the quadlet units
  ansible.builtin.command: /usr/lib/systemd/system-generators/podman-system-generator -dryrun
  register: antarest_quadlet_check
  changed_when: false

- name: Check every expected service was generated
  ansible.builtin.assert:
    that:
      - "'---' ~ item ~ '---' in antarest_quadlet_check.stdout"
    fail_msg: >-
      The quadlet generator did not produce {{ item }}. Units present in
      /etc/containers/systemd:
      {{ antarest_quadlet_check.stdout | regex_findall('---(.+?)---') | join(', ') }}
    quiet: true
  loop: "{{ antarest_quadlet_services }}"

# A container that died as many times in a row as its unit allows exhausted the
# start budget declared there (StartLimitBurst), and systemd then refuses to
# start it again for as long as StartLimitIntervalSec runs, with "start request
# repeated too quickly". The run that fixes the cause would fail on the previous
# run's verdict, and say nothing about what is actually wrong. reset-failed
# clears that, for every unit of the stack rather than for the database alone:
# any of them can be the one that crash-looped.
#
# Asked first rather than run unconditionally: `systemctl reset-failed` on a
# unit systemd has not loaded exits 1 with "Unit postgresql.service not loaded",
# and that is the normal state of a first deployment, where the generated unit
# has never been started. `is-failed` answers `inactive` there, and only
# `failed` on the machine this is meant for.
- name: Look for the units a previous run left failed
  ansible.builtin.command: "systemctl is-failed {{ item }}"
  loop: "{{ antarest_quadlet_services }}"
  register: antarest_units_failed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Clear those failures
  ansible.builtin.command: "systemctl reset-failed {{ item }}"
  loop: >-
    {{ antarest_units_failed.results | selectattr('stdout', 'equalto', 'failed')
       | map(attribute='item') | list }}
  changed_when: true

- name: Create the database schema before the backend starts
  ansible.builtin.include_tasks: migrate.yml

- name: Start and enable the Antares-Web stack
  ansible.builtin.systemd:
    name: "{{ antarest_service_name }}.target"
    enabled: true
    state: started
    daemon_reload: true

# Starting the target does not repair a stack that is half down: a target that
# is already active is a no-op, and the container that is missing - because a
# previous run left it failed, or because the failure was just cleared above -
# is not pulled back up by it. `PartOf=` only carries a stop or a restart to
# units that are running, and the handler below is only notified when something
# was rendered anew, which the re-run that fixes a problem usually does not do.
# So each service is asked for by name; on a healthy machine they are all
# started already and this reports nothing.
#
# It is also what makes a container that refuses to start say so here, with the
# systemd error, instead of leaving the run to time out much later in the
# wait_for below with nothing but a port number.
- name: Start every service of the stack
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop: "{{ antarest_quadlet_services }}"

- name: Apply the pending restarts now
  ansible.builtin.meta: flush_handlers

- name: Wait for the web interface to answer
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ antarest_https_port if antarest_tls_active | bool else antarest_http_port }}"
    timeout: 300

# Over https once there is a certificate, since port 80 then only answers a
# redirect. Without certificate validation on purpose: the request goes to
# 127.0.0.1 and the certificate is issued for antarest_tls_domain, so the name
# could not match; what is being checked here is that the stack answers, not
# the certificate.
- name: Check the API is up
  ansible.builtin.uri:
    url: >-
      {{ 'https://127.0.0.1:' ~ antarest_https_port if antarest_tls_active | bool
         else 'http://127.0.0.1:' ~ antarest_http_port }}/api/health
    validate_certs: false
    status_code: [200]
  register: antarest_health
  retries: 30
  delay: 10
  until: antarest_health.status is defined and antarest_health.status == 200
