---
# The generator is what systemd itself runs on reload, so this catches a
# malformed unit before the stack is asked to start. It exits non-zero and names
# the offending file and key. Note that it validates the whole of
# /etc/containers/systemd, so an unrelated broken unit on the machine trips it
# too, which is fair: systemd would skip that one as well.
- name: Validate the quadlet units
  ansible.builtin.command: /usr/lib/systemd/system-generators/podman-system-generator -dryrun
  register: antarest_quadlet_check
  changed_when: false

- name: Check every expected service was generated
  ansible.builtin.assert:
    that:
      - "'---' ~ item ~ '---' in antarest_quadlet_check.stdout"
    fail_msg: >-
      The quadlet generator did not produce {{ item }}. Units present in
      /etc/containers/systemd:
      {{ antarest_quadlet_check.stdout | regex_findall('---(.+?)---') | join(', ') }}
    quiet: true
  loop: "{{ antarest_quadlet_services }}"

- name: Create the database schema before the backend starts
  ansible.builtin.include_tasks: migrate.yml

- name: Start and enable the Antares-Web stack
  ansible.builtin.systemd:
    name: "{{ antarest_service_name }}.target"
    enabled: true
    state: started
    daemon_reload: true

- name: Apply the pending restarts now
  ansible.builtin.meta: flush_handlers

- name: Wait for the web interface to answer
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ antarest_https_port if antarest_tls_active | bool else antarest_http_port }}"
    timeout: 300

# Over https once there is a certificate, since port 80 then only answers a
# redirect. Without certificate validation on purpose: the request goes to
# 127.0.0.1 and the certificate is issued for antarest_tls_domain, so the name
# could not match; what is being checked here is that the stack answers, not
# the certificate.
- name: Check the API is up
  ansible.builtin.uri:
    url: >-
      {{ 'https://127.0.0.1:' ~ antarest_https_port if antarest_tls_active | bool
         else 'http://127.0.0.1:' ~ antarest_http_port }}/api/health
    validate_certs: false
    status_code: [200]
  register: antarest_health
  retries: 30
  delay: 10
  until: antarest_health.status is defined and antarest_health.status == 200
