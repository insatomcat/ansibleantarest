---
# The upstream image entrypoint is scripts/start.sh, which launches gunicorn and
# nothing else. Creating the database schema is the job of scripts/pre-start.sh
# (`alembic upgrade head`, then a repair pass on tasks interrupted by a previous
# shutdown), and the project docker-compose.yml never calls it. On a fresh
# database the backend therefore boots into
#
#   psycopg2.errors.UndefinedTable: relation "groups" does not exist
#
# on its first write, and gunicorn dies with "Worker failed to boot".
#
# So the migration runs here, once, between postgresql and the backend.
# `alembic upgrade head` is idempotent, so re-running the play costs one no-op
# container.

# PostgreSQL refuses to start on a cluster written by another major, and says so
# only in the container journal: without this check the operator sees nothing but
# thirty failed readiness probes over 150 seconds. PG_VERSION is written by
# initdb and holds the major in plain text, so the mismatch can be named before
# anything starts. Absent on a first deployment, hence the guard.
- name: Read the major version of the cluster on disk
  ansible.builtin.slurp:
    src: "{{ antarest_data_dir }}/db/pgdata/PG_VERSION"
  register: antarest_pg_on_disk
  failed_when: false

- name: Fail when the data directory and the image disagree on the major
  vars:
    antarest_pg_disk_major: "{{ antarest_pg_on_disk.content | default('') | b64decode | trim }}"
    antarest_pg_image_major: >-
      {{ antarest_postgres_image | regex_replace('^.*:', '') | regex_replace('[^0-9].*$', '') }}
  ansible.builtin.assert:
    that: antarest_pg_disk_major == antarest_pg_image_major
    fail_msg: >-
      {{ antarest_data_dir }}/db/pgdata holds a PostgreSQL
      {{ antarest_pg_disk_major }} cluster and antarest_postgres_image is
      {{ antarest_postgres_image }}. PostgreSQL will not start on it. Changing
      major is a dump and a restore, see "Major database versions" in the README.
    quiet: true
  when:
    - antarest_pg_disk_major | length > 0
    - antarest_pg_image_major | length > 0

- name: Start the database before migrating
  ansible.builtin.systemd:
    name: postgresql.service
    state: started

# postgresql.service pulls the network up, which is when podman1 appears.
# firewalld has to be told about that bridge before anything on the network
# tries to resolve `postgresql` (the next two tasks).
- name: Let firewalld accept DNS on the podman bridge
  ansible.builtin.include_role:
    name: podman
    tasks_from: firewalld.yml
  when: ansible_facts['os_family'] == 'RedHat'

# postgresql publishes no port on the host, it is only reachable on the podman
# network, so readiness has to be asked from inside the container.
- name: Wait for PostgreSQL to accept connections
  ansible.builtin.command: "{{ container_cmd }} exec postgresql pg_isready -U postgres"
  register: antarest_pg_ready
  until: antarest_pg_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Create or upgrade the database schema
  ansible.builtin.command:
    cmd: >-
      {{ container_cmd }} run --rm
      --network {{ antarest_service_name }}
      --user {{ antares_uid }}:{{ antares_gid }}
      --entrypoint /scripts/pre-start.sh
      {% for volume in antarest_backend_volumes %}
      -v {{ volume }}
      {% endfor %}
      {{ antarest_image }}
  register: antarest_migration
  # alembic announces "Running upgrade <from> -> <to>" only when it actually
  # applies a revision, and says nothing when the database is already at head.
  # Reporting changed unconditionally would make every no-op run look like it
  # touched the schema.
  changed_when: >-
    'Running upgrade' in (antarest_migration.stdout ~ antarest_migration.stderr)

- name: Report what the migration did
  ansible.builtin.debug:
    msg: >-
      {{ (antarest_migration.stdout ~ antarest_migration.stderr)
         | regex_findall('Running upgrade [^\n]*') | join('; ')
         | default('schema already at head', true) }}
