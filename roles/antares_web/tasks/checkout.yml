---
- name: Install the packages needed to build Antares-Web
  ansible.builtin.package:
    name: "{{ antares_web_packages }}"
    state: present

- name: Create the Antares-Web base directory
  ansible.builtin.file:
    path: "{{ antarest_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# These two are written by the containers, which run as antares_uid, so they
# have to belong to that account. The base directory above does not.
- name: Create the Antares-Web directories owned by the antares account
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ antarest_checkout_owner }}"
    group: "{{ antarest_checkout_group }}"
    mode: "0755"
  loop:
    - "{{ antarest_deploy_dir }}"
    - "{{ antarest_data_dir }}"

# force: true so that a re-run can move the checkout to another tag even when
# the build left artefacts behind. Nothing we generate lives in the checkout,
# only build outputs (webapp/dist, node_modules), which git leaves alone.
- name: Clone or update the AntaREST repository
  ansible.builtin.git:
    repo: "{{ antarest_repo }}"
    dest: "{{ antarest_dir }}"
    version: "{{ antarest_version }}"
    update: "{{ antarest_update | bool }}"
    force: true
    # Nothing here needs the history, and on a fresh machine a full clone of
    # AntaREST is a noticeable part of the run. 0 means a full clone.
    depth: "{{ antarest_clone_depth | int if antarest_clone_depth | int > 0 else omit }}"
  # git runs as root here while the checkout belongs to the antares account, and
  # git refuses that as "dubious ownership". Declared through the environment
  # rather than by writing safe.directory into the machine's /etc/gitconfig: the
  # exception is scoped to this task and leaves no trace on the host.
  environment:
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: "{{ antarest_dir }}"
  register: antarest_checkout

# Cloned as root and chowned afterwards rather than cloned as the antares
# account directly. `become_user` to an unprivileged user needs a sudoers runas
# spec covering it, and a hardened policy commonly grants NOPASSWD to root only
# (`admin ALL=NOPASSWD:EXEC: ALL`), which makes sudo to any other user prompt for
# a password and the play fail. Cloning as root works everywhere.
#
# chown rather than the file module with recurse: true, which does not shell
# out to chown at all. It walks the tree in Python and stats, chowns and
# re-stats every path one at a time, which measured 11.3s on the 3200-odd
# paths of a fresh checkout, some 3.5ms each. That is the cheap case: with
# antarest_image_source left at `build`, the target keeps webapp/node_modules
# from the previous build, so the walk of an upgrade run also covers several
# tens of thousands of files to reassert an ownership almost all of them
# already have. chown does the same system calls in C, in under a second.
#
# Nothing is lost by it: the task is all-or-nothing and already gated on the
# checkout having moved, so `file` could not report anything finer either. It
# is skipped under --check, where a checkout that did not happen has nothing
# to chown anyway.
- name: Make sure the checkout belongs to the antares user
  ansible.builtin.command:
    cmd: >-
      chown -R {{ antarest_checkout_owner }}:{{ antarest_checkout_group }}
      {{ antarest_dir }}
  when: antarest_checkout.changed
  changed_when: true
