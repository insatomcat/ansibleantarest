---
# Everything that has to be true *before* the front door starts. Obtaining a
# Let's Encrypt certificate is the other half and lives in certbot.yml, because
# the http-01 challenge needs the very container this configures to be up.

- name: Check the TLS settings are complete
  ansible.builtin.assert:
    that:
      - antarest_tls_domain | length > 0
      - antarest_tls_provider in ['letsencrypt', 'selfsigned', 'manual']
      - antarest_tls_provider != 'letsencrypt' or antarest_tls_email | length > 0
      - antarest_tls_provider != 'manual' or antarest_tls_certificate | length > 0
      - antarest_tls_provider != 'manual' or antarest_tls_certificate_key | length > 0
    fail_msg: >-
      antarest_tls_enabled is on but the settings are incomplete on
      {{ inventory_hostname }}. antarest_tls_domain is the name the certificate
      is issued for and the one users type, antarest_tls_provider is one of
      letsencrypt / selfsigned / manual, letsencrypt also needs
      antarest_tls_email (expiry notices) and manual needs
      antarest_tls_certificate and antarest_tls_certificate_key, two paths on
      the target holding the full chain and the private key.
    quiet: true

# The ACME server connects to port 80 of the domain, full stop: the http-01
# challenge has no port to negotiate. A stack published on 8080 can never be
# validated, and certbot would only say so after a failed challenge.
- name: Check the interface is published where the ACME challenge is looked for
  ansible.builtin.assert:
    that:
      - antarest_http_port | int == 80
    fail_msg: >-
      antarest_http_port is {{ antarest_http_port }} and
      antarest_tls_provider is letsencrypt: the http-01 challenge is always
      fetched on port 80, so no certificate can be issued. Publish the front
      door on 80 (a reverse proxy in front can still forward from anywhere), or
      use antarest_tls_provider `manual` with a certificate obtained elsewhere.
    quiet: true
  when: antarest_tls_provider == 'letsencrypt'

# Both Let's Encrypt directories have to exist before the container starts, and
# neither one does on the run that turns TLS on: /etc/letsencrypt is created by
# the certbot package, which is only installed once the front door is up
# (certbot.yml), and the webroot belongs to this deployment alone. The
# container mounts both, and podman refuses a bind mount whose source is
# missing rather than creating it:
#
#   Error: statfs /etc/letsencrypt: no such file or directory
#
# The unit then fails with status=125, the container is never up to answer the
# challenge, and the run dies waiting for the port without ever reaching
# certbot. 0755 is the mode the certbot package ships; what it puts underneath
# (live/, archive/, 0700) is its own business and is left alone.
- name: Create the TLS directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: >-
    {{ [antarest_tls_dir]
       + (['/etc/letsencrypt', antarest_tls_webroot]
          if antarest_tls_provider == 'letsencrypt' else []) }}

# ---------------------------------------------------------------------------
#  SELinux and the Let's Encrypt tree
#
#  The front door mounts /etc/letsencrypt, and the `z` flag on that mount
#  relabels it container_file_t when the container starts. That is enough for
#  the files that are there at the time, and not enough afterwards: every
#  renewal writes new files under archive/, the policy gives them cert_t, and
#  the container - which is only reloaded, not restarted - can no longer read
#  the certificate it was just handed.
#
#  Recording the context with semanage is what makes it stick: the renewal hook
#  then only has to run restorecon, and any file created there from now on gets
#  the right label.
# ---------------------------------------------------------------------------
- name: Look for the recorded SELinux context of the Let's Encrypt tree
  ansible.builtin.command: semanage fcontext --list --noheading
  register: antarest_tls_fcontext
  changed_when: false
  check_mode: false
  when: antarest_tls_selinux | bool

- name: Record the SELinux context the front door needs on the certificates
  ansible.builtin.command: >-
    semanage fcontext -a -t container_file_t '/etc/letsencrypt(/.*)?'
  register: antarest_tls_fcontext_added
  when:
    - antarest_tls_selinux | bool
    - antarest_tls_fcontext.stdout is not search('/etc/letsencrypt\(/\.\*\)\?')
  changed_when: true

# Tolerant on purpose: on a first run /etc/letsencrypt does not exist yet, it
# is certbot that creates it a few tasks later, and the deploy hook relabels it
# as soon as there is a certificate in there.
- name: Apply it to what is already there
  ansible.builtin.command: restorecon -R /etc/letsencrypt
  when: antarest_tls_fcontext_added is changed
  changed_when: true
  failed_when: false

# openssl is a dependency of nothing installed so far, and the minimal cloud
# images of both families do without the command-line tool.
- name: Install openssl
  ansible.builtin.package:
    name: openssl
    state: present
  when: antarest_tls_provider == 'selfsigned'

# Ten years: this certificate exists to encrypt an internal deployment whose
# users click through the browser warning anyway, and a yearly regeneration
# would only mean clicking through it again.
- name: Generate the self-signed certificate
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes
      -subj "/CN={{ antarest_tls_domain }}"
      -addext "subjectAltName=DNS:{{ antarest_tls_domain }}"
      -keyout {{ antarest_tls_key }}
      -out {{ antarest_tls_cert }}
    creates: "{{ antarest_tls_cert }}"
  when: antarest_tls_provider == 'selfsigned'

- name: Protect the private key
  ansible.builtin.file:
    path: "{{ antarest_tls_key }}"
    owner: root
    group: root
    mode: "0600"
  when: antarest_tls_provider == 'selfsigned'

- name: Look for the certificate
  ansible.builtin.stat:
    path: "{{ antarest_tls_cert }}"
  register: antarest_tls_cert_stat

- name: Look for the private key
  ansible.builtin.stat:
    path: "{{ antarest_tls_key }}"
  register: antarest_tls_key_stat

- name: Check the supplied certificate is there
  ansible.builtin.assert:
    that:
      - antarest_tls_cert_stat.stat.exists
      - antarest_tls_key_stat.stat.exists
    fail_msg: >-
      antarest_tls_provider is `manual` but {{ antarest_tls_cert }} or
      {{ antarest_tls_key }} is missing on {{ inventory_hostname }}. Copy the
      full chain and the private key there before running the playbook, or
      switch to letsencrypt / selfsigned.
    quiet: true
  when: antarest_tls_provider == 'manual'

# The knob the templates read. Distinct from antarest_tls_enabled on purpose:
# on the very first run with letsencrypt there is no certificate yet, nginx
# would refuse to start with `cannot load certificate`, so the front door comes
# up on plain http, certbot answers its challenge through it, and certbot.yml
# turns this on and re-renders the configuration.
- name: Record whether the front door can serve TLS now
  ansible.builtin.set_fact:
    antarest_tls_active: >-
      {{ antarest_tls_cert_stat.stat.exists and antarest_tls_key_stat.stat.exists }}
