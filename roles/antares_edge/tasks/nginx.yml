---
# The configuration and the unit, in a file of their own because they are
# rendered twice on the run that obtains a certificate: once before the front
# door starts (plain http, so that certbot has something to answer the
# challenge with) and once after (TLS on, the redirect in place).

# Named, because each entry lands verbatim in an nginx location: a path
# without its leading slash, or a target with a space or a semicolon in it,
# is a front door that refuses to start rather than a redirect that fails.
- name: Check the front door redirects
  ansible.builtin.assert:
    that:
      - item.path | default('') is match('/[^\s;{}]*$')
      - item.to | default('') is match('(/|https?://)[^\s;{}]*$')
      - item.auth | default('') in ['', 'app', 'admin']
    fail_msg: >-
      antares_edge_redirects entry {{ item | to_json }} is not usable: it needs
      a `path` starting with /, a `to` that is a path or an http(s) URL, neither
      with a space, a semicolon or a brace in it, and an `auth` that is app,
      admin or left out. See docs/edge-and-tls.md.
    quiet: true
  loop: "{{ antares_edge_redirects }}"
  loop_control:
    label: "{{ item.path | default('(no path)') }}"

- name: Create the front door configuration directory
  ansible.builtin.file:
    path: "{{ antares_edge_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the front door configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ antares_edge_dir }}/nginx.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the front door

- name: Deploy the front door quadlet unit
  ansible.builtin.template:
    src: quadlet/antares-edge.container.j2
    dest: "/etc/containers/systemd/{{ antares_edge_container }}.container"
    owner: root
    group: root
    mode: "0644"
  register: antares_edge_unit
  notify: Restart the front door

- name: Reload systemd so the quadlet generator picks the unit up
  ansible.builtin.systemd:
    daemon_reload: true
  when: antares_edge_unit.changed
