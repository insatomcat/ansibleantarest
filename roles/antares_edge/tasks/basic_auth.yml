---
# The password files the front door asks against, and nothing else: which
# routes read them is in vars/main.yml, and the auth_basic lines themselves are
# generated by nginx.conf.j2.
#
# Runs whether or not a tier is configured. Emptying a list has to take the
# file away too: nginx.conf loses its auth_basic line the same run, and a file
# left behind would be the accounts of a tier somebody believed they had
# removed, waiting to be read again the day it came back.

# Named, and before anything is written. A password file nginx cannot parse is
# a front door that refuses to start; a password where a hash was expected is
# a login that never works, and a cleartext password in the inventory, which
# is the whole thing these lists exist to avoid.
- name: Check the front door password lists
  ansible.builtin.assert:
    that:
      - item.name | default('') | length > 0
      - item.name | default('') is not search('[:\s]')
      - item.hash | default('') | length > 0
      - item.hash | default('') is match('[${]')
    fail_msg: >-
      {{ antares_edge_htpasswd_dir }} is generated from
      antares_edge_basic_auth_users and antares_edge_basic_auth_admin_users,
      and this entry - {{ item | to_json }} - is not usable: every account
      needs a `name` without a colon or a space in it, and a `hash` rather
      than a password. Generate one with `openssl passwd -6` or
      `htpasswd -n <name>`. See docs/edge-and-tls.md.
    quiet: true
  loop: "{{ antares_edge_basic_auth_users + antares_edge_basic_auth_admin_users }}"
  loop_control:
    label: "{{ item.name | default('(no name)') }}"

- name: Create the front door password directory
  ansible.builtin.file:
    path: "{{ antares_edge_htpasswd_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: antares_edge_basic_auth_tiers | length > 0

# World-readable, deliberately. nginx opens this file per request, from a
# worker that has already dropped to its unprivileged user, so a mode that
# hides it from that user is a front door answering 403 to a correct password.
# What it holds are hashes, which is what the lists are written with.
- name: Deploy the front door password files
  ansible.builtin.template:
    src: htpasswd.j2
    dest: "{{ antares_edge_htpasswd_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ antares_edge_basic_auth_tiers }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart the front door

- name: Remove the password file of a tier that is not configured
  ansible.builtin.file:
    path: "{{ antares_edge_htpasswd_dir }}/{{ item }}"
    state: absent
  loop: "{{ ['app', 'admin'] | difference(antares_edge_basic_auth_names) }}"
  notify: Restart the front door
