---
# ===========================================================================
#  What the front door serves, and what it needs mounted
# ===========================================================================

# Same spelling as everywhere else in this repository: the access mode is
# written out so that container_volume_opts (the SELinux `,z`) has something to
# be appended to. See roles/antares_web/vars/main.yml.
_antares_edge_volume_opts: "{{ container_volume_opts | trim }}"

# Certificate actually served, resolved from the provider. `manual` is the only
# one where the operator chooses the paths; the other two are managed here.
antarest_tls_cert: >-
  {{ ('/etc/letsencrypt/live/' ~ antarest_tls_domain ~ '/fullchain.pem')
     if antarest_tls_provider == 'letsencrypt' else antarest_tls_certificate }}
antarest_tls_key: >-
  {{ ('/etc/letsencrypt/live/' ~ antarest_tls_domain ~ '/privkey.pem')
     if antarest_tls_provider == 'letsencrypt' else antarest_tls_certificate_key }}

# What the container needs to serve TLS. /etc/letsencrypt whole, because
# live/<domain>/*.pem are symlinks into archive/<domain>/ and a mount of live/
# alone would leave them dangling inside the container. The webroot is where
# certbot drops the challenge files, so it is only useful to that provider.
# Mounted read-only: nothing in the container writes there.
antares_edge_tls_volumes: >-
  {{ ((['/etc/letsencrypt:/etc/letsencrypt:ro',
        antarest_tls_webroot ~ ':' ~ antarest_tls_webroot_container ~ ':ro']
       if antarest_tls_provider == 'letsencrypt'
       else ([antarest_tls_cert | dirname, antarest_tls_key | dirname]
             | unique | map('regex_replace', '^(.*)$', '\1:\1:ro') | list))
      | map('regex_replace', '$', _antares_edge_volume_opts) | list)
     if antarest_tls_enabled | bool else [] }}

# The two password lists resolved to what the template needs: the name of the
# tier, the realm it announces and the accounts in it. A tier whose list is
# empty is dropped here, and that is the whole switch - no file is written, no
# mount is added, and the locations naming that tier are generated without an
# auth_basic line.
antares_edge_basic_auth_tiers: >-
  {{ [{'name': 'app',
       'realm': antares_edge_basic_auth_realm,
       'users': antares_edge_basic_auth_users},
      {'name': 'admin',
       'realm': antares_edge_basic_auth_admin_realm,
       'users': antares_edge_basic_auth_admin_users}]
     | selectattr('users') | list }}

# The tiers that are on, for a route to be tested against: a route may name a
# tier the inventory left empty, which is not an error but an ungated route.
antares_edge_basic_auth_names: >-
  {{ antares_edge_basic_auth_tiers | map(attribute='name') | list }}

# The password files, mounted as the directory holding them rather than one by
# one, so that the mount does not change when a tier is turned on or off.
# Read-only, like everything else this container is given.
antares_edge_basic_auth_volumes: >-
  {{ ([antares_edge_htpasswd_dir ~ ':' ~ antares_edge_htpasswd_container_dir ~ ':ro']
      | map('regex_replace', '$', _antares_edge_volume_opts) | list)
     if antares_edge_basic_auth_tiers else [] }}

antares_edge_volumes: >-
  {{ ([antares_edge_dir ~ '/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
      | map('regex_replace', '$', _antares_edge_volume_opts) | list)
     + antares_edge_tls_volumes + antares_edge_basic_auth_volumes }}

# The locations of the generated configuration. `path` is an nginx location
# prefix, `upstream` an address and a port on the loopback, `name` a comment,
# and `auth` the password list that guards it, if any: the web application is
# for the people who use the deployment, the three consoles next to it for the
# people who operate it. `token_path` is the sub-path of a route whose clients
# carry a credential of their own, see the template.
#
# Two routes declare one, and for the same reason: the Antares-Web front-end
# calls /api/ with a bearer token, and the Keycloak console calls the admin
# API under /auth/admin/ with one of its own. The console's own pages are
# under that prefix too and are still asked for a password, since they are
# fetched by the browser and carry no token. Grafana declares none: it
# authenticates with a session cookie and never touches the Authorization
# header.
#
# Antares-Web is always there and is the catch-all; anything else claims a
# prefix of its own, and nginx picks the longest match whatever the order.
# The Keycloak location is written without a trailing slash, so that /auth and
# /auth/ both land there rather than the first one falling through to the web
# application. Grafana and Prometheus are spelled the same way and for the
# same reason, and both are told the prefix they are served under, so the
# path is passed through untouched rather than stripped here.
antares_edge_routes: >-
  {{ [{'path': '/',
       'upstream': '127.0.0.1:' ~ antarest_nginx_port,
       'name': 'Antares-Web',
       'auth': 'app',
       'token_path': '/api/'}]
     + ([{'path': keycloak_relative_path,
          'upstream': '127.0.0.1:' ~ keycloak_port,
          'name': 'Keycloak',
          'auth': 'admin',
          'token_path': keycloak_relative_path ~ '/admin/'}]
        if keycloak_enabled | bool else [])
     + ([{'path': monitoring_grafana_path,
          'upstream': '127.0.0.1:' ~ monitoring_grafana_port,
          'name': 'Grafana',
          'auth': 'admin'}]
        if monitoring_enabled | bool else [])
     + ([{'path': monitoring_prometheus_path,
          'upstream': '127.0.0.1:' ~ monitoring_prometheus_port,
          'name': 'Prometheus',
          'auth': 'admin'}]
        if (monitoring_enabled | bool and monitoring_prometheus_public | bool) else [])
     + antares_edge_extra_routes }}
