---
# ===========================================================================
#  The front door of the machine
#
#  One nginx, in the host network namespace, holding antarest_http_port and
#  antarest_https_port and proxying to everything the deployment publishes on
#  the loopback: the Antares-Web nginx, Keycloak, whatever comes next.
#
#  It exists because the Antares-Web nginx cannot be that front door. That one
#  declares `Requires=antarest.service` and resolves `antarest` on the podman
#  network when its configuration is parsed, so it is down for as long as the
#  backend is, by design. Anything else served from it - the identity provider
#  first of all - would be down with it. This one only ever proxies to
#  addresses, never to names, so nothing it forwards to has to exist for it to
#  start: what is down answers 502, the rest keeps serving.
#
#  That is also why it is in the host network namespace rather than on the
#  podman network: on the network it would proxy to container names, nginx
#  would resolve them at parse time, and the dependency this role exists to
#  break would be back.
# ===========================================================================

# Load-bearing twice over, like the Antares-Web one: the fail2ban jail matches
# the journal on it, and the certbot renewal hook reloads it by that name.
antares_edge_container: antares-edge

# Where the rendered configuration goes. Under the same /etc/antares-web the
# TLS material lives in, so a machine has one configuration tree, not two.
antares_edge_dir: /etc/antares-web/edge

# Upload size accepted at the door. The Antares-Web nginx accepts 1G (it is in
# the file the project ships), and a smaller value here would turn a study
# import into a 413 before it ever reached it.
antares_edge_client_max_body_size: 1G

# How long a proxied request may stay silent. The Antares-Web configuration
# uses 1200 for the API, which is what a long study operation needs.
antares_edge_proxy_read_timeout: 1200

# Extra routes, appended to the ones the enabled roles declare. One entry per
# location, longest prefix wins whatever the order:
#
#   antares_edge_extra_routes:
#     - path: /reports/
#       upstream: 127.0.0.1:8090
#       name: Reports          # comment written next to the location
#       auth: admin            # optional: app, admin, or nothing at all
#
# What the deployment installs itself is already routed and does not belong
# here: the web application, Keycloak and, with monitoring_enabled, Grafana.
# See vars/main.yml.
#
# `upstream` is deliberately an address and a port rather than a name: see the
# header of this file. `auth` names one of the two password lists below; a
# route that names neither is served to anyone who reaches the front door.
antares_edge_extra_routes: []

# ---------------------------------------------------------------------------
#  The password in front of the password
#
#  The accounts themselves are antares_edge_basic_auth_users and
#  antares_edge_basic_auth_admin_users, in roles/antares_defaults/, because
#  verify.yml reads them too. What follows is the plumbing of the two tiers.
# ---------------------------------------------------------------------------

# What the browser writes above its password prompt: nginx sends it as the
# realm of the WWW-Authenticate header. It is read by whoever is being asked,
# so it is worth naming the deployment rather than the software.
antares_edge_basic_auth_realm: "Antares-Web"
antares_edge_basic_auth_admin_realm: "Antares administration"

# Where the two password files are written, one per tier, named after it. A
# directory of its own because it is bind-mounted whole into the container:
# one mount rather than one per tier, and a tier turned off simply loses its
# file.
antares_edge_htpasswd_dir: "{{ antares_edge_dir }}/htpasswd"
antares_edge_htpasswd_container_dir: /etc/nginx/htpasswd

# Addresses the front door never asks a password of, in CIDR form or as single
# addresses - it is rendered as an nginx `geo` block, which reads both.
#
# The machine itself, and that is not a hole to be tidied up. Everything the
# front door proxies to is published on that same loopback, so a password
# asked there would protect nothing that is not already reachable without it,
# and it would break the health checks of the deployment, which go through
# this container on purpose to test the routing rather than to log in.
#
# Adding the controller here is what gives verify.yml back the checks it makes
# through the front door on a gated deployment; see docs/operations.md.
antares_edge_basic_auth_trusted:
  - 127.0.0.0/8
  - ::1/128

# ---------------------------------------------------------------------------
#  TLS
#
#  Switched on with antarest_tls_enabled in roles/antares_defaults/, where the
#  domain, the provider and the mail address live. What follows is the
#  plumbing. The variables keep the antarest_ prefix they were deployed under
#  when the Antares-Web nginx still terminated TLS: they describe the TLS of
#  the deployment, and renaming them would silently turn TLS off on every
#  inventory that sets them.
# ---------------------------------------------------------------------------

# Where the self-signed certificate is written, and where a certificate copied
# by hand is expected by default.
antarest_tls_dir: /etc/antares-web/tls

# Directory certbot writes the challenge files into, bind-mounted read-only in
# the edge container at antarest_tls_webroot_container.
antarest_tls_webroot: /var/www/certbot
antarest_tls_webroot_container: /var/www/certbot

# Paths of the certificate and its key on the target, per provider.
#   letsencrypt: managed by certbot, under /etc/letsencrypt/live/<domain>/,
#                where the two files are symlinks into ../../archive/<domain>/
#                (hence /etc/letsencrypt as a whole in the mounts below).
#   selfsigned : generated by the role.
#   manual     : whatever antarest_tls_certificate / _key point at.
antarest_tls_certificate: "{{ antarest_tls_dir }}/{{ antarest_tls_domain }}.crt"
antarest_tls_certificate_key: "{{ antarest_tls_dir }}/{{ antarest_tls_domain }}.key"

# Redirect http to https. Off leaves the interface reachable over both, which
# is only reasonable while a deployment is being migrated.
antarest_tls_redirect_http: true

# Strict-Transport-Security max-age, in seconds (0 removes the header). The
# default is the six months of the Mozilla "intermediate" profile.
antarest_tls_hsts_max_age: 15768000

antarest_certbot_packages:
  - certbot

# Name of the renewal timer the certbot package ships: certbot.timer on the
# Debian family, certbot-renew.timer in the EPEL packaging.
antarest_certbot_timer: >-
  {{ 'certbot-renew.timer' if ansible_facts['os_family'] == 'RedHat' else 'certbot.timer' }}

# Set to true once the certificate is on disk, see tasks/tls.yml. Never set by
# hand: it is what keeps nginx from being told to serve a certificate that the
# first run has not obtained yet.
antarest_tls_active: false

# Whether the certificate tree needs SELinux attention. Only the letsencrypt
# provider does: it is the one whose files are rewritten behind the
# deployment's back, at every renewal, with the label the policy gives them
# rather than the one the container can read. See tasks/tls.yml.
antarest_tls_selinux: >-
  {{ (ansible_facts.selinux.status | default('disabled')) == 'enabled'
     and antarest_tls_provider == 'letsencrypt' }}

# How the certificate is obtained, and who hears about its expiry. The switch
# and the domain are antarest_tls_enabled and antarest_tls_domain, in
# roles/antares_defaults/: the hardening role decides which ports to open from
# the first without ever running this role.
antarest_tls_provider: letsencrypt
antarest_tls_email: ""                 # where Let's Encrypt sends expiry notices
# Issue against the Let's Encrypt staging CA: untrusted certificates, but rate
# limits that a debugging session cannot exhaust. Switching back to production
# needs a `certbot renew --force-renewal` (or removing the certificate), since
# the playbook only obtains one when there is none.
antarest_tls_staging: false
