---
- name: Check the distribution is supported
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - (ansible_distribution ~ ' ' ~ ansible_distribution_major_version) in supported_distros
    fail_msg: >-
      {{ inventory_hostname }} runs {{ ansible_distribution }}
      {{ ansible_distribution_version }}, which is not in supported_distros
      ({{ supported_distros | join(', ') }}). Every task installs packages with
      apt, so only the Debian family can work at all. Add the release to
      supported_distros to try it anyway, or set distro_check_enabled: false.
    quiet: true
  when: distro_check_enabled | bool

- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: "{{ apt_lock_timeout }}"

# 1000 is the first UID the installers hand out, so it is frequently taken
# already (`ubuntu` on the Ubuntu images, `debian` on the Debian cloud images).
# Both the group and the user task would fail on such a host, with a message
# that says nothing about which account is in the way, so name it here.
- name: Look for an account already holding the target UID
  ansible.builtin.command: "getent passwd {{ antares_uid }}"
  register: common_uid_holder
  changed_when: false
  failed_when: false

- name: Look for a group already holding the target GID
  ansible.builtin.command: "getent group {{ antares_gid }}"
  register: common_gid_holder
  changed_when: false
  failed_when: false

- name: Check the target UID and GID are free
  ansible.builtin.assert:
    that:
      - common_uid_holder.rc != 0 or common_uid_holder.stdout.split(':')[0] == antares_user
      - common_gid_holder.rc != 0 or common_gid_holder.stdout.split(':')[0] == antares_group
    fail_msg: >-
      UID {{ antares_uid }} / GID {{ antares_gid }} are not free on
      {{ inventory_hostname }}: passwd says
      "{{ common_uid_holder.stdout | default('') | trim | default('free', true) }}",
      group says
      "{{ common_gid_holder.stdout | default('') | trim | default('free', true) }}".
      That is the normal state on the Ubuntu images, where uid/gid 1000 is the
      `ubuntu` account. Set antares_uid and antares_gid in group_vars/all.yml
      to a pair that is free on every machine (1500 for instance), or free 1000
      there. Do not change them on a deployment that already holds data.
    quiet: true

- name: Create the antares group
  ansible.builtin.group:
    name: "{{ antares_group }}"
    gid: "{{ antares_gid }}"
    state: present

- name: Create the antares user
  ansible.builtin.user:
    name: "{{ antares_user }}"
    uid: "{{ antares_uid }}"
    group: "{{ antares_group }}"
    home: "{{ antares_home }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Read back the antares account
  ansible.builtin.getent:
    database: passwd
    key: "{{ antares_user }}"

# The whole deployment relies on UID/GID 1000 being the antares account: the
# containers run as 1000:1000 and write into bind mounts and, over SSH, into
# the shared /home. A mismatch produces permission errors that are painful to
# diagnose later, so fail early and loudly.
- name: Check the antares account owns the expected UID
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd[antares_user][1] | int == antares_uid | int
    fail_msg: >-
      User {{ antares_user }} has UID
      {{ ansible_facts.getent_passwd[antares_user][1] }} instead of
      {{ antares_uid }}. Another account probably already owns that UID on
      {{ inventory_hostname }}; free it or change antares_uid/antares_gid.
    quiet: true

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname.split('.')[0] }}"
  when: manage_hostname | bool

- name: Declare the cluster nodes in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED - antares cluster"
    block: |
      {% for host in (groups['slurm'] | default([])) | sort %}
      {{ hostvars[host].slurm_node_ip }} {{ hostvars[host].slurm_node_name }}
      {% endfor %}
  when:
    - manage_etc_hosts | bool
    - (groups['slurm'] | default([])) | length > 0

- name: Enable time synchronisation
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  when: common_manage_timesync | bool
  failed_when: false
