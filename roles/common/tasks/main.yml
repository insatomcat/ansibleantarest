---
# Both of these are tagged `always`: they are what makes any other install of
# the run work at all, and a run limited to --tags antares_web skips this play
# otherwise.
- name: Check the distribution is supported
  ansible.builtin.include_tasks: preflight.yml
  tags: always

- name: Prepare the package manager
  ansible.builtin.include_tasks: packages.yml
  tags: always

- name: Install the base packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present

# The group and the user task would both fail on a host where the pair is
# taken, with a message that says nothing about which account is in the way, so
# name it here. `check_mode: false` so that a --check run validates the pair
# across the whole inventory without installing anything, which is the cheap
# way to pick a UID before a multi-machine rollout.
- name: Look for an account already holding the target UID
  ansible.builtin.command: "getent passwd {{ antares_uid }}"
  register: common_uid_holder
  changed_when: false
  failed_when: false
  check_mode: false

- name: Look for a group already holding the target GID
  ansible.builtin.command: "getent group {{ antares_gid }}"
  register: common_gid_holder
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check the target UID and GID are free
  ansible.builtin.assert:
    that:
      - common_uid_holder.rc != 0 or common_uid_holder.stdout.split(':')[0] == antares_user
      - common_gid_holder.rc != 0 or common_gid_holder.stdout.split(':')[0] == antares_group
    fail_msg: >-
      UID {{ antares_uid }} / GID {{ antares_gid }} are not free on
      {{ inventory_hostname }}: passwd says
      "{{ common_uid_holder.stdout | default('') | trim | default('free', true) }}",
      group says
      "{{ common_gid_holder.stdout | default('') | trim | default('free', true) }}".
      Pick a pair that is free on every machine of the inventory, and set it
      there: high enough to stay clear of the accounts login.defs
      hands out from 1000 upwards. Beware that changing it on a machine that
      already holds data orphans everything the antares account owns.
    quiet: true

- name: Create the antares group
  ansible.builtin.group:
    name: "{{ antares_group }}"
    gid: "{{ antares_gid }}"
    state: present

- name: Create the antares user
  ansible.builtin.user:
    name: "{{ antares_user }}"
    uid: "{{ antares_uid }}"
    group: "{{ antares_group }}"
    home: "{{ antares_home }}"
    shell: /bin/bash
    create_home: true
    state: present

# Skipped under --check: the account was not created, so there is nothing to
# read back. The preflight above is what a --check run relies on, and it does
# run there.
- name: Read back the antares account
  ansible.builtin.getent:
    database: passwd
    key: "{{ antares_user }}"
  when: not ansible_check_mode

# The whole deployment relies on antares_uid/antares_gid being the antares
# account: the containers run as that pair and write into bind mounts and, over
# SSH, into the shared /home. A mismatch produces permission errors that are
# painful to diagnose later, so fail early and loudly.
- name: Check the antares account owns the expected UID
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd[antares_user][1] | int == antares_uid | int
    fail_msg: >-
      User {{ antares_user }} has UID
      {{ ansible_facts.getent_passwd[antares_user][1] }} instead of
      {{ antares_uid }}. Another account probably already owns that UID on
      {{ inventory_hostname }}; free it or change antares_uid/antares_gid.
    quiet: true
  when: not ansible_check_mode

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname.split('.')[0] }}"
  when: manage_hostname | bool

- name: Declare the cluster nodes in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED - antares cluster"
    block: |
      {% for host in (groups['slurm'] | default([])) | sort %}
      {{ hostvars[host].slurm_node_ip }} {{ hostvars[host].slurm_node_name }}
      {% endfor %}
  when:
    - manage_etc_hosts | bool
    - (groups['slurm'] | default([])) | length > 0

- name: Enable time synchronisation
  ansible.builtin.systemd:
    name: "{{ common_timesync_service | trim }}"
    enabled: true
    state: started
  when: common_manage_timesync | bool
  failed_when: false
