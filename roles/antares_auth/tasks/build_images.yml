---
# Builds the connector image from the sources in files/. Reused as it is by
# build.yml on the builder, which is why it assumes nothing about a stack being
# there: it assembles a context and calls container_cmd, and that is all.

- name: Create the connector build context
  ansible.builtin.file:
    path: "{{ antares_auth_build_dir }}/{{ antares_auth_source }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# A directory of its own, holding the connector sources and nothing else: it is
# what is shipped to the build, and the deploy directory next door holds the
# private key and hundreds of megabytes of solver binaries.
- name: Copy the connector sources
  ansible.builtin.copy:
    src: "{{ antares_auth_source }}/"
    dest: "{{ antares_auth_build_dir }}/{{ antares_auth_source }}/"
    owner: root
    group: root
    mode: "0644"
  register: antares_auth_sources

- name: Render the connector Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ antares_auth_build_dir }}/{{ antares_auth_source }}/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  register: antares_auth_dockerfile

- name: Look for an existing connector image
  ansible.builtin.command: "{{ container_cmd }} image inspect {{ antares_auth_image }}"
  register: antares_auth_image_present
  changed_when: false
  failed_when: false

- name: Decide whether the connector image must be rebuilt
  ansible.builtin.set_fact:
    antares_auth_rebuild: >-
      {{ antares_auth_force_rebuild | bool
         or antares_auth_image_present.rc != 0
         or antares_auth_sources.changed
         or antares_auth_dockerfile.changed }}

- name: Build the connector image
  ansible.builtin.command:
    cmd: >-
      {{ container_cmd }} build -t {{ antares_auth_image }}
      {{ antares_auth_build_dir }}/{{ antares_auth_source }}
  when: antares_auth_rebuild | bool
  changed_when: true
  register: antares_auth_image_built

# The notify lives on its own task rather than on the build above, because
# build.yml reuses these tasks on a builder machine, where there is no
# connector to restart and the handler would fail.
- name: Request a restart of the connector after a rebuild
  ansible.builtin.command: /bin/true
  when:
    - antares_auth_image_built is changed
    - not (antarest_builder_mode | default(false) | bool)
  changed_when: true
  notify: Restart the authentication connector
