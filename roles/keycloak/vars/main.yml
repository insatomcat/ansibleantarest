---
# ===========================================================================
#  What Keycloak has to be told about the front door
# ===========================================================================

_keycloak_scheme: "{{ 'https' if antarest_tls_enabled | bool else 'http' }}"
_keycloak_public_port: "{{ antarest_https_port if antarest_tls_enabled | bool else antarest_http_port }}"
_keycloak_default_port: "{{ 443 if antarest_tls_enabled | bool else 80 }}"

# The URL users reach Keycloak on. It is what Keycloak puts in the issuer of
# its tokens and in the links of its own pages, so it has to be the public name
# and not the loopback address the front door proxies to.
#
# Empty when no domain is configured, which is the case of a deployment reached
# by address: the unit then sets KC_HOSTNAME_STRICT=false and Keycloak works
# the value out of the Host and X-Forwarded-* headers the front door sets. That
# is a fallback rather than the normal case, since anything cached from a
# request with the wrong Host is then wrong.
keycloak_public_url: >-
  {{ '' if (antarest_tls_domain | default('', true) | trim | length == 0) else
     (_keycloak_scheme ~ '://' ~ antarest_tls_domain
      ~ ((':' ~ _keycloak_public_port)
         if _keycloak_public_port | int != _keycloak_default_port | int else '')
      ~ keycloak_relative_path) }}

# Same spelling as everywhere else: the access mode is written out so that
# container_volume_opts (the SELinux `,z`) has something to be appended to.
keycloak_volumes: >-
  {{ ([keycloak_dir ~ '/import:/opt/keycloak/data/import:ro']
      if keycloak_realm_import | bool else [])
     | map('regex_replace', '$', container_volume_opts | trim) | list }}

# ===========================================================================
#  The user profile of the imported realm
# ===========================================================================
#
# Keycloak's own default marks email, firstName and lastName required for the
# `user` role, and the VERIFY_PROFILE action is enabled. An account created
# from the console with a username and a password alone is therefore incomplete
# in Keycloak's eyes, and the direct access grant the connector logs people in
# with answers `Account is not fully set up` - a 401 at the Antares-Web login
# page, for a user the console shows as enabled, with a valid password and no
# required action against their name. The action is derived from this profile
# rather than written on the account, which is what makes it invisible there.
#
# So the realm is imported without those three requirements. It is the profile
# Keycloak ships, minus the `required` keys: the fields still exist, are still
# validated when filled, and an operator who wants them filled can say so in
# Realm settings > User profile. The connector already treats them as optional
# and falls back to the username when a first name is missing, so nothing
# downstream needs them.
keycloak_user_profile:
  attributes:
    - name: username
      displayName: "${username}"
      validations:
        length: {min: 3, max: 255}
        username-prohibited-characters: {}
        up-username-not-idn-homograph: {}
      permissions: {view: [admin, user], edit: [admin, user]}
      multivalued: false
    - name: email
      displayName: "${email}"
      validations:
        email: {}
        length: {max: 255}
      permissions: {view: [admin, user], edit: [admin, user]}
      multivalued: false
    - name: firstName
      displayName: "${firstName}"
      validations:
        length: {max: 255}
        person-name-prohibited-characters: {}
      permissions: {view: [admin, user], edit: [admin, user]}
      multivalued: false
    - name: lastName
      displayName: "${lastName}"
      validations:
        length: {max: 255}
        person-name-prohibited-characters: {}
      permissions: {view: [admin, user], edit: [admin, user]}
      multivalued: false
  groups:
    - name: user-metadata
      displayHeader: User metadata
      displayDescription: Attributes, which refer to user metadata

# ===========================================================================
#  Where the playbook talks to Keycloak
# ===========================================================================
#
# The loopback port the front door proxies to, and not keycloak_public_url: the
# playbook talks to the machine it is deploying, which has no reason to leave
# through the front door and come back, and this answers before a domain or a
# certificate exists. The master realm accepts a plain-http login from the
# loopback, which is what makes tasks/admin.yml possible.
keycloak_local_url: "http://127.0.0.1:{{ keycloak_port }}{{ keycloak_relative_path }}"
