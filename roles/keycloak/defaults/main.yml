---
# ===========================================================================
#  Keycloak, next to Antares-Web
#
#  One more container on the podman network of the stack, published on the
#  loopback for the front door to proxy to, and sharing the PostgreSQL the
#  backend already runs - in a database of its own, see tasks/database.yml.
#
#  Antares-Web does not speak OIDC. What it has is `security.external_auth`, a
#  URL it POSTs a username and a password to, so the bridge between the two is
#  the kc-rest connector of the antares_auth role. Keycloak alone authenticates
#  nobody here.
#
#  The switch (keycloak_enabled), the ports, the images and the secrets live in
#  roles/antares_defaults/: the front door has to route to it and the builder
#  has to archive its image, and neither of them runs this role.
# ===========================================================================

# Load-bearing: it is the name kc-rest resolves on the podman network.
keycloak_container: keycloak

# Rendered configuration: the realm to import. Under the same /etc/antares-web
# as the rest.
keycloak_dir: /etc/antares-web/keycloak

# Database and role created in the PostgreSQL of the stack. A database of its
# own rather than a schema in the one Antares-Web uses: Keycloak lays about
# ninety tables, and a migration on either side has no business meeting the
# other one's.
keycloak_db_name: keycloak
keycloak_db_user: keycloak

# Port Keycloak listens on inside the container. Published on
# 127.0.0.1:keycloak_port, see roles/antares_defaults/.
keycloak_http_port: 8080

# Import the realm rendered from templates/realm.json.j2 at the first start.
#
# At the first start and no other: Keycloak skips a realm that already exists,
# which is what keeps the users and groups created from the console since. A
# change to the template is therefore not applied by re-running the playbook,
# and replaying one is a decision, not a side effect - see
# docs/authentication.md.
keycloak_realm_import: true

# UID the Keycloak image runs as. The import file is written root:root 0640, so
# what makes it readable inside the container is the *group*: like every Red
# Hat base image, this one runs as uid 1000 with gid 0, and files given to the
# root group are readable by it. Written here because the alternative - a
# world-readable file - would put the client secret within reach of every
# account on the machine.
keycloak_image_gid: 0

# Java options appended to whatever the image sets.
keycloak_java_opts: ""

# Replace the administrator Keycloak bootstraps with a permanent one.
#
# Keycloak 26 marks the account it creates from KC_BOOTSTRAP_ADMIN_* temporary
# and asks, on every page of the console, for it to be replaced. tasks/admin.yml
# does exactly that and puts keycloak_admin_user back in its place, so the
# operator logs in with what the inventory says and reads no warning. Turn it
# off for a master realm managed by hand.
keycloak_admin_permanent: true

# The administrator the replacement is done from, since the name the operator
# configured is held by the temporary account until it is deleted. It lives
# between two tasks of the same run, and the run deletes it whenever it finds
# one.
keycloak_admin_rotate_user: "{{ keycloak_admin_user }}-rotate"

# ---------------------------------------------------------------------------
#  Realm settings, applied over the admin API on every run (realm_settings.yml)
#
#  The realm file is imported at the first start only, so whatever has to
#  hold on a realm that already exists is put there by the role instead.
# ---------------------------------------------------------------------------

# Keycloak's own syntax. Length over complexity rules, and no periodic
# expiry: both follow current guidance (NIST SP 800-63B), and an expiry
# mostly produces passwords written down.
keycloak_password_policy: "length(12) and maxLength(128) and notUsername and notEmail and passwordHistory(3)"

# Temporary lockout of an account after repeated failed logins, whatever the
# address they come from: the per-address banning in front of the login form
# (roles/hardening) does not see a guess spread over many addresses. After
# keycloak_brute_force_failures failures the account waits
# keycloak_brute_force_wait seconds, doubled at each new failure up to
# keycloak_brute_force_max_wait; the count is forgotten after
# keycloak_brute_force_reset seconds without a failure. Never permanent: a
# permanent lockout lets anyone who knows a username shut its owner out.
keycloak_brute_force_enabled: true
keycloak_brute_force_failures: 10
keycloak_brute_force_wait: 60
keycloak_brute_force_max_wait: 900
keycloak_brute_force_reset: 43200

# The event log: logins, failed logins, password changes, and every change
# made in the administration console, kept keycloak_events_retention days.
# Keycloak stores none of it by default.
keycloak_events_enabled: true
keycloak_events_retention: 365

# The groups the realm must have. The default is the left side of the
# group mapping Antares-Web reads, so that every group the mapping names
# exists; groups created from the console stay, this only adds.
keycloak_realm_groups: "{{ (antarest_external_auth_group_mapping | default({})).keys() | list }}"

# Mail sent by the realm: the "forgot password" link of the login page, and
# any action an administrator sends from the console (set a password, verify
# an e-mail). Empty host, no mail at all and no reset link on the login page.
# The relay is the same kind the alerts use: authenticated, STARTTLS on the
# submission port. Each user needs an e-mail address in Keycloak to get one.
keycloak_smtp_host: ""
keycloak_smtp_port: 587
keycloak_smtp_from: ""
keycloak_smtp_from_display_name: "Antares"
keycloak_smtp_user: ""
keycloak_smtp_password: ""

# The "Forgot password?" link of the login page. Follows the relay: offering
# it without a way to send the mail would only produce errors.
keycloak_reset_password_allowed: "{{ keycloak_smtp_host | length > 0 }}"

# How long a link the realm mails to a user stays valid, in seconds: the
# password reset, and the actions a user asks for themselves. Keycloak's
# default is 300, five minutes, which a mail that takes a minute to arrive
# and a user who reads it a few minutes later already exceed. Links an
# administrator sends from the console have their own lifespan, twelve
# hours by default.
keycloak_action_token_lifespan: 1800
