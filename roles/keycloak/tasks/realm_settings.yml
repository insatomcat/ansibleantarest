---
# The settings of the realm that have to hold on a realm that already
# exists, which the realm file cannot do: it is imported at the first start
# only. Password policy, lockout after repeated failures, the event log, and
# the groups the mapping of Antares-Web names. Read first, written only when
# something differs, so a run on a realm in order costs a few GETs.
#
# Same login as client_scope.yml, and the same answer to a master realm
# whose password was changed from the console: said so, and left alone.

- name: Log in to read the realm settings
  ansible.builtin.uri:
    url: "{{ keycloak_local_url }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      client_id: admin-cli
      grant_type: password
      username: "{{ keycloak_admin_user }}"
      password: "{{ keycloak_admin_password }}"
    status_code: [200, 400, 401]
  register: keycloak_settings_login
  changed_when: false
  no_log: true

- name: Say the realm settings were not checked
  ansible.builtin.debug:
    msg: >-
      keycloak_admin_password no longer opens the master realm, so the password
      policy, the lockout, the event log and the groups of the
      {{ keycloak_realm }} realm were not checked.
  when: keycloak_settings_login.status != 200

- name: Apply the realm settings
  when: keycloak_settings_login.status == 200
  vars:
    _keycloak_auth: "Bearer {{ keycloak_settings_login.json.access_token }}"
    _keycloak_realm_url: "{{ keycloak_local_url }}/admin/realms/{{ keycloak_realm }}"
    _keycloak_wanted:
      passwordPolicy: "{{ keycloak_password_policy }}"
      bruteForceProtected: "{{ keycloak_brute_force_enabled | bool }}"
      permanentLockout: false
      failureFactor: "{{ keycloak_brute_force_failures | int }}"
      waitIncrementSeconds: "{{ keycloak_brute_force_wait | int }}"
      maxFailureWaitSeconds: "{{ keycloak_brute_force_max_wait | int }}"
      maxDeltaTimeSeconds: "{{ keycloak_brute_force_reset | int }}"
      eventsEnabled: "{{ keycloak_events_enabled | bool }}"
      eventsExpiration: "{{ keycloak_events_retention | int * 86400 }}"
      adminEventsEnabled: "{{ keycloak_events_enabled | bool }}"
      adminEventsDetailsEnabled: "{{ keycloak_events_enabled | bool }}"
      resetPasswordAllowed: "{{ keycloak_reset_password_allowed | bool }}"
      actionTokenGeneratedByUserLifespan: "{{ keycloak_action_token_lifespan | int }}"
    # Keycloak keeps every value of smtpServer as a string, and answers the
    # password masked: it is left out of the comparison and sent with the
    # rest whenever anything else differs. Changing the password alone is
    # therefore not seen; see docs/authentication.md.
    _keycloak_smtp_wanted: >-
      {{ {} if keycloak_smtp_host | length == 0 else
         {'host': keycloak_smtp_host, 'port': keycloak_smtp_port | string,
          'from': keycloak_smtp_from, 'fromDisplayName': keycloak_smtp_from_display_name,
          'auth': (keycloak_smtp_user | length > 0) | string | lower,
          'user': keycloak_smtp_user, 'starttls': 'true', 'ssl': 'false'} }}
  block:
    - name: Read the realm
      ansible.builtin.uri:
        url: "{{ _keycloak_realm_url }}"
        headers:
          Authorization: "{{ _keycloak_auth }}"
      register: keycloak_settings_realm
      changed_when: false

    # Compared as strings, lowercased: what the API returns is JSON
    # (true, 60), what the variables give can be YAML or text.
    - name: Work out which realm settings differ
      ansible.builtin.set_fact:
        keycloak_settings_differ: >-
          {% for key, value in _keycloak_wanted.items()
             if (keycloak_settings_realm.json[key] | default('') | string | lower)
                != (value | string | lower) %}{{ key }} {% endfor %}

    # A partial representation: Keycloak updates the fields it is given and
    # leaves the others as they are.
    - name: Set the password policy, the lockout and the event log
      ansible.builtin.uri:
        url: "{{ _keycloak_realm_url }}"
        method: PUT
        headers:
          Authorization: "{{ _keycloak_auth }}"
        body_format: json
        body: "{{ _keycloak_wanted }}"
        status_code: [204]
      changed_when: true
      # An empty result comes back as null, hence the default.
      when: keycloak_settings_differ | default('', true) | trim | length > 0

    - name: Work out whether the mail settings of the realm differ
      ansible.builtin.set_fact:
        keycloak_smtp_differ: >-
          {{ (keycloak_settings_realm.json.smtpServer | default({}) | dict2items
              | rejectattr('key', 'equalto', 'password') | items2dict)
             != _keycloak_smtp_wanted }}

    - name: Set the mail settings of the realm
      ansible.builtin.uri:
        url: "{{ _keycloak_realm_url }}"
        method: PUT
        headers:
          Authorization: "{{ _keycloak_auth }}"
        body_format: json
        body:
          smtpServer: >-
            {{ _keycloak_smtp_wanted | combine({'password': keycloak_smtp_password})
               if _keycloak_smtp_wanted | length > 0 else {} }}
        status_code: [204]
      changed_when: true
      when: keycloak_smtp_differ | bool
      no_log: true

    # The user profile is a document of its own: read it, set the edit
    # permission of the four fields of an account, and write it back only
    # when that changed anything. The rest of it (validations, groups, the
    # policy on unmanaged attributes) is left as the realm has it.
    - name: Read the user profile of the realm
      ansible.builtin.uri:
        url: "{{ _keycloak_realm_url }}/users/profile"
        headers:
          Authorization: "{{ _keycloak_auth }}"
      register: keycloak_settings_profile
      changed_when: false

    - name: Work out who may edit each field of an account
      ansible.builtin.set_fact:
        keycloak_profile_wanted: >-
          {%- set out = [] -%}
          {%- for a in keycloak_settings_profile.json.attributes -%}
          {%- if a.name in ['username', 'email', 'firstName', 'lastName'] -%}
          {%- set _ = out.append(a | combine({'permissions': {
                'view': ['admin', 'user'],
                'edit': ['admin'] + (['user'] if a.name in keycloak_profile_user_editable else [])}})) -%}
          {%- else -%}
          {%- set _ = out.append(a) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ keycloak_settings_profile.json | combine({'attributes': out}) }}

    - name: Set who may edit each field of an account
      ansible.builtin.uri:
        url: "{{ _keycloak_realm_url }}/users/profile"
        method: PUT
        headers:
          Authorization: "{{ _keycloak_auth }}"
        body_format: json
        body: "{{ keycloak_profile_wanted }}"
        status_code: [200]
      changed_when: true
      when: keycloak_profile_wanted.attributes != keycloak_settings_profile.json.attributes

    - name: Read the groups of the realm
      ansible.builtin.uri:
        url: "{{ _keycloak_realm_url }}/groups?briefRepresentation=true&max=1000"
        headers:
          Authorization: "{{ _keycloak_auth }}"
      register: keycloak_settings_groups
      changed_when: false

    - name: Create the groups the mapping names
      ansible.builtin.uri:
        url: "{{ _keycloak_realm_url }}/groups"
        method: POST
        headers:
          Authorization: "{{ _keycloak_auth }}"
        body_format: json
        body:
          name: "{{ item }}"
        status_code: [201]
      changed_when: true
      loop: >-
        {{ (keycloak_realm_groups + keycloak_realm_admin_groups) | unique
           | difference(keycloak_settings_groups.json | map(attribute='name') | list) }}

    # The groups that administer the accounts of the realm, see
    # keycloak_realm_admin_groups. Their roles belong to the realm-management
    # client, which every realm has; a group just created above has no id in
    # the first read, hence the second one.
    - name: Give the account administrators their roles
      when: keycloak_realm_admin_groups | length > 0
      block:
        - name: Read the groups of the realm again
          ansible.builtin.uri:
            url: "{{ _keycloak_realm_url }}/groups?briefRepresentation=true&max=1000"
            headers:
              Authorization: "{{ _keycloak_auth }}"
          register: keycloak_admin_groups_read
          changed_when: false

        - name: Read the realm-management client
          ansible.builtin.uri:
            url: "{{ _keycloak_realm_url }}/clients?clientId=realm-management"
            headers:
              Authorization: "{{ _keycloak_auth }}"
          register: keycloak_admin_client
          changed_when: false

        - name: Read the roles of the realm-management client
          ansible.builtin.uri:
            url: "{{ _keycloak_realm_url }}/clients/{{ keycloak_admin_client.json[0].id }}/roles?max=1000"
            headers:
              Authorization: "{{ _keycloak_auth }}"
          register: keycloak_admin_roles
          changed_when: false

        # A role name Keycloak does not know would be dropped from the POST
        # below without a word, and the console would then refuse the
        # Secretariat a page with nothing on the deployment side to say why.
        - name: Check the account administrator roles exist
          ansible.builtin.assert:
            that: >-
              keycloak_realm_admin_roles
              | difference(keycloak_admin_roles.json | map(attribute='name') | list)
              | length == 0
            fail_msg: >-
              keycloak_realm_admin_roles names roles the realm-management client
              of the {{ keycloak_realm }} realm does not have:
              {{ keycloak_realm_admin_roles
                 | difference(keycloak_admin_roles.json | map(attribute='name') | list)
                 | join(', ') }}.
            quiet: true

        - name: Read the roles each account administrator group holds
          ansible.builtin.uri:
            url: >-
              {{ _keycloak_realm_url }}/groups/{{
              (keycloak_admin_groups_read.json | selectattr('name', 'equalto', item) | first).id
              }}/role-mappings/clients/{{ keycloak_admin_client.json[0].id }}
            headers:
              Authorization: "{{ _keycloak_auth }}"
          register: keycloak_admin_held
          changed_when: false
          loop: "{{ keycloak_realm_admin_groups }}"

        - name: Grant the account administrator groups the roles they lack
          vars:
            _missing: >-
              {{ keycloak_realm_admin_roles
                 | difference(item.json | map(attribute='name') | list) }}
          ansible.builtin.uri:
            url: "{{ item.url }}"
            method: POST
            headers:
              Authorization: "{{ _keycloak_auth }}"
            body_format: json
            body: "{{ keycloak_admin_roles.json | selectattr('name', 'in', _missing) | list }}"
            status_code: [204]
          changed_when: true
          loop: "{{ keycloak_admin_held.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: _missing | length > 0
