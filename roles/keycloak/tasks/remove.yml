---
# keycloak_enabled turned back off. The container goes away; the database it
# wrote stays, so turning it on again finds its realms, its users and its
# groups where it left them. Dropping that is a decision for an operator with a
# psql prompt, not for a variable.
#
# Deleting the unit file alone is not enough: the next daemon-reload makes the
# service unknown to systemd, but the container it started keeps running. So
# stop first, while the service still exists, then remove.
- name: Look for the Keycloak unit
  ansible.builtin.stat:
    path: "/etc/containers/systemd/{{ keycloak_container }}.container"
  register: keycloak_stale_unit

# No `enabled: false` to go with it: the unit is generated by quadlet and
# systemctl refuses to disable a generated unit, which would make this task
# fail before it ever got to the stop. What un-enables it is the removal of the
# .container file below, since the WantedBy= it carries is what quadlet turns
# into the wants of the target.
- name: Stop Keycloak
  ansible.builtin.systemd:
    name: "{{ keycloak_container }}.service"
    state: stopped
  when: keycloak_stale_unit.stat.exists

- name: Remove the Keycloak unit
  ansible.builtin.file:
    path: "/etc/containers/systemd/{{ keycloak_container }}.container"
    state: absent
  register: keycloak_unit_removed

- name: Reload systemd so the generator forgets it
  ansible.builtin.systemd:
    daemon_reload: true
  when: keycloak_unit_removed.changed
