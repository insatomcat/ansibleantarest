---
# The theme of the realm, on top of Keycloak's own:
#   - login: one page, Keycloak's info page with a link to Antares-Web where
#     Keycloak shows none, which is the page a member lands on after following
#     a link mailed from the console. Why, in files/theme/info.ftl;
#   - admin: a stylesheet that hides the tabs of an account the realm's
#     administrators do not use (keycloak_admin_hidden_tabs).
#
# Mounted read-only into /opt/keycloak/themes/, which Keycloak reads at
# start: a change restarts it. The realm is pointed at the theme by
# realm_settings.yml, and by the realm file for a new realm.

- name: Create the directories of the login theme
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ keycloak_theme_dir }}"
    - "{{ keycloak_theme_dir }}/login"
    - "{{ keycloak_theme_dir }}/login/messages"
    - "{{ keycloak_theme_dir }}/admin"
    - "{{ keycloak_theme_dir }}/admin/resources"
    - "{{ keycloak_theme_dir }}/admin/resources/css"

- name: Install the info page of the login theme
  ansible.builtin.copy:
    src: theme/info.ftl
    dest: "{{ keycloak_theme_dir }}/login/info.ftl"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Keycloak

- name: Write the settings, the wording and the stylesheet of the theme
  ansible.builtin.template:
    src: "theme/{{ item.src }}"
    dest: "{{ keycloak_theme_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: login-theme.properties.j2, dest: login/theme.properties}
    - {src: messages_en.properties.j2, dest: login/messages/messages_en.properties}
    - {src: admin/theme.properties.j2, dest: admin/theme.properties}
    - {src: admin/antares-admin.css.j2, dest: admin/resources/css/antares-admin.css}
  notify: Restart Keycloak
