---
docker_apt_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Used when docker_use_upstream_repo is false, and then the compose command has
# to be adjusted: Debian ships `docker-compose`, which is compose v1, so
# docker_compose_cmd must become /usr/bin/docker-compose. Ubuntu 24.04 has a
# `docker-compose-v2` package instead, whose version may still be below the
# 2.24 the compose override needs (see roles/antares_web/tasks/config.yml).
# Keeping the upstream repository is the supported path on both.
docker_distro_packages:
  - docker.io
  - docker-compose

# Membership in the docker group is equivalent to root on the machine; the
# playbook itself always runs docker as root, so this is off by default.
docker_add_antares_to_group: false
