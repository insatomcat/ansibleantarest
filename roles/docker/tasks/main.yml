---
- name: Install the packages needed to add the Docker repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: "{{ apt_lock_timeout }}"
  when: docker_use_upstream_repo | bool

- name: Add the Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
    suites: "{{ ansible_distribution_release }}"
    components: [stable]
    architectures: "{{ docker_apt_arch }}"
    signed_by: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    state: present
    enabled: true
  register: docker_repo
  when: docker_use_upstream_repo | bool

- name: Refresh the package lists
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: "{{ apt_lock_timeout }}"
  when: docker_repo.changed | default(false)

- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_packages if docker_use_upstream_repo | bool else docker_distro_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: "{{ apt_lock_timeout }}"

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Check the compose command works
  ansible.builtin.command: "{{ docker_compose_cmd }} version"
  register: docker_compose_version
  changed_when: false

- name: Allow the antares user to talk to the Docker socket
  ansible.builtin.user:
    name: "{{ antares_user }}"
    groups: docker
    append: true
  when: docker_add_antares_to_group | bool
