---
# The controller and the accounting daemon. Names follow slurm_repo, see
# roles/antares_defaults/ and roles/slurm_common/defaults/main.yml.
slurm_controller_packages: "{{ _slurm_controller_packages_by_repo[slurm_repo] }}"
_slurm_controller_packages_by_repo:
  distro: >-
    {{ ['slurmctld'] if ansible_facts['os_family'] == 'Debian' else ['slurm-slurmctld'] }}
  openhpc:
    - slurm-slurmctld-ohpc

slurmdbd_packages: "{{ _slurmdbd_packages_by_repo[slurm_repo] }}"
_slurmdbd_packages_by_repo:
  distro: >-
    {{ ['slurmdbd'] if ansible_facts['os_family'] == 'Debian' else ['slurm-slurmdbd'] }}
  openhpc:
    - slurm-slurmdbd-ohpc

# The reference procedure uses 12G, which does not fit a small front-end VM.
slurmdbd_innodb_buffer_pool_size: "1G"

# Where the accounting database keeps its state on the front-end.
slurmdbd_dir: /var/slurmdb
