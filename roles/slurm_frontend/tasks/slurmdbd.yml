---
- name: Install slurmdbd
  ansible.builtin.package:
    name: "{{ slurmdbd_packages }}"
    state: present

- name: Create the accounting database directory
  ansible.builtin.file:
    path: "{{ slurmdbd_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# The stack used to be a compose file driven by a wrapper systemd unit. Leaving
# that unit behind would keep a second, competing copy of MariaDB fighting for
# port 3306.
#
# The old docker named volume is deliberately NOT removed: it holds the
# accounting history. Migrating a live database means dumping it and restoring
# it into the podman volume, see the README.
- name: Stop the pre-quadlet compose unit if it is still there
  ansible.builtin.systemd:
    name: slurmdb
    state: stopped
    enabled: false
  failed_when: false

- name: Remove the pre-quadlet compose files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/slurmdb.service
    - "{{ slurmdbd_dir }}/docker-compose.yml"
  register: slurmdbd_legacy_removed

- name: Deploy the accounting database quadlet units
  ansible.builtin.template:
    src: "quadlet/{{ item }}.j2"
    dest: "/etc/containers/systemd/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ slurmdbd_quadlet_units }}"
  register: slurmdbd_quadlet

- name: Remove the quadlet units of disabled components
  ansible.builtin.file:
    path: "/etc/containers/systemd/{{ item }}"
    state: absent
  loop: "{{ slurmdbd_quadlet_all_units | difference(slurmdbd_quadlet_units) }}"
  register: slurmdbd_quadlet_removed

- name: Deploy the systemd target grouping the accounting database
  ansible.builtin.template:
    src: slurmdb.target.j2
    dest: /etc/systemd/system/slurmdb.target
    owner: root
    group: root
    mode: "0644"
  register: slurmdbd_target

- name: Reload systemd so the quadlet generator picks the units up
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    slurmdbd_quadlet.changed
    or slurmdbd_quadlet_removed.changed
    or slurmdbd_target.changed
    or slurmdbd_legacy_removed.changed

- name: Validate the quadlet units
  ansible.builtin.command: /usr/lib/systemd/system-generators/podman-system-generator -dryrun
  register: slurmdbd_quadlet_check
  changed_when: false

- name: Check the MariaDB service was generated
  ansible.builtin.assert:
    that: "'---slurmdb-mariadb.service---' in slurmdbd_quadlet_check.stdout"
    fail_msg: >-
      The quadlet generator did not produce slurmdb-mariadb.service. Units it
      did produce:
      {{ slurmdbd_quadlet_check.stdout | regex_findall('---(.+?)---') | join(', ') }}
    quiet: true

- name: Start and enable the accounting database
  ansible.builtin.systemd:
    name: slurmdb.target
    enabled: true
    state: started
    daemon_reload: true

- name: Let firewalld accept DNS on the podman bridge
  ansible.builtin.include_role:
    name: podman
    tasks_from: firewalld.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Restart the accounting database after a change
  ansible.builtin.systemd:
    name: slurmdb.target
    state: restarted
  when: slurmdbd_quadlet.changed or slurmdbd_target.changed

- name: Wait for MariaDB to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 3306
    timeout: 180

# MariaDB accepts TCP connections a few seconds before it is done initialising
# the data directory on a first start.
# `mariadb-admin` only exists from MariaDB 10.5 on, hence the fallback.
- name: Wait for MariaDB to finish its initialisation
  ansible.builtin.shell:
    cmd: >-
      {{ container_cmd }} exec
      -e MYSQL_PWD={{ slurmdbd_db_password | quote }} slurmdb-mariadb
      sh -c 'mariadb-admin ping --silent -uroot 2>/dev/null
             || mysqladmin ping --silent -uroot'
    executable: /bin/bash
  register: slurmdb_ping
  until: slurmdb_ping.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  no_log: true

- name: Deploy slurmdbd.conf
  ansible.builtin.template:
    src: slurmdbd.conf.j2
    dest: "{{ slurm_conf_dir }}/slurmdbd.conf"
    owner: "{{ slurm_user }}"
    group: "{{ slurm_user }}"
    mode: "0600"
  register: slurmdbd_conf

- name: Start and enable slurmdbd
  ansible.builtin.systemd:
    name: slurmdbd
    enabled: true
    state: started

- name: Restart slurmdbd after a configuration change
  ansible.builtin.systemd:
    name: slurmdbd
    state: restarted
  when: slurmdbd_conf.changed

# slurmdbd binds on DbdHost, which is the front-end name, not localhost.
- name: Wait for slurmdbd to listen
  ansible.builtin.wait_for:
    host: "{{ slurm_frontend_ip | trim }}"
    port: 6819
    timeout: 120
