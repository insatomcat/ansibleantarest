---
- name: Install slurmd
  ansible.builtin.package:
    name: "{{ slurmd_packages }}"
    state: present

- name: Create the slurmd spool directory
  ansible.builtin.file:
    path: "{{ slurm_spool_dir }}/d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install what the launch script runs
  ansible.builtin.package:
    name: "{{ slurm_compute_packages }}"
    state: present

# On the node's own disk, see slurm_scratch_dir. The launch script recreates it
# when systemd-tmpfiles has cleaned it away; creating it here is what makes a
# path outside /var/tmp, a local volume mounted for the purpose, work too.
- name: Create the scratch directory of the launch script
  ansible.builtin.file:
    path: "{{ slurm_scratch_dir }}"
    state: directory
    owner: "{{ antares_user }}"
    group: "{{ antares_group }}"
    mode: "0755"

# The slurm-wlm metapackage may have dragged slurmctld in; only the front-end
# is supposed to run a controller.
#
# Unless this machine *is* the front-end. A small deployment can put the
# controller and a compute node on the same host, and site.yml runs the
# front-end play before this one, so without this condition the run would start
# slurmctld and then stop and disable it a few tasks later, leaving a cluster
# with no controller and no error to explain it.
- name: Make sure no controller runs on a compute node
  ansible.builtin.systemd:
    name: slurmctld
    enabled: false
    state: stopped
  failed_when: false
  when: inventory_hostname not in (groups['slurm_frontend'] | default([]))

- name: Install the boot-time description of the node
  when: slurm_node_autosize | bool
  block:
    - name: Install the scripts that describe the node and put it back in service
      ansible.builtin.template:
        src: "{{ item }}.sh.j2"
        dest: "/usr/local/sbin/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop: [antares-slurm-node-size, antares-slurm-node-resume]

    - name: Install their units
      ansible.builtin.template:
        src: "{{ item }}.service.j2"
        dest: "/etc/systemd/system/{{ item }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: [antares-slurm-node-size, antares-slurm-node-resume]
      register: slurm_autosize_units

    - name: Enable them for the next boot
      ansible.builtin.systemd:
        name: "{{ item }}.service"
        enabled: true
        daemon_reload: "{{ slurm_autosize_units.changed }}"
      loop: [antares-slurm-node-size, antares-slurm-node-resume]

- name: Remove the boot-time description of the node
  when: not slurm_node_autosize | bool
  block:
    - name: Disable its units
      ansible.builtin.systemd:
        name: "{{ item }}.service"
        enabled: false
      loop: [antares-slurm-node-size, antares-slurm-node-resume]
      failed_when: false

    - name: Remove its units and scripts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/antares-slurm-node-size.service
        - /etc/systemd/system/antares-slurm-node-resume.service
        - /usr/local/sbin/antares-slurm-node-size
        - /usr/local/sbin/antares-slurm-node-resume

- name: Start and enable slurmd
  ansible.builtin.systemd:
    name: slurmd
    enabled: true
    state: started
    daemon_reload: true

- name: Restart slurmd after a configuration change
  ansible.builtin.systemd:
    name: slurmd
    state: restarted
  when: slurm_conf.changed | default(false)
