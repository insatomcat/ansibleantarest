---
- name: Install podman
  ansible.builtin.package:
    name: "{{ podman_packages if podman_install_docker_shim | bool else podman_packages | difference(['podman-docker']) }}"
    state: present

# `podman --version` prints "podman version 5.4.2" on one line. Deliberately
# not `podman version --format {{ ".Client.Version" }}`: the Go template braces
# collide with Jinja and have to be escaped, for no gain.
- name: Read the podman version
  ansible.builtin.command: podman --version
  register: podman_version
  changed_when: false

# Quadlet is what runs the whole stack, and it landed in podman 4.4. Every
# release in supported_distros is well past that, but a manually pinned or
# backported podman could not be.
- name: Check podman is recent enough for quadlet
  ansible.builtin.assert:
    that:
      - (podman_version.stdout | regex_search('[0-9]+\.[0-9]+\.[0-9]+')) is version('4.4.0', '>=')
    fail_msg: >-
      "{{ podman_version.stdout | trim }}" on {{ inventory_hostname }} is too
      old: the deployment is driven by quadlet units, which need podman 4.4 or
      later. Debian 13 ships 5.x, Ubuntu 24.04 ships 4.9, and EL 9 has been on
      4.4 or later since 9.2.
    quiet: true

# Checked rather than assumed: the whole deployment resolves containers by name
# on the podman network, and a missing aardvark-dns degrades silently. Asking
# podman where it expects the binary beats hardcoding a path that varies by
# distribution and version; with aardvark-dns absent, dns carries no `path` key
# at all.
- name: Read the podman network backend configuration
  ansible.builtin.command: "{{ container_cmd }} info --format json"
  register: podman_info_raw
  changed_when: false

- name: Fail when container name resolution would be unavailable
  ansible.builtin.assert:
    that:
      - ((podman_info_raw.stdout | from_json).host.networkBackendInfo.dns.path | default('')) | length > 0
    fail_msg: >-
      podman reports no DNS backend on {{ inventory_hostname }}, so containers
      could not resolve each other by name and the backend would never reach
      postgresql or redis. That binary ships in the aardvark-dns package, which
      podman merely *recommends* on the Debian family, so it is absent from any
      machine installed with --no-install-recommends. Check that the install
      above pulled it in.
    quiet: true

- name: Create the registry configuration directory
  ansible.builtin.file:
    path: /etc/containers/registries.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: podman_write_unqualified_registries | bool

# Debian family only, see the default: the RHEL rebuilds already ship an
# unqualified-search-registries list, and replacing it from here would quietly
# reorder which registry a short name resolves to on that machine.
- name: Allow short image names to resolve to Docker Hub
  ansible.builtin.template:
    src: registries-unqualified.conf.j2
    dest: /etc/containers/registries.conf.d/10-antares-unqualified.conf
    owner: root
    group: root
    mode: "0644"
  when: podman_write_unqualified_registries | bool

- name: Create the quadlet unit directory
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: "0755"

# Quadlet is a systemd generator: it turns the .container/.network files into
# transient services at every daemon-reload. Nothing to enable, but the
# generator has to be there.
- name: Check the quadlet generator is installed
  ansible.builtin.stat:
    path: /usr/lib/systemd/system-generators/podman-system-generator
  register: podman_quadlet_generator

- name: Fail when the quadlet generator is missing
  ansible.builtin.assert:
    that: podman_quadlet_generator.stat.exists
    fail_msg: >-
      /usr/lib/systemd/system-generators/podman-system-generator is missing on
      {{ inventory_hostname }}, so the quadlet units would never be turned into
      services. It ships with the podman package; check the install above.
    quiet: true

# aardvark-dns and PublishPort both need firewalld to treat the podman bridge
# as trusted. The nftables table does that with `iifname "podman*"`. Here the
# interfaces may not exist yet; migrate.yml and slurmdbd.yml call the same
# tasks again once the network is up.
- name: Allow container traffic through firewalld
  ansible.builtin.include_tasks: firewalld.yml
  when: ansible_facts['os_family'] == 'RedHat'
