---
# Everything here lands in the shared /home, so it only has to be done once,
# on the front-end.

- name: Create the shared scratch directory
  ansible.builtin.file:
    path: "{{ slurm_scratch_dir }}"
    state: directory
    owner: "{{ antares_user }}"
    group: "{{ antares_group }}"
    mode: "0755"

- name: Deploy the Antares launch script
  ansible.builtin.template:
    src: launchAntares.sh.j2
    dest: "{{ slurm_launch_script }}"
    owner: "{{ antares_user }}"
    group: "{{ antares_group }}"
    mode: "0755"

- name: Create the .ssh directory of the antares user
  ansible.builtin.file:
    path: "{{ antares_home }}/.ssh"
    state: directory
    owner: "{{ antares_user }}"
    group: "{{ antares_group }}"
    mode: "0700"
