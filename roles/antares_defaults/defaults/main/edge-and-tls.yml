---
# ===========================================================================
#  The front door and TLS
# ===========================================================================

# Image of the front door. The same nginx as the one serving the web
# application, deliberately a knob of its own: the front door is the only
# thing between the internet and the machine, and being able to move it to a
# newer nginx without rebuilding the Antares-Web artefacts is worth a second
# variable.
antares_edge_image: "{{ container_registry }}/nginx:1.30"

# ---------------------------------------------------------------------------
#  TLS
#
#  Terminated by the front door (the antares_edge role), which is also the only
#  thing that binds a port of the machine. Switching this on makes it listen on
#  antarest_https_port as well and, by default, redirect http to it. Everything
#  it proxies to - the web application, Keycloak - is served over https without
#  having to know about it.
#
#  antarest_tls_provider:
#    letsencrypt : certbot obtains the certificate over http-01. The challenge
#                  is answered by the front door itself (webroot method), so
#                  renewal needs no downtime and the certbot.timer shipped by
#                  the package handles it. Requires antares_tls_domain to
#                  resolve to this machine and port 80 to be reachable from the
#                  internet - that is what the ACME server connects to.
#    selfsigned  : a certificate generated on the machine. Encrypts the traffic,
#                  and every browser says so loudly. For an internal network,
#                  or to test the plumbing without burning ACME rate limits.
#    manual      : a certificate you copied on the machine yourself, for
#                  instance one issued by a company CA. Set
#                  antarest_tls_certificate / antarest_tls_certificate_key
#                  (see roles/antares_edge/defaults/main.yml) to the full chain
#                  and the private key.
#
#  First run with letsencrypt: the front door comes up on plain http, certbot
#  gets the certificate through it, and the playbook then reloads it with TLS
#  on. Nothing to do twice.
# ---------------------------------------------------------------------------
antarest_tls_enabled: false
antarest_tls_domain: ""                # e.g. antares.example.org

# ---------------------------------------------------------------------------
#  The password in front of the password
#
#  Two lists of accounts the front door asks for before it proxies anything.
#  The first guards the web application, the second the administration
#  interfaces served next to it (the Keycloak console, Grafana, Prometheus),
#  deliberately separate: the people who operate a deployment are not the
#  people who use it.
#
#  Empty is off, and empty is the default: a list with one account in it is
#  what turns its tier on. There is no *_enabled flag on purpose, so that
#  filling a list and forgetting a flag cannot leave the door open.
#
#      antares_edge_basic_auth_users:
#        - name: alice
#          hash: "$6$Xk1...$Yy..."
#
#  The hash, never the password. Generate one with either of:
#
#      openssl passwd -6                # SHA-512, what nginx reads through crypt(3)
#      htpasswd -n alice                # $apr1$, understood by nginx itself
#
#  Read by verify.yml as well as by the antares_edge role, which is why the
#  lists live here: what an answer through the front door proves depends on
#  whether it had to get past one. Everything else about the feature - the
#  realms, the addresses never asked for a password - is in
#  roles/antares_edge/defaults/main.yml, and the whole of it is documented in
#  docs/edge-and-tls.md.
# ---------------------------------------------------------------------------
antares_edge_basic_auth_users: []
antares_edge_basic_auth_admin_users: []

# The accounts verify.yml presents at the door, one per tier. Empty by
# default, and meant to be given at run time rather than stored - they are
# passwords in the clear, which is what the lists above exist to avoid:
#
#   ansible-playbook verify.yml \
#       -e antares_edge_basic_auth_probe_user=alice \
#       -e antares_edge_basic_auth_probe_password='...'
#
# Without them a probe that has to get past a gated door is asked from the
# machine instead, whose loopback the door never challenges. Every check keeps
# its meaning that way except the ones about the door itself: from a trusted
# address the gate is off entirely, so the exemptions it makes for everybody
# else - a bearer token under the token paths - are not exercised at all, and
# the CI had to log in through the door from outside to see one of them
# missing. Giving the credentials is what puts those back, and is what the CI
# does. See docs/operations.md.
antares_edge_basic_auth_probe_user: ""
antares_edge_basic_auth_probe_password: ""
antares_edge_basic_auth_admin_probe_user: ""
antares_edge_basic_auth_admin_probe_password: ""
