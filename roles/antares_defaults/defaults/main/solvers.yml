---
# ===========================================================================
#  Antares Simulator and Antares-Xpansion
# ===========================================================================

# ---------------------------------------------------------------------------
#  Antares Simulator (the solver)
#
#  Installed both on the Antares-Web machine (local launcher) and in the
#  shared /home of the cluster (Slurm launcher).
#
#  `study_version` is the key Antares-Web uses to pick a binary: it is the
#  "major.minor" of the study. `bin` is the executable name inside the
#  archive: `antares-<major>.<minor>-solver` up to 8.x, `antares-solver` from
#  9.x on.
#  Releases: https://github.com/AntaresSimulatorTeam/Antares_Simulator/releases
#
#  `antares_solver_os` picks which build of a release is downloaded, and that
#  is not cosmetic: the Ubuntu 22.04 build is linked against glibc 2.35 and
#  does not start on EL 9, which ships 2.34. The project also publishes an
#  Oracle Linux 8 build, whose glibc 2.28 runs on every EL 9 rebuild, so the
#  default follows the family of the target.
#
#  On a Slurm deployment the solvers are installed twice: on the Antares-Web
#  machine for the local launcher, and in the shared /home for the cluster.
#  Each side resolves this against its own facts, so a Debian web server
#  driving an Oracle Linux cluster gets the right binary on both.
# ---------------------------------------------------------------------------
antares_solver_os: >-
  {{ 'OracleServer-8.10' if ansible_facts['os_family'] == 'RedHat' else 'Ubuntu-22.04' }}
antares_solver_base_url: "https://github.com/AntaresSimulatorTeam/Antares_Simulator/releases/download"
antares_solvers:
  - version: "8.8.17"
    study_version: "8.8"
    bin: "antares-8.8-solver"
  - version: "9.2.0"
    study_version: "9.2"
    bin: "antares-solver"

# ---------------------------------------------------------------------------
#  Antares-Xpansion (investment optimisation)
#
#  Off by default, and deliberately: a release weighs about 250 MB and pulls
#  an MPI runtime onto every compute node, which a cluster that only runs
#  simulations has no use for. Turn it on to let Antares-Web submit Xpansion
#  jobs; the launch script refuses them with a clear message when it is off,
#  rather than quietly running an ordinary simulation.
#
#  A release bundles its *own* antares-solver, and that is what decides which
#  studies it can run - not the solvers installed next to it. From
#  `antares-version.json` of each tag:
#
#      Xpansion 1.3.0 -> Antares 8.8.3      Xpansion 1.6.0 -> 9.3.1
#      Xpansion 1.4.0 -> Antares 9.2.1      Xpansion 1.8.0 -> 9.3.6
#      Xpansion 1.5.0 -> Antares 9.3.0      Xpansion 1.9.0 -> 10.1.1
#
#  so `study_version` below is the major.minor of the *bundled* solver, and
#  that is the key the launch script matches the study against. The default
#  is the release that goes with the 9.2 studies of `antares_solvers` above.
#
#  Releases: https://github.com/AntaresSimulatorTeam/antares-xpansion/releases
#
#  Two keys are there for the releases that do not follow the usual shape:
#  `archive` when the asset is not named
#  `antaresXpansion-<version>-<os>.tar.gz`, and `bin` when the bundled solver
#  is not called `antares-solver`. Both are needed by 1.3.0, which carries an
#  extra `-xpress-`, ships an Ubuntu 20.04 build (and an Oracle Linux 8.9 one
#  rather than 8.10), and bundles the 8.8 line, whose executable still uses
#  the old `antares-<major>.<minor>-solver` name.
# ---------------------------------------------------------------------------
antares_xpansion_enabled: false
antares_xpansion_os: >-
  {{ 'OracleServer-8.10' if ansible_facts['os_family'] == 'RedHat' else 'ubuntu-22.04' }}
antares_xpansion_base_url: "https://github.com/AntaresSimulatorTeam/antares-xpansion/releases/download"
antares_xpansions:
  - version: "1.3.0"
    study_version: "8.8"
    bin: "antares-8.8-solver"
    archive: >-
      {{ 'antaresXpansion-1.3.0-xpress-OracleServer-8.9.tar.gz'
         if ansible_facts['os_family'] == 'RedHat'
         else 'antaresXpansion-1.3.0-xpress-ubuntu-20.04.tar.gz' }}
  - version: "1.4.0"
    study_version: "9.2"

# Controller-side cache of the solver tarballs. When a tarball is present here
# it is pushed to the target instead of being downloaded from GitHub again,
# which on a fresh machine is one of the longest steps of the whole run.
# Populated by build.yml.
antares_solver_cache_dir: "{{ antares_artifacts_dir }}"
