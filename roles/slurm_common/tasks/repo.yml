---
# Where the Slurm packages come from, on a family whose distribution ships
# none. Included from main.yml on every Slurm node, before the first install,
# so that slurm_frontend and slurm_compute find their own packages later.
#
# No EL repository packages Slurm: not the base repositories, not EPEL, which
# dropped it years ago. OpenHPC is the maintained answer, it is what the HPC
# world runs on EL, and its packages keep /etc/slurm, the systemd unit names
# and the slurm account exactly where every other distribution puts them. Only
# the package names change, and those live in defaults/main.yml.
#
# One series per major, not one series for everything: OpenHPC 3 publishes an
# EL_9 tree and nothing above, OpenHPC 4 publishes EL_10 and has no EL_9 tree.
# This role's defaults map the major to the release rpm; the two checks below
# are what happens when that mapping has nothing to say.

# A major OpenHPC publishes nothing for, EL 8 or whatever comes after 10 before
# OpenHPC follows. Said here, where the reason is, rather than fifteen tasks
# later on "No package slurm-ohpc available".
- name: Check OpenHPC publishes packages for this release
  ansible.builtin.assert:
    that:
      - slurm_openhpc_release | length > 0
    fail_msg: >-
      {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }} and no OpenHPC release
      package is known for EL {{ ansible_facts['distribution_major_version'] }}
      (see slurm_openhpc_release in roles/slurm_common/defaults/main.yml, which maps EL 9
      to OpenHPC 3 and EL 10 to OpenHPC 4). There is nothing to install Slurm
      from on this machine. Put the Slurm nodes on a major OpenHPC publishes
      for, set slurm_openhpc_release to a release rpm yourself, or set
      slurm_repo to `distro` and install Slurm yourself. The antares_web
      machine is not concerned: it reaches the cluster over SSH and runs on any
      of the supported majors.
    quiet: true

# The release rpm carries the major in its path and installs repositories built
# for it alone, so an EL_9 tree on an EL 10 machine leaves every slurm-ohpc
# package unresolvable. Only a URL that names a tree is tested: an operator
# pointing slurm_openhpc_release at a local mirror is taken at their word.
- name: Check the OpenHPC release package matches this major
  ansible.builtin.assert:
    that:
      - slurm_openhpc_release is not search('/EL_[0-9]+/')
        or slurm_openhpc_release is
           search('/EL_' ~ ansible_facts['distribution_major_version'] ~ '/')
    fail_msg: >-
      {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }} while slurm_openhpc_release
      points at a tree built for another major ({{ slurm_openhpc_release }}).
      The repositories it declares would carry no package this machine can
      install. Point it at the EL
      {{ ansible_facts['distribution_major_version'] }} release rpm of the
      matching OpenHPC series, or set slurm_repo to `distro` and install Slurm
      yourself.
    quiet: true

# ---------------------------------------------------------------------------
#  Installing the release package, and what to do when dnf refuses it
#
#  The rpm declares two dependencies beyond rpmlib, and both are nominal on a
#  distribution this deployment supports. Measured on the EL 9 one:
#
#      $ rpm -qpR ohpc-release-3-1.el9.x86_64.rpm
#      epel-release
#      redhat-release >= 9.1
#      $ rpm -qpl ohpc-release-3-1.el9.x86_64.rpm
#      /etc/ohpc-release
#      /etc/pki/rpm-gpg/RPM-GPG-KEY-OpenHPC-3
#      /etc/yum.repos.d/OpenHPC.repo
#
#  A repository file, the key it is signed with, and a version stamp. Neither
#  dependency is needed to put those three files on disk, and neither is
#  satisfiable everywhere:
#
#    `epel-release` on Oracle Linux 10. Oracle ships its own release package:
#    `oracle-epel-release-el9` provides the capability, `oracle-epel-release-el10`
#    does not, and Oracle's EPEL 10 mirror does not carry Fedora's
#    `epel-release` either, so dnf refuses with "nothing provides epel-release"
#    on a machine where EPEL is configured and enabled.
#
#    `redhat-release >= 9.1` on CentOS Stream 9. Stream is not a rebuild of a
#    RHEL minor, it is what the next minor is built from, and its release
#    package says so: `centos-stream-release` provides `redhat-release 9.0` for
#    the life of the stream, while carrying content newer than any 9.x. So the
#    requirement fails on a distribution that is ahead of it rather than behind,
#    and dnf answers with forty lines about centos-release-automotive
#    conflicting with centos-stream-release rather than with the one fact that
#    matters. The 10 stream is not concerned: it provides redhat-release 10.0.
#
#  So: dnf first, because it is the one that records the transaction and
#  verifies the signature, then rpm --nodeps wherever dnf did not manage it.
#  Trying rather than probing, deliberately. A probe has to know what to ask,
#  which means naming a distribution or hardcoding the very version the rpm
#  asks for, and the probe that would ask dnf itself is not available: `dnf
#  --setopt=tsflags=test` segfaults on dnf5 ("free(): invalid pointer",
#  measured on CentOS Stream 10). And what the fallback keys on is not whether
#  the dnf task failed but whether the package is now installed, which is the
#  question that actually decides what to do next and is the same question on
#  the second run.
# ---------------------------------------------------------------------------
- name: Install the OpenHPC release package
  ansible.builtin.dnf:
    name: "{{ slurm_openhpc_release }}"
    state: present
    # Same reason as EPEL in the common role: the release package is what
    # brings in the key its own repositories are signed with, so on the run
    # that installs it there is nothing to verify against yet. Everything
    # pulled from those repositories afterwards is checked normally.
    disable_gpg_check: true
  register: slurm_ohpc_release_dnf
  # Not a failure yet: the two distributions above land here on every run and
  # the fallback below is what installs the package there. A machine where
  # neither path worked is caught by the last task of this file.
  failed_when: false

# The NVR is what says whether the package is there: `rpm -q ohpc-release`
# prints what the release rpm is named minus the .rpm, so the two match on a
# machine that already carries this exact release, and differ on a first run,
# on a change of OpenHPC series, and on the run where dnf has just refused it.
# A release rpm renamed away from the upstream convention would be reinstalled
# on every run, and rpm says so rather than looping quietly.
- name: Read the OpenHPC release package now installed
  ansible.builtin.command:
    argv: [rpm, -q, ohpc-release]
  register: slurm_ohpc_release_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Note whether the release package still has to be installed
  ansible.builtin.set_fact:
    slurm_ohpc_release_missing: >-
      {{ slurm_ohpc_release_installed.stdout | default('') | trim
         != slurm_openhpc_release | basename | regex_replace('\.rpm$', '') }}

- name: Install the OpenHPC release package, minus its nominal dependencies
  ansible.builtin.command:
    argv: [rpm, -Uvh, --nodeps, "{{ slurm_openhpc_release }}"]
  register: slurm_ohpc_release_rpm
  changed_when: slurm_ohpc_release_rpm.rc == 0
  when: slurm_ohpc_release_missing | bool

# What dnf refused, kept in the log of the run that went round it: the reason
# is the interesting part the day one of those dependencies stops being
# nominal, and it is swallowed by the failed_when above otherwise.
- name: Report what dnf said about the release package
  ansible.builtin.debug:
    msg: >-
      dnf declined {{ slurm_openhpc_release | basename }} on
      {{ inventory_hostname }}, which is expected on Oracle Linux 10 and on
      CentOS Stream 9, and it was installed with rpm --nodeps instead. dnf
      said: {{ slurm_ohpc_release_dnf.msg | default('nothing') | truncate(300) }}
  when: slurm_ohpc_release_missing | bool

# Both paths have been tried by now. Saying so here keeps the failure at the
# task that is about the release package, rather than fifteen tasks later on
# "No package slurm-ohpc available", which is what a missing OpenHPC.repo
# actually produces.
- name: Check the OpenHPC repository is configured
  ansible.builtin.command:
    argv: [rpm, -q, ohpc-release]
  register: slurm_ohpc_release_final
  changed_when: false
  failed_when: slurm_ohpc_release_final.rc != 0
  check_mode: false

# OpenHPC's own recipe creates this account before installing anything, and so
# does the slurm-ohpc package. Doing it here as well pins what the daemons run
# as to slurm_user, which slurm.conf, the log directory and the spool directory
# all already assume.
- name: Create the slurm system group
  ansible.builtin.group:
    name: "{{ slurm_user }}"
    system: true
    state: present

- name: Create the slurm system account
  ansible.builtin.user:
    name: "{{ slurm_user }}"
    group: "{{ slurm_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ slurm_spool_dir }}"
    create_home: false
    state: present
