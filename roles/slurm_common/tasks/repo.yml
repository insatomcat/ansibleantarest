---
# Where the Slurm packages come from, on a family whose distribution ships
# none. Included from main.yml on every Slurm node, before the first install,
# so that slurm_frontend and slurm_compute find their own packages later.
#
# No EL 9 repository packages Slurm: not the base repositories, not EPEL, which
# dropped it years ago. OpenHPC is the maintained answer, it is what the HPC
# world runs on EL, and its packages keep /etc/slurm, the systemd unit names
# and the slurm account exactly where every other distribution puts them. Only
# the package names change, and those live in defaults/main.yml.

# OpenHPC 3 publishes an EL_9 tree and nothing above it, so on an EL 10 node
# the release rpm below would install a repository built for the previous major
# and every slurm-ohpc package would then be missing or unresolvable. Said here,
# where the reason is, rather than fifteen tasks later on "No package slurm-ohpc
# available". The test is on the shipped default only: an operator who points
# slurm_openhpc_release at another tree is taken at their word.
- name: Check OpenHPC publishes packages for this release
  ansible.builtin.assert:
    that:
      - slurm_openhpc_release is not search('/EL_9/')
        or ansible_facts['distribution_major_version'] == '9'
    fail_msg: >-
      {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }} and slurm_openhpc_release is
      still the EL 9 one ({{ slurm_openhpc_release }}). OpenHPC 3 has no EL 10
      tree, so there is nothing to install Slurm from on this machine. Keep the
      Slurm nodes on EL 9, point slurm_openhpc_release at an EL 10 release rpm
      once OpenHPC publishes one, or set slurm_repo to `distro` and install
      Slurm yourself. The antares_web machine is not concerned: it reaches the
      cluster over SSH and runs on either major.
    quiet: true

# CentOS Stream is not a rebuild of a RHEL minor, it is what the next one is
# built from, and its release package says so: it provides `redhat-release
# 9.0` and stays there for the life of the stream. The OpenHPC release rpm
# requires `redhat-release >= 9.1`, so dnf answers with forty lines about
# centos-release-automotive conflicting with centos-stream-release rather than
# with the one fact that matters. Same reasoning as the check above, and the
# same escape hatch: only the shipped repository is tested.
- name: Check the distribution can satisfy the OpenHPC release package
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] != 'CentOS'
        or slurm_openhpc_release is not search('repos.openhpc.community')
    fail_msg: >-
      {{ inventory_hostname }} runs {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}, which provides
      redhat-release 9.0 and always will, while the OpenHPC release package
      requires redhat-release >= 9.1. There is nothing to install Slurm from
      on this machine. Put the Slurm nodes on a RHEL rebuild - Oracle Linux,
      Rocky, AlmaLinux - or set slurm_repo to `distro` and install Slurm
      yourself. The antares_web machine is not concerned: it reaches the
      cluster over SSH and runs on CentOS Stream perfectly well.
    quiet: true

- name: Install the OpenHPC release package
  ansible.builtin.dnf:
    name: "{{ slurm_openhpc_release }}"
    state: present
    # Same reason as EPEL in the common role: the release package is what
    # brings in the key its own repositories are signed with, so on the run
    # that installs it there is nothing to verify against yet. Everything
    # pulled from those repositories afterwards is checked normally.
    disable_gpg_check: true

# OpenHPC's own recipe creates this account before installing anything, and so
# does the slurm-ohpc package. Doing it here as well pins what the daemons run
# as to slurm_user, which slurm.conf, the log directory and the spool directory
# all already assume.
- name: Create the slurm system group
  ansible.builtin.group:
    name: "{{ slurm_user }}"
    system: true
    state: present

- name: Create the slurm system account
  ansible.builtin.user:
    name: "{{ slurm_user }}"
    group: "{{ slurm_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ slurm_spool_dir }}"
    create_home: false
    state: present
