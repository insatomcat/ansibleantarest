---
- name: Install the NFS client
  ansible.builtin.package:
    name: "{{ nfs_client_packages }}"
    state: present

# /home comes over NFS on a compute node, and with SELinux enforcing the
# default policy does not let anything read a home directory there: sshd cannot
# read authorized_keys, and a job cannot read the study it was given. The
# symptom is a permission denied that the file modes flatly contradict.
- name: Allow SELinux to use home directories over NFS
  ansible.posix.seboolean:
    name: use_nfs_home_dirs
    state: true
    persistent: true
  when: (ansible_facts.selinux.status | default('disabled')) == 'enabled'

- name: Mount the shared home from the Slurm front-end
  ansible.posix.mount:
    src: "{{ slurm_frontend_name | trim }}:{{ nfs_export_path }}"
    path: "{{ nfs_export_path }}"
    fstype: nfs
    opts: "{{ nfs_mount_options }}"
    state: mounted
  when: not nfs_client_is_export_server | bool

- name: Check the shared home is really an NFS mount
  ansible.builtin.command: findmnt --noheadings --output FSTYPE,SOURCE --target {{ nfs_export_path }}
  register: nfs_findmnt
  changed_when: false
  when: not nfs_client_is_export_server | bool

- name: Fail when the shared home is not mounted over NFS
  ansible.builtin.assert:
    that: "'nfs' in nfs_findmnt.stdout"
    fail_msg: >-
      {{ nfs_export_path }} is not an NFS mount on {{ inventory_hostname }}:
      {{ nfs_findmnt.stdout }}
    quiet: true
  when: not nfs_client_is_export_server | bool

# The same question the assert above answers for a client, asked the other way
# round on the machine that serves the share: what the jobs read has to be the
# exported directory itself, not something mounted over it by an earlier shape
# of this deployment.
- name: Check the shared home of the server is its own directory
  ansible.builtin.command: findmnt --noheadings --output FSTYPE,SOURCE --target {{ nfs_export_path }}
  register: nfs_findmnt_server
  changed_when: false
  when: nfs_client_is_export_server | bool

- name: Fail when the server mounts its own export
  ansible.builtin.assert:
    that: "'nfs' not in nfs_findmnt_server.stdout"
    fail_msg: >-
      {{ nfs_export_path }} on {{ inventory_hostname }} is an NFS mount, and
      this machine is the one exporting it: {{ nfs_findmnt_server.stdout }}.
      That hides the exported directory behind a mount of itself. Unmount it
      ({{ nfs_export_path }}) and remove its line from /etc/fstab, then run
      again.
    quiet: true
  when: nfs_client_is_export_server | bool
