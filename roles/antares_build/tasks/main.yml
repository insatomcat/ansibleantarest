---
# Runs on the builder, after the antares_web build tasks have produced the image
# and webapp/dist in the checkout. Its only job is to turn those into archives
# the controller can hand to any number of targets.

# Emptied rather than just created: everything below is regenerated, and an
# archive left over from an older build would otherwise be shipped to the
# targets and loaded. Silently deploying a stale image is the worst failure mode
# this playbook could have.
- name: Reset the artefact directory on the builder
  ansible.builtin.file:
    path: "{{ antares_build_artifacts }}"
    state: "{{ item }}"
    mode: "0755"
  loop: [absent, directory]

- name: Save the Antares-Web image
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ container_cmd }} save --format docker-archive {{ antarest_image }}
      | gzip -1 > {{ antares_build_artifacts }}/antarest-image.tar.gz
    executable: /bin/bash
  changed_when: true

# Built by the antares_auth tasks this play ran just before, under the name the
# target expects to load. One archive whichever connector it is: only one is
# ever deployed, and a fixed name is what keeps the prune step below from
# leaving the image of the other one behind after a change of provider.
- name: Save the authentication connector image
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ container_cmd }} save --format docker-archive {{ antares_auth_image }}
      | gzip -1 > {{ antares_build_artifacts }}/{{ antares_auth_archive }}
    executable: /bin/bash
  when: antares_auth_provider != 'none'
  changed_when: true

# Pulled and saved here so that a target with no Internet access still gets
# them. gzip -1 because these are already-compressed layers: the extra CPU of a
# higher level buys almost nothing. `unique` because the two halves of the
# fleet default to the same adminer.
- name: Pull the third-party images
  ansible.builtin.command: "{{ container_cmd }} pull {{ item }}"
  loop: >-
    {{ (antares_build_thirdparty_images + antares_build_slurm_images
        + antares_build_monitoring_images) | unique }}
  changed_when: true

- name: Save the third-party images
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ container_cmd }} save --format docker-archive {{ item }}
      | gzip -1 > {{ antares_build_artifacts }}/thirdparty-{{ item | regex_replace('[^a-zA-Z0-9]', '-') }}.tar.gz
    executable: /bin/bash
  loop: "{{ antares_build_thirdparty_images }}"
  changed_when: true

# A prefix of their own, and not a matter of taste: the two targets do not want
# the same archives, and load_artifacts ships a whole directory rather than a
# list of files. `slurm-thirdparty-*` is one --exclude on the web side and one
# --include on the front-end side, where a shared name would have meant
# hundreds of megabytes of MariaDB on every web machine that has no cluster.
# The price is adminer saved twice when both halves publish one, which is the
# smaller of the two images and keeps each target's set self-contained.
- name: Save the Slurm front-end images
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ container_cmd }} save --format docker-archive {{ item }}
      | gzip -1 > {{ antares_build_artifacts }}/slurm-thirdparty-{{ item | regex_replace('[^a-zA-Z0-9]', '-') }}.tar.gz
    executable: /bin/bash
  loop: "{{ antares_build_slurm_images }}"
  changed_when: true

# One more prefix, for the same reason as the one above and with one more
# consumer: these are loaded by every machine of the inventory rather than by
# one of them, each taking the one or two archives it runs by name. Grafana
# alone is a couple of hundred megabytes, and a compute node runs a node
# exporter and nothing else.
- name: Save the monitoring images
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ container_cmd }} save --format docker-archive {{ item }}
      | gzip -1 > {{ antares_build_artifacts }}/{{ monitoring_image_archives[item] }}
    executable: /bin/bash
  loop: "{{ antares_build_monitoring_images }}"
  changed_when: true

- name: Archive the built web application
  ansible.builtin.command:
    cmd: >-
      tar -czf {{ antares_build_artifacts }}/webapp-dist.tar.gz -C {{ antarest_dir }}/webapp dist
  changed_when: true

# One tarball per solver *and* per build of it: a fleet whose web server runs
# Debian and whose cluster runs Oracle Linux needs both, and the targets pick
# theirs by name out of the same cache directory.
- name: Download the solver tarballs
  ansible.builtin.get_url:
    url: "{{ antares_solver_base_url }}/v{{ item.0.version }}/antares-{{ item.0.version }}-{{ item.1 }}.tar.gz"
    dest: "{{ antares_build_artifacts }}/antares-{{ item.0.version }}-{{ item.1 }}.tar.gz"
    mode: "0644"
  loop: "{{ antares_solvers | product(antares_build_solver_os) | list }}"
  loop_control:
    label: "antares-{{ item.0.version }}-{{ item.1 }}"
  when: antares_build_fetch_solvers | bool

# Same for Xpansion. The asset name is spelled out per entry when a release
# breaks the pattern, so the name in the cache is the name the target looks
# for and the OS list only applies to the ones that follow it.
- name: Download the Antares-Xpansion tarballs
  ansible.builtin.get_url:
    url: "{{ antares_xpansion_base_url }}/v{{ item.0.version }}/{{ antares_xpansion_archive }}"
    dest: "{{ antares_build_artifacts }}/{{ antares_xpansion_archive }}"
    mode: "0644"
  vars:
    antares_xpansion_archive: >-
      {{ item.0.archive | default('antaresXpansion-' ~ item.0.version ~ '-' ~ item.1 ~ '.tar.gz') }}
  loop: "{{ antares_xpansions | product(antares_build_xpansion_os) | list }}"
  loop_control:
    label: "antaresXpansion-{{ item.0.version }}-{{ item.1 }}"
  when: antares_build_fetch_xpansions | bool

# Recorded for whoever has to answer "what is actually in these archives", which
# is the question a fixed set of file names cannot answer on its own.
- name: Write a manifest next to the archives
  ansible.builtin.copy:
    content: |
      # Produced by build.yml on {{ inventory_hostname }}
      antarest_version: "{{ antarest_version }}"
      antarest_commit: "{{ antarest_checkout.after | default('unknown') }}"
      node_version: "{{ antarest_node_tag | default('unknown') }}"
      antares_uid: {{ antares_uid }}
      antares_gid: {{ antares_gid }}
      image: "{{ antarest_image }}"
      auth_connector: "{{ antares_auth_provider }}"
      built_at: "{{ ansible_facts['date_time']['iso8601'] | default('unknown') }}"
    dest: "{{ antares_build_artifacts }}/manifest.yml"
    mode: "0644"

- name: List what was produced
  ansible.builtin.find:
    paths: "{{ antares_build_artifacts }}"
    patterns: ["*.tar.gz", "manifest.yml"]
  register: antares_build_produced

# become: false because the play runs with become, and delegating to the
# controller would otherwise try to sudo on the machine running Ansible.
- name: Create the artefact directory on the controller
  ansible.builtin.file:
    path: "{{ antares_artifacts_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

# The fetch below overwrites file by file, by name, so an archive whose name
# changed since the last build survives next to its replacement: repinning
# postgres from `latest` to a major renames its archive, it does not replace it.
# load_artifacts.yml ships and loads every *.tar.gz it finds, so a leftover
# means hundreds of megabytes on the wire and unwanted images on every target.
# The solver tarballs are spared: they are a version-keyed cache that
# antares_solver_cache_dir also reads, and antares_build_fetch_solvers may well
# have been off for this run.
- name: List what the controller already holds
  ansible.builtin.find:
    paths: "{{ antares_artifacts_dir }}"
    patterns: ["*.tar.gz", "manifest.yml"]
  register: antares_artifacts_existing
  delegate_to: localhost
  become: false
  run_once: true

- name: Drop the artefacts this build did not produce
  ansible.builtin.file:
    path: "{{ antares_artifacts_dir }}/{{ item }}"
    state: absent
  loop: >-
    {{ antares_artifacts_existing.files | map(attribute='path') | map('basename') | list
       | difference(antares_build_produced.files | map(attribute='path') | map('basename') | list)
       | reject('match', 'antares-[0-9]') | list }}
  delegate_to: localhost
  become: false
  run_once: true

# rsync rather than ansible.builtin.fetch, and not as a matter of taste: with
# become in effect, fetch never takes its checksum shortcut. It skips the stat
# entirely ("don't bother if using become as slurp will be used") and pulls
# every archive base64-encoded through a module result, which means the whole
# file in memory on both ends. Measured on the same 720 MB, on one machine:
# 1006 seconds that way, 4.5 seconds for the rsync that ships the very same
# archives back out in load_artifacts.yml.
#
# The same include/exclude as that task, so the two directions carry the same
# thing. No --delete: the task above is what prunes, deliberately sparing the
# solver cache.
- name: Fetch the artefacts back to the controller
  ansible.posix.synchronize:
    mode: pull
    src: "{{ antares_build_artifacts }}/"
    dest: "{{ antares_artifacts_dir }}/"
    # The controller is not root, so preserving the builder's ownership is
    # both impossible and beside the point.
    owner: false
    group: false
    rsync_opts:
      - "--include=*.tar.gz"
      - "--include=manifest.yml"
      - "--exclude=*"

- name: Report the artefacts
  ansible.builtin.debug:
    msg: >-
      {{ antares_build_produced.files | length }} archives in
      {{ antares_artifacts_dir }},
      {{ (antares_build_produced.files | map(attribute='size') | sum / 1048576) | round(1) }} MB total.
      Deploy them with `-e antarest_image_source=archive`.
