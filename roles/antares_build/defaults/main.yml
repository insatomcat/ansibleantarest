---
# antares_build_root and antares_build_artifacts live in group_vars/all.yml:
# build.yml needs them in its play vars, to override container_cmd before the
# reused build tasks run, and role defaults are not visible there.

# Third-party images shipped alongside our own, so that a target with no
# Internet access can still start the stack. This is literally the list the
# target checks before starting, rather than a copy of it: a copy drifts, and
# the drift only shows up as a container that cannot pull on an offline machine.
# It follows that the switches deciding what is in it - antarest_enable_adminer,
# keycloak_enabled - have to be set where the builder sees them too
# (group_vars/all.yml), not only on the web host. Same for
# antares_auth_provider, which decides the connector image built next to them.
antares_build_thirdparty_images: "{{ antarest_thirdparty_images }}"

# Whether to also save the solver tarballs into the artefact directory.
antares_build_fetch_solvers: true

# Which builds of each solver to cache. The default is the one the builder's
# own family needs, which is the right answer when the fleet is homogeneous.
# The Ubuntu 22.04 build does not run on EL 9 and the Oracle Linux 8 one runs
# everywhere, so a mixed fleet - or a Debian builder feeding Oracle Linux
# targets - wants both:
#
#   antares_build_solver_os: ["Ubuntu-22.04", "OracleServer-8.10"]
#
# A target that finds no tarball for its own family in the cache falls back to
# downloading it from GitHub, so getting this wrong costs time, not a failure.
antares_build_solver_os:
  - "{{ antares_solver_os | trim }}"

# Same for the Antares-Xpansion releases, and off unless the deployment uses
# them: a release weighs about 250 MB, and caching one nobody unpacks only
# slows the build down. Same fallback as above, a target that finds nothing in
# the cache downloads from GitHub - which an offline target cannot do, hence
# this switch.
antares_build_fetch_xpansions: "{{ antares_xpansion_enabled }}"
antares_build_xpansion_os:
  - "{{ antares_xpansion_os | trim }}"

# The Slurm front-end's images travel in the same artefact set. It is a second
# machine with no Internet access either, and slurm_frontend loads them from
# there, so an offline cluster starts its accounting database without ever
# reaching Docker Hub. Empty when the deployment has no cluster, or no
# accounting database - and, like the switches above, slurm_enabled and
# slurmdbd_enabled have to be right where the builder sees them.
antares_build_slurm_images: >-
  {{ slurmdbd_thirdparty_images
     if (slurm_enabled | bool and slurmdbd_enabled | bool) else [] }}

# The monitoring images travel in the same artefact set, under a prefix of
# their own: every machine of the fleet loads one or two of them by name, and
# a compute node has no business receiving Grafana. Empty when the deployment
# is not monitored - and, like the switches above, monitoring_enabled and
# monitoring_slurm_enabled have to be right where the builder sees them, which
# is why the list itself lives in group_vars/all.yml.
antares_build_monitoring_images: "{{ monitoring_images }}"
